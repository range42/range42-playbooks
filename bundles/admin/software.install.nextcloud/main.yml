# ============================================================================
# bundles/admin/software.install.nextcloud/main.yml
# ============================================================================
# Nextcloud docker-compose stack install playbook. Deploys the nextcloud
# catalog element (postgres + redis + nextcloud + provisioner build:) on a
# dedicated VM via Docker compose. The catalog element source is
# range42-catalog/03_container_layer/docker/admin/nextcloud/ and is rsynced to
# the VM at /home/alice/nextcloud/.
#
# REQUIRED vars (passed by the calling scenario via import_playbook `vars:`) :
#   - global_vm_ssh_name   : inventory hostname for the Nextcloud VM
#                            (e.g. "r42.admin-nextcloud-standalone")
#   - global_vm_ci_ip      : IP of the Nextcloud server (e.g. "192.168.142.181")
#
# Catalog .env handling :
#   Play 1 (on the proxmox/local host) cp .env.example -> .env on the catalog
#   if .env is absent (force=false respects an existing customized .env). The
#   compose file uses ${VAR:-default} fallbacks for every variable, so the
#   stack boots with or without .env ; the seed is hygiene + lets the operator
#   customize creds. Populate the catalog .env BEFORE running for stronger creds.
#
#   IMPORTANT - NC_DOMAIN gotcha (NOT auto-fixed by this bundle) :
#   The catalog .env.example ships NC_DOMAIN=localhost 192.168.142.250, which
#   does NOT include this VM's IP. Nextcloud's trusted_domains check rejects
#   access via 192.168.142.181 unless NC_DOMAIN includes it. Edit the catalog
#   .env and add 192.168.142.181 to NC_DOMAIN BEFORE deploying (mirrors the
#   upstream README "edit .env before deploying" step).
#
# Service port :
#   This bundle opens 8080 (Nextcloud HTTP, the catalog HTTP_PORT default) on
#   the VM itself (Play 3). The scenario baseline only opens 22 ; a reusable
#   software bundle owns its own service port so INSTALL_NEXTCLOUD works in any
#   scenario without the scenario needing to know the port.
#
# First-boot egress :
#   The provisioner image builds from a local Dockerfile that fetches yq/jq from
#   GitHub - the VM needs OUTBOUND EGRESS during the first build. 4 services are
#   started : postgres (db) + redis + nextcloud + provisioner.
#
# Example call-site (in scenarios/<scenario>/.../admin-nextcloud.yml) :
#
#   - import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/admin/software.install.nextcloud/main.yml"
#     when: INSTALL_NEXTCLOUD | default("NO") | upper == "YES"
#     vars:
#       global_vm_ssh_name: "r42.admin-nextcloud-standalone"
#       global_vm_ci_ip:    "192.168.142.181"
#
# ============================================================================


- name: nextcloud - ensure catalog .env exists (cp .env.example -> .env if missing)
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: cp .env.example -> .env if .env absent (force=false respects an existing customized .env)
      ansible.builtin.copy:
        src:  "{{ lookup('env', 'RANGE42_INVENTORY') }}/03_container_layer/docker/admin/nextcloud/.env.example"
        dest: "{{ lookup('env', 'RANGE42_INVENTORY') }}/03_container_layer/docker/admin/nextcloud/.env"
        force: false
        remote_src: true

# #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: nextcloud - install Docker + docker-compose on the Nextcloud VM
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  gather_facts: true
  roles:
    - software.install.warmup.basic_packages
  vars:
    INSTALL_PACKAGES_BASICS:               "YES"
    INSTALL_PACKAGES_DOCKER:               "YES"
    INSTALL_PACKAGES_DOCKER_COMPOSE:       "YES"
    INSTALL_PACKAGES_NTP_AND_UPDATE_TIME:  "YES"

# #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: nextcloud - open firewall ports (22 SSH + 8080 HTTP)
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  gather_facts: false
  roles:
    - software.configure.firewalls
  vars:
    firewall_rules:
      - { ip: "all", port: 22,   protocol: "tcp" }
      - { ip: "all", port: 8080, protocol: "tcp" }

# #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: nextcloud - deploy nextcloud docker-compose stack from catalog
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  gather_facts: false
  pre_tasks:
    ##
    ## Seed .env on the VM (cp .env.example -> .env, force=false). The compose
    ## file has ${VAR:-default} fallbacks everywhere so this is hygiene, not a
    ## boot requirement ; it lets the operator customize creds on the VM and
    ## have subsequent re-deploys respect them. The rsync that follows transfers
    ## .env.example as a sibling, never touches .env.
    ##
    - name: ensure REMOTE_PROJECT_DIR exists on the VM (idempotent ; the role's CREATE TMP DIR runs the same op)
      ansible.builtin.file:
        path: "/home/alice/nextcloud"
        state: directory
        owner: "alice"
        group: "alice"
        mode: "0700"

    - name: push .env on the VM (cp .env.example -> .env if .env absent on the VM)
      ansible.builtin.copy:
        src:   "{{ lookup('env', 'RANGE42_INVENTORY') }}/03_container_layer/docker/admin/nextcloud/.env.example"
        dest:  "/home/alice/nextcloud/.env"
        owner: "alice"
        group: "alice"
        mode:  "0600"
        force: false
  roles:
    - software.configure.docker-compose
  vars:
    LABEL_PROJECT_TYPE:   "admin"
    LABEL_PROJET_NAME:    "nextcloud"
    LOCAL__PROJECT_DIR:   "{{ lookup('env', 'RANGE42_INVENTORY') }}/03_container_layer/docker/admin/nextcloud"
    REMOTE_PROJECT_DIR:   "/home/alice/nextcloud"
    OPERATOR_USER:        "alice"
    CLEAN_UP_DEPLOY_DIR:  "NO"
    SEND_POC_DIR:         "NO"
