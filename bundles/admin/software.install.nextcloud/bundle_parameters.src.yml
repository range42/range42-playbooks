---
bundle: admin/software.install.nextcloud

description: Nextcloud docker-compose stack (postgres + redis + nextcloud + provisioner) installed on a dedicated VM from the catalog element

optional: true

install_flag: INSTALL_NEXTCLOUD

params:
  - name: global_vm_ssh_name
    target: true
    type: string
    required: true
    default_where: call-site
    description: Inventory hostname of the Nextcloud VM; used as the hosts target of the install, firewall and deploy plays

  - name: global_vm_ci_ip
    type: string
    required: true
    default_where: call-site
    description: IP of the Nextcloud server; passed at the call-site as documentation of the web UI endpoint and not otherwise consumed by the plays

  - name: BUNDLE_CATALOG_SOURCE_DIR
    type: string
    required: false
    default_where: bundle-inline
    description: Optional controller delivery directory; uses its existing private .env instead of seeding
      demo defaults.
    default: ''
  - name: BUNDLE_CATALOG_REMOTE_DIR
    type: string
    required: false
    default_where: bundle-inline
    description: Catalog remote dir
    default: /home/alice/nextcloud
  - name: BUNDLE_CATALOG_OPERATOR
    type: string
    required: false
    default_where: bundle-inline
    description: Catalog operator
    default: alice
  - name: BUNDLE_CATALOG_PRIVATE
    type: bool
    required: false
    default_where: bundle-inline
    description: Catalog private
    default: false
