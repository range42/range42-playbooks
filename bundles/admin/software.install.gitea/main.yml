# ============================================================================
# bundles/admin/software.install.gitea/main.yml
# ============================================================================
# Gitea docker-compose stack install playbook. Deploys the gitea
# catalog element (postgres + gitea + provisioner build:) on a dedicated
# VM via Docker compose. The catalog element source is
# range42-catalog/03_container_layer/docker/admin/gitea/ and is rsynced to
# the VM at /home/alice/gitea/.
#
# REQUIRED vars (passed by the calling scenario via import_playbook `vars:`) :
#   - global_vm_ssh_name   : inventory hostname for the Gitea VM
#                            (e.g. "r42.admin-gitea-standalone")
#   - global_vm_ci_ip      : IP of the Gitea server (e.g. "192.168.142.183")
#
# Catalog .env handling :
#   Play 1 (on the proxmox/local host) cp .env.example -> .env on the catalog
#   if .env is absent (force=false respects an existing customized .env). The
#   compose file uses ${VAR:-default} fallbacks for every variable, so the
#   stack boots with or without .env ; the seed is hygiene + lets the operator
#   customize creds. Populate the catalog .env BEFORE running for stronger creds.
#
# Service ports :
#   This bundle opens 3000 (Gitea HTTP) AND 2222 (Gitea SSH) on the VM itself
#   (Play 3). The scenario baseline only opens 22 ; a reusable software bundle
#   owns its own service ports so INSTALL_GITEA works in any scenario without
#   the scenario needing to know the ports.
#
# Example call-site (in scenarios/<scenario>/.../admin-gitea.yml) :
#
#   - import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/admin/software.install.gitea/main.yml"
#     when: INSTALL_GITEA | default("NO") | upper == "YES"
#     vars:
#       global_vm_ssh_name: "r42.admin-gitea-standalone"
#       global_vm_ci_ip:    "192.168.142.183"
#
# ============================================================================


- name: gitea - ensure catalog .env exists (cp .env.example -> .env if missing)
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: cp .env.example -> .env if .env absent (force=false respects an existing customized .env)
      ansible.builtin.copy:
        src:  "{{ lookup('env', 'RANGE42_INVENTORY') }}/03_container_layer/docker/admin/gitea/.env.example"
        dest: "{{ lookup('env', 'RANGE42_INVENTORY') }}/03_container_layer/docker/admin/gitea/.env"
        force: false
        remote_src: true

# #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: gitea - install Docker + docker-compose on the Gitea VM
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  gather_facts: true
  roles:
    - software.install.warmup.basic_packages
  vars:
    INSTALL_PACKAGES_BASICS:               "YES"
    INSTALL_PACKAGES_DOCKER:               "YES"
    INSTALL_PACKAGES_DOCKER_COMPOSE:       "YES"
    INSTALL_PACKAGES_NTP_AND_UPDATE_TIME:  "YES"

# #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: gitea - open firewall ports (22 SSH + 3000 HTTP + 2222 Gitea SSH)
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  gather_facts: false
  roles:
    - software.configure.firewalls
  vars:
    firewall_rules:
      - { ip: "all", port: 22,   protocol: "tcp" }
      - { ip: "all", port: 3000, protocol: "tcp" }
      - { ip: "all", port: 2222, protocol: "tcp" }

# #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: gitea - deploy gitea docker-compose stack from catalog
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  gather_facts: false
  pre_tasks:
    ##
    ## Seed .env on the VM (cp .env.example -> .env, force=false). The compose
    ## file has ${VAR:-default} fallbacks everywhere so this is hygiene, not a
    ## boot requirement ; it lets the operator customize creds on the VM and
    ## have subsequent re-deploys respect them. The rsync that follows transfers
    ## .env.example as a sibling, never touches .env.
    ##
    - name: ensure REMOTE_PROJECT_DIR exists on the VM (idempotent ; the role's CREATE TMP DIR runs the same op)
      ansible.builtin.file:
        path: "/home/alice/gitea"
        state: directory
        owner: "alice"
        group: "alice"
        mode: "0700"

    - name: push .env on the VM (cp .env.example -> .env if .env absent on the VM)
      ansible.builtin.copy:
        src:   "{{ lookup('env', 'RANGE42_INVENTORY') }}/03_container_layer/docker/admin/gitea/.env.example"
        dest:  "/home/alice/gitea/.env"
        owner: "alice"
        group: "alice"
        mode:  "0600"
        force: false
  roles:
    - software.configure.docker-compose
  vars:
    LABEL_PROJECT_TYPE:   "admin"
    LABEL_PROJET_NAME:    "gitea"
    LOCAL__PROJECT_DIR:   "{{ lookup('env', 'RANGE42_INVENTORY') }}/03_container_layer/docker/admin/gitea"
    REMOTE_PROJECT_DIR:   "/home/alice/gitea"
    OPERATOR_USER:        "alice"
    CLEAN_UP_DEPLOY_DIR:  "NO"
    SEND_POC_DIR:         "NO"
