# ============================================================================
# bundles/admin/software.install.deployer_ui/main.yml
# ============================================================================
# Deploys range42-deployer-ui as a Docker container, following the canonical
# deploy method shipped by the repo (multi-stage Dockerfile + docker-compose
# + nginx serving the SPA bundle on port 80 + /health endpoint).
#
# Plays :
#   1. Install Docker Engine + compose plugin on the deployer-ui host
#      (via software.install.warmup.basic_packages with INSTALL_PACKAGES_DOCKER
#      + INSTALL_PACKAGES_DOCKER_COMPOSE flags)
#   2. Configure firewall on the host : open UI_PORT, keep 22
#   3. Sync the deployer-ui source tree from the controller to the VM
#      (excludes node_modules, .git, dist)
#   4. Template `.env` on the VM with UI_PORT
#   5. Run `docker compose up -d --build` in the project dir
#   6. Wait for /health endpoint to return 200
#
# REQUIRED vars (passed by the calling scenario via import_playbook `vars:`) :
#   - global_vm_ssh_name : inventory hostname for the deployer-ui host
#                          (e.g. "r42.admin-deployer-ui")
#   - global_vm_ci_ip    : IP of the deployer-ui host (informational ;
#                          not consumed by the plays themselves)
#
# OPTIONAL vars (with defaults) :
#   - LOCAL_CODE_PATH     : controller path to the range42-deployer-ui repo
#                           (default = $RANGE42_GITDIR__ROOT_DIR/range42-deployer-ui/)
#   - REMOTE_PROJECT_DIR  : remote project root (default /var/www/range42_deployer_ui)
#   - UI_PORT             : host port the container listens on (default 3000)
#
# Backend connection (production) :
#   The bundled `nginx/default.conf` in the deployer-ui repo serves only the
#   SPA + /health ; it does NOT proxy /v1, /v0, /ws to the backend. The UI
#   talks to the backend via CORS — the backend must allow the deployer-ui
#   origin. The backend API URL is configured at runtime via the in-app
#   Settings modal (per the repo's README), so no build-time env var is
#   needed here.
#
# Upgrade path :
#   - Pin a specific image tag (ghcr.io/range42/range42-deployer-ui:<sha>)
#     in the inventory once CI is set up to build + push (out of scope here)
#   - Add an external reverse proxy (Traefik) to terminate TLS and proxy
#     /v1, /v0, /ws to the backend if CORS becomes limiting
#
# Example call-site (in scenarios/<scenario>/02_admin_infrastructure/stage_01-vm_configure/deployer_ui.yml) :
#
# - import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/admin/software.install.deployer_ui/main.yml"
#   vars:
#     global_vm_ssh_name: "r42.admin-deployer-ui"
#     global_vm_ci_ip:    "192.168.142.103"
# ============================================================================

- name: install deployer-ui - Docker Engine + compose plugin
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  roles:
    - software.install.warmup.basic_packages
  vars:
    INSTALL_PACKAGES_BASICS: "YES"
    INSTALL_PACKAGES_DOCKER: "YES"
    INSTALL_PACKAGES_DOCKER_COMPOSE: "YES"

# ============================================================================

- name: install deployer-ui - firewall (open UI port, keep 22)
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  roles:
    - software.configure.firewalls
  vars:
    firewall_rules:
      - ip: "all"
        port: 22
        protocol: "tcp"
      - ip: "all"
        port: "{{ UI_PORT | default('3000') }}"
        protocol: "tcp"

# ============================================================================

- name: install deployer-ui - conditional tailscale (gated on INSTALL_TAILSCALE feature flag)
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"
  vars:
    tailscale_authkey: "{{ infrastructure_tailscale_authkey }}"
  tasks:
    - name: Install + configure tailscale on the UI VM (opt-in via INSTALL_TAILSCALE=YES)
      block:
        - include_role:
            name: software.install.tailscale
        - include_role:
            name: software.configure.tailscale_disable_nftables
      when: INSTALL_TAILSCALE | default('NO') | upper == "YES"

# ============================================================================

- name: install deployer-ui - sync source + .env + docker compose up
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  vars:
    LOCAL_CODE_PATH_RESOLVED: "{{ LOCAL_CODE_PATH | default(lookup('env', 'RANGE42_GITDIR__ROOT_DIR') + '/range42-deployer-ui/', true) }}"
    REMOTE_PROJECT_DIR_RESOLVED: "{{ REMOTE_PROJECT_DIR | default('/var/www/range42_deployer_ui') }}"
    UI_PORT_RESOLVED: "{{ UI_PORT | default('3000') }}"
  tasks:
    - name: Install rsync on remote (required for synchronize)
      ansible.builtin.apt:
        name: rsync
        state: present
        update_cache: false

    - name: Create remote project dir
      ansible.builtin.file:
        path: "{{ REMOTE_PROJECT_DIR_RESOLVED }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Sync deployer-ui source from controller to remote project dir
      ansible.posix.synchronize:
        src: "{{ LOCAL_CODE_PATH_RESOLVED }}"
        dest: "{{ REMOTE_PROJECT_DIR_RESOLVED }}/"
        delete: true
        recursive: true
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=dist"
          - "--exclude=.env"
          - "--exclude=.env.local"

    - name: Template /var/www/range42_deployer_ui/.env (UI_PORT)
      ansible.builtin.copy:
        dest: "{{ REMOTE_PROJECT_DIR_RESOLVED }}/.env"
        content: |
          # Managed by range42 / bundles/admin/software.install.deployer_ui
          # Host port for the Docker container.
          UI_PORT={{ UI_PORT_RESOLVED }}
        owner: root
        group: root
        mode: "0644"

    - name: Run docker compose up -d --build
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ REMOTE_PROJECT_DIR_RESOLVED }}"
      register: compose_up_result
      changed_when: >-
        ('Started' in compose_up_result.stdout)
        or ('Started' in compose_up_result.stderr)
        or ('Recreated' in compose_up_result.stdout)
        or ('Recreated' in compose_up_result.stderr)
        or ('Built' in compose_up_result.stdout)
        or ('Built' in compose_up_result.stderr)

    - name: Show docker compose up output (last lines)
      ansible.builtin.debug:
        var: compose_up_result.stderr_lines
      when: compose_up_result.stderr_lines | length > 0

# ============================================================================

- name: install deployer-ui - verify /health endpoint
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  vars:
    UI_PORT_RESOLVED: "{{ UI_PORT | default('3000') }}"
  tasks:
    - name: Wait for UI port to accept connections
      ansible.builtin.wait_for:
        port: "{{ UI_PORT_RESOLVED }}"
        host: 127.0.0.1
        delay: 5
        timeout: 120

    - name: Probe /health endpoint on the UI container
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ UI_PORT_RESOLVED }}/health"
        return_content: true
        status_code: 200
      register: health_status
      retries: 5
      delay: 5
      until: health_status.status == 200

    - name: Show /health response (expect 'ok')
      ansible.builtin.debug:
        var: health_status.content
