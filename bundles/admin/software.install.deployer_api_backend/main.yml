---
- name: Manage one authenticated backend container installation
  hosts: "{{ global_vm_ssh_name }}"
  gather_facts: false
  become: true
  tasks:
    - name: BACKEND INSTALL - Refuse obsolete implicit source and network changes
      ansible.builtin.assert:
        that:
          - BACKEND_IMAGE is defined
          - LOCAL_CODE_PATH is not defined
          - PLAYBOOKS_DEST_DIR is not defined
          - DEPLOYER_UI_CORS_REGEX is not defined
          - not (INSTALL_TAILSCALE | default(false) | bool)
        fail_msg: "Supply an immutable BACKEND_IMAGE and explicit runtime/CORS bindings. Source builds, partial playbooks mounts, CORS regex and network installation are not this consumer's contract."

    - name: BACKEND INSTALL - Build the explicit installation configuration
      ansible.builtin.set_fact:
        _backend_plan:
          root: "{{ BACKEND_INSTALL_ROOT | default(REMOTE_PROJECT_DIR | default('/var/lib/range42-backend')) }}"
          name: "{{ BACKEND_INSTALL_NAME | default('range42-backend') }}"
          image: "{{ BACKEND_IMAGE }}"
          uid: "{{ BACKEND_UID | default(1000) | int }}"
          gid: "{{ BACKEND_GID | default(1000) | int }}"
          port: "{{ API_PORT | default(8000) | int }}"
          listen_address: "{{ BACKEND_LISTEN_ADDRESS | default('127.0.0.1') }}"
          cors_origins: "{{ BACKEND_CORS_ORIGINS | default([]) }}"
          git_allowed_hosts: "{{ BACKEND_GIT_ALLOWED_HOSTS | default(['github.com', 'gitlab.com', 'codeberg.org']) }}"
      no_log: true

    - name: BACKEND INSTALL - Retain explicitly configured persistent and runtime paths
      ansible.builtin.set_fact:
        _backend_plan: "{{ _backend_plan | combine({item.key: item.value}) }}"
      loop:
        - {key: state_dir, value: "{{ BACKEND_STATE_DIR | default('') }}"}
        - {key: workspace_host, value: "{{ BACKEND_WORKSPACE_HOST | default(WORKSPACE_DIR_HOST | default('')) }}"}
        - {key: workspace_container, value: "{{ BACKEND_WORKSPACE_CONTAINER | default('') }}"}
        - {key: database_container, value: "{{ BACKEND_DATABASE_CONTAINER | default('') }}"}
        - {key: secrets_dir, value: "{{ BACKEND_SECRETS_DIR | default('') }}"}
        - {key: runtime_dir, value: "{{ BACKEND_RUNTIME_DIR | default('') }}"}
        - {key: workspace_template_dir, value: "{{ BACKEND_WORKSPACE_TEMPLATE_DIR | default('') }}"}
      when: item.value | length > 0
      no_log: true

    - name: BACKEND INSTALL - Allocate private helper transport
      ansible.builtin.tempfile:
        state: directory
        prefix: range42-installer-
      register: _backend_transport

    - name: BACKEND INSTALL - Run the managed consumer
      block:
        - name: BACKEND INSTALL - Transfer the matched installer helpers
          ansible.builtin.copy:
            src: files/
            dest: "{{ _backend_transport.path }}/"
            mode: '0600'
            directory_mode: '0700'

        - name: BACKEND INSTALL - Apply immutable container plan
          ansible.builtin.command:
            argv: [python3, "{{ _backend_transport.path }}/container_apply.py"]
            stdin: "{{ {'config': _backend_plan, 'operation': BACKEND_INSTALL_ACTION | default('apply')} | to_json }}"
          register: _backend_apply
          failed_when: false
          changed_when: false
          no_log: true

        - name: BACKEND INSTALL - Report a sanitized installation refusal
          ansible.builtin.fail:
            msg: "{{ (_backend_apply.stdout | from_json).error | default('Managed installation refused; private state retained') }}"
          when: _backend_apply.rc != 0

        - name: BACKEND INSTALL - Report managed installation state
          ansible.builtin.debug:
            msg: "Backend container {{ (_backend_apply.stdout | from_json).status }}"
          changed_when: (_backend_apply.stdout | from_json).changed | bool
      always:
        - name: BACKEND INSTALL - Remove only the temporary helper transport
          ansible.builtin.file:
            path: "{{ _backend_transport.path }}"
            state: absent
