---
- name: Manage one authenticated backend container installation
  hosts: "{{ global_vm_ssh_name }}"
  gather_facts: false
  become: true
  tasks:
    - name: BACKEND INSTALL - Validate deployment inputs
      ansible.builtin.assert:
        that:
          - BACKEND_IMAGE is not defined or LOCAL_CODE_PATH is not defined
          - PLAYBOOKS_DEST_DIR is not defined
          - DEPLOYER_UI_CORS_REGEX is not defined
        fail_msg: "Use the selected source checkout or an immutable BACKEND_IMAGE. Partial playbooks mounts and CORS regex are obsolete."

    - name: BACKEND INSTALL - Validate the explicit action and adoption file binding
      ansible.builtin.assert:
        that:
          - BACKEND_INSTALL_ACTION | default('apply') in ['apply', 'fresh', 'update', 'adopt-systemd']
          - BACKEND_INSTALL_ACTION | default('apply') != 'adopt-systemd' or BACKEND_IMAGE is defined
          - BACKEND_INSTALL_ACTION | default('apply') == 'adopt-systemd' or BACKEND_SYSTEMD_ADOPTION_FILE is not defined
          - BACKEND_INSTALL_ACTION | default('apply') != 'adopt-systemd' or (BACKEND_SYSTEMD_ADOPTION_FILE | default(none) is string and (BACKEND_SYSTEMD_ADOPTION_FILE | default('')).startswith('/'))
        fail_msg: "adopt-systemd requires BACKEND_SYSTEMD_ADOPTION_FILE as an absolute private target-host path. Other actions must omit it."
      no_log: true

    - name: BACKEND INSTALL - Build the explicit installation configuration
      ansible.builtin.set_fact:
        _backend_plan:
          root: "{{ BACKEND_INSTALL_ROOT | default(REMOTE_PROJECT_DIR | default('/var/lib/range42-backend')) }}"
          name: "{{ BACKEND_INSTALL_NAME | default('range42-backend') }}"
          image: "{{ BACKEND_IMAGE | default('') }}"
          uid: "{{ BACKEND_UID | default(1000) | int }}"
          gid: "{{ BACKEND_GID | default(1000) | int }}"
          port: "{{ API_PORT | default(8000) | int }}"
          listen_address: "{{ BACKEND_LISTEN_ADDRESS | default('127.0.0.1') }}"
          cors_origins: "{{ BACKEND_CORS_ORIGINS | default([]) }}"
          git_allowed_hosts: "{{ BACKEND_GIT_ALLOWED_HOSTS | default(['github.com', 'gitlab.com', 'codeberg.org']) }}"
      no_log: true

    - name: BACKEND INSTALL - Retain explicitly configured persistent and runtime paths
      ansible.builtin.set_fact:
        _backend_plan: "{{ _backend_plan | combine({item.key: item.value}) }}"
      loop:
        - {key: state_dir, value: "{{ BACKEND_STATE_DIR | default('') }}"}
        - {key: workspace_host, value: "{{ BACKEND_WORKSPACE_HOST | default(WORKSPACE_DIR_HOST | default('')) }}"}
        - {key: workspace_container, value: "{{ BACKEND_WORKSPACE_CONTAINER | default('') }}"}
        - {key: database_container, value: "{{ BACKEND_DATABASE_CONTAINER | default('') }}"}
        - {key: secrets_dir, value: "{{ BACKEND_SECRETS_DIR | default('') }}"}
        - {key: vault_password_host, value: "{{ BACKEND_VAULT_PASSWORD_HOST | default('') }}"}
        - {key: vault_password_container, value: "{{ BACKEND_VAULT_PASSWORD_CONTAINER | default('') }}"}
        - {key: runtime_dir, value: "{{ BACKEND_RUNTIME_DIR | default('') }}"}
        - {key: runtime_container, value: "{{ BACKEND_RUNTIME_CONTAINER | default('') }}"}
        - {key: runtime_config_container, value: "{{ BACKEND_RUNTIME_CONFIG_CONTAINER | default('') }}"}
        - {key: runtime_ca_container, value: "{{ BACKEND_RUNTIME_CA_CONTAINER | default('') }}"}
        - {key: workspace_template_dir, value: "{{ BACKEND_WORKSPACE_TEMPLATE_DIR | default('') }}"}
        - {key: workspace_template_container, value: "{{ BACKEND_WORKSPACE_TEMPLATE_CONTAINER | default('') }}"}
        - {key: inventory_container, value: "{{ BACKEND_INVENTORY_CONTAINER | default('') }}"}
        - {key: network_mode, value: "{{ BACKEND_NETWORK_MODE | default('') }}"}
      when: item.value | length > 0
      no_log: true

    - name: BACKEND INSTALL - Start source configuration with the installation root
      ansible.builtin.set_fact:
        _backend_source_config:
          root: "{{ _backend_plan.root }}"
      when: BACKEND_IMAGE is not defined

    - name: BACKEND INSTALL - Preserve unspecified settings from the managed record
      ansible.builtin.set_fact:
        _backend_source_config: "{{ _backend_source_config | combine({item.key: _backend_plan[item.key]}) }}"
      loop:
        - {key: name, configured: "{{ BACKEND_INSTALL_NAME is defined }}"}
        - {key: uid, configured: "{{ BACKEND_UID is defined }}"}
        - {key: gid, configured: "{{ BACKEND_GID is defined }}"}
        - {key: port, configured: "{{ API_PORT is defined }}"}
        - {key: listen_address, configured: "{{ BACKEND_LISTEN_ADDRESS is defined }}"}
        - {key: cors_origins, configured: "{{ BACKEND_CORS_ORIGINS is defined }}"}
        - {key: git_allowed_hosts, configured: "{{ BACKEND_GIT_ALLOWED_HOSTS is defined }}"}
        - {key: state_dir, configured: "{{ BACKEND_STATE_DIR is defined }}"}
        - {key: workspace_host, configured: "{{ BACKEND_WORKSPACE_HOST is defined or WORKSPACE_DIR_HOST is defined }}"}
        - {key: workspace_container, configured: "{{ BACKEND_WORKSPACE_CONTAINER is defined }}"}
        - {key: database_container, configured: "{{ BACKEND_DATABASE_CONTAINER is defined }}"}
        - {key: secrets_dir, configured: "{{ BACKEND_SECRETS_DIR is defined }}"}
        - {key: vault_password_host, configured: "{{ BACKEND_VAULT_PASSWORD_HOST is defined }}"}
        - {key: vault_password_container, configured: "{{ BACKEND_VAULT_PASSWORD_CONTAINER is defined }}"}
        - {key: runtime_dir, configured: "{{ BACKEND_RUNTIME_DIR is defined }}"}
        - {key: runtime_container, configured: "{{ BACKEND_RUNTIME_CONTAINER is defined }}"}
        - {key: runtime_config_container, configured: "{{ BACKEND_RUNTIME_CONFIG_CONTAINER is defined }}"}
        - {key: runtime_ca_container, configured: "{{ BACKEND_RUNTIME_CA_CONTAINER is defined }}"}
        - {key: workspace_template_dir, configured: "{{ BACKEND_WORKSPACE_TEMPLATE_DIR is defined }}"}
        - {key: workspace_template_container, configured: "{{ BACKEND_WORKSPACE_TEMPLATE_CONTAINER is defined }}"}
        - {key: inventory_container, configured: "{{ BACKEND_INVENTORY_CONTAINER is defined }}"}
        - {key: network_mode, configured: "{{ BACKEND_NETWORK_MODE is defined }}"}
      when: BACKEND_IMAGE is not defined and item.configured | bool
      no_log: true

    - name: BACKEND INSTALL - Prepare the consumer request without reading private proof contents
      ansible.builtin.set_fact:
        _backend_request: "{{ {'config': _backend_plan, 'operation': BACKEND_INSTALL_ACTION | default('apply')} | combine({'adoption_file': BACKEND_SYSTEMD_ADOPTION_FILE} if BACKEND_INSTALL_ACTION | default('apply') == 'adopt-systemd' else {}) }}"
      no_log: true

    - name: BACKEND INSTALL - Allocate private helper transport
      ansible.builtin.tempfile:
        state: directory
        prefix: range42-installer-
      register: _backend_transport

    - name: BACKEND INSTALL - Run the managed consumer
      block:
        - name: BACKEND INSTALL - Transfer the matched installer helpers
          ansible.builtin.copy:
            src: files/
            dest: "{{ _backend_transport.path }}/"
            mode: '0600'
            directory_mode: '0700'

        - name: BACKEND INSTALL - Ensure the source cache exists outside private installation state
          ansible.builtin.file:
            path: "{{ BACKEND_SOURCE_DIR | default('/var/cache/range42-backend/source') }}"
            state: directory
            mode: '0700'
          when: BACKEND_IMAGE is not defined

        - name: BACKEND INSTALL - Sync the selected backend checkout
          ansible.posix.synchronize:
            src: "{{ (LOCAL_CODE_PATH | default(lookup('env', 'RANGE42_GITDIR__ROOT_DIR') + '/range42-backend-api')) | regex_replace('/+$', '') }}/"
            dest: "{{ BACKEND_SOURCE_DIR | default('/var/cache/range42-backend/source') }}/"
            delete: true
            rsync_opts:
              - --exclude=.git
              - --exclude=.venv
              - --exclude=__pycache__
              - --exclude=.pytest_cache
              - --exclude=.container-secrets
              - --exclude=.env
              - --exclude=.env.*
              - --exclude=*.pem
              - --exclude=*.key
              - --exclude=*.db
              - --exclude=*.db-*
              - --exclude=_local-specs
              - --exclude=workspaces
          when: BACKEND_IMAGE is not defined

        - name: BACKEND INSTALL - Build the source image and resolve preserved bindings
          ansible.builtin.command:
            argv: [python3, "{{ _backend_transport.path }}/container_source.py"]
            stdin: "{{ {'config': _backend_source_config, 'source': BACKEND_SOURCE_DIR | default('/var/cache/range42-backend/source')} | combine({'operation': BACKEND_INSTALL_ACTION} if BACKEND_INSTALL_ACTION is defined else {}) | to_json }}"
          register: _backend_source
          failed_when: false
          changed_when: false
          no_log: true
          when: BACKEND_IMAGE is not defined

        - name: BACKEND INSTALL - Report source preparation failure
          ansible.builtin.fail:
            msg: "Source preparation failed; the previous backend and its private state are unchanged. Verify the checkout, Docker build and installation root."
          when: BACKEND_IMAGE is not defined and _backend_source.rc != 0

        - name: BACKEND INSTALL - Pass the automatically resolved immutable image to the consumer
          ansible.builtin.set_fact:
            _backend_request: "{{ _backend_source.stdout | from_json }}"
          no_log: true
          when: BACKEND_IMAGE is not defined

        - name: BACKEND INSTALL - Apply immutable container plan
          ansible.builtin.command:
            argv: [python3, "{{ _backend_transport.path }}/container_apply.py"]
            stdin: "{{ _backend_request | to_json }}"
          register: _backend_apply
          failed_when: false
          changed_when: false
          no_log: true

        - name: BACKEND INSTALL - Report a sanitized installation refusal
          ansible.builtin.fail:
            msg: "{{ (_backend_apply.stdout | from_json).error | default('Managed installation refused; private state retained') }}"
          when: _backend_apply.rc != 0

        - name: BACKEND INSTALL - Report managed installation state
          ansible.builtin.debug:
            msg: "Backend container {{ (_backend_apply.stdout | from_json).status }}"
          changed_when: (_backend_apply.stdout | from_json).changed | bool
      always:
        - name: BACKEND INSTALL - Remove only the temporary helper transport
          ansible.builtin.file:
            path: "{{ _backend_transport.path }}"
            state: absent
