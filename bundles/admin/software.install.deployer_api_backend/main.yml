---
# Native API installation using the application's existing Compose contract.
# Prepare private secrets, the reviewed runtime and the native context first.
# Updates use the documented drain/stop workflow; this bundle never stops a
# running API or replaces credentials. See this bundle's README.

- name: install deployer-api-backend - validate installation inputs
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  gather_facts: false
  tags: [api_preflight]
  vars: &api_install_vars
    LOCAL_CODE_PATH_RESOLVED: "{{ LOCAL_CODE_PATH | default(lookup('env', 'RANGE42_GITDIR__ROOT_DIR') + '/range42-backend-api/', true) }}"
    REMOTE_PROJECT_DIR_RESOLVED: "{{ REMOTE_PROJECT_DIR | default('/var/www/range42_backend_api') }}"
    API_PORT_RESOLVED: "{{ API_PORT | default(8000) }}"
    API_LISTEN_ADDRESS_RESOLVED: "{{ BACKEND_LISTEN_ADDRESS | default('127.0.0.1') }}"
    API_STATE_DIR_RESOLVED: "{{ API_STATE_DIR_HOST | default('/var/lib/range42/backend') }}"
    API_HOME_DIR_RESOLVED: "{{ API_HOME_DIR_HOST | default('/var/lib/range42/backend-home') }}"
    WORKSPACE_DIR_HOST_RESOLVED: "{{ WORKSPACE_DIR_HOST | default('/home/range42/range42.config') }}"
    WORKSPACE_DIR_NAME: "{{ lookup('env', 'RANGE42_ACTIVE_WORKSPACE') }}"
    CONTAINER_UID: "{{ API_CONTAINER_UID | default(1000) }}"
    CONTAINER_GID: "{{ API_CONTAINER_GID | default(1000) }}"
    DEPLOYER_UI_CORS_REGEX_RESOLVED: "{{ DEPLOYER_UI_CORS_REGEX | default('^https?://r42\\.admin-deployer-ui(:\\d+)?$') }}"
    compose_argv:
      - docker
      - compose
      - --project-directory
      - "{{ REMOTE_PROJECT_DIR_RESOLVED }}"
      - -f
      - "{{ REMOTE_PROJECT_DIR_RESOLVED }}/docker-compose.yml"
      - -f
      - "{{ REMOTE_PROJECT_DIR_RESOLVED }}/docker-compose.runtime.yml"
      - -f
      - "{{ REMOTE_PROJECT_DIR_RESOLVED }}/docker-compose.override.yml"
  tasks:
    - name: Require private credential and reviewed execution inputs
      ansible.builtin.assert:
        that:
          - API_SECRETS_DIR_HOST is defined
          - RUNTIME_DIR_HOST is defined
          - WORKSPACE_TEMPLATE_DIR_HOST is defined
          - WORKSPACE_DIR_NAME | length > 0
          - WORKSPACE_DIR_NAME is match('^[A-Za-z0-9][A-Za-z0-9_-]*$')
        fail_msg: Prepare API_SECRETS_DIR_HOST, RUNTIME_DIR_HOST and WORKSPACE_TEMPLATE_DIR_HOST, then select the native context.

    - name: Check installation path separation
      ansible.builtin.assert:
        that:
          - item is match('^/[^\n\r]+$')
          - item != '/'
          - not item.startswith(REMOTE_PROJECT_DIR_RESOLVED.rstrip('/') + '/')
          - item != REMOTE_PROJECT_DIR_RESOLVED
        fail_msg: State, credentials and runtime must use absolute paths outside the source/build directory.
      loop:
        - "{{ API_SECRETS_DIR_HOST }}"
        - "{{ RUNTIME_DIR_HOST }}"
        - "{{ WORKSPACE_TEMPLATE_DIR_HOST }}"
        - "{{ API_STATE_DIR_RESOLVED }}"
        - "{{ API_HOME_DIR_RESOLVED }}"
        - "{{ WORKSPACE_DIR_HOST_RESOLVED }}"

    - name: Check Docker availability before any installation changes
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: api_docker_binary

    - name: Find a running API for this existing Compose installation
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - -q
          - --filter
          - "label=com.docker.compose.project.working_dir={{ REMOTE_PROJECT_DIR_RESOLVED }}"
          - --filter
          - label=com.docker.compose.service=api
      register: api_running_container
      changed_when: false
      when: api_docker_binary.stat.exists

    - name: Require the existing API to be drained and stopped before installation
      ansible.builtin.assert:
        that:
          - api_running_container.stdout | default('') | trim == ''
        fail_msg: The API is running. Use its documented maintenance drain/stop procedure before rerunning this bundle; no running container was changed.

    - name: Inspect preprovisioned private directories
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ API_SECRETS_DIR_HOST }}"
        - "{{ API_HOME_DIR_RESOLVED }}"
        - "{{ WORKSPACE_DIR_HOST_RESOLVED }}"
        - "{{ WORKSPACE_TEMPLATE_DIR_HOST }}"
      register: api_private_directories

    - name: Require private directories readable by the container user
      ansible.builtin.assert:
        that:
          - item.stat.isdir | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.mode == '0700'
          - item.stat.uid | int == CONTAINER_UID | int
        fail_msg: Prepare real 0700 private directories owned by API_CONTAINER_UID before installation.
      loop: "{{ api_private_directories.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Inspect existing API secret files without reading their values
      ansible.builtin.stat:
        path: "{{ API_SECRETS_DIR_HOST }}/{{ item }}"
        follow: false
        get_checksum: false
      loop: [api-token, credential-key]
      register: api_secret_files

    - name: Require existing private API secrets without generating or rotating them
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.mode == '0600'
          - item.stat.uid | int == CONTAINER_UID | int
          - item.stat.size | int > 0
          - item.stat.size | int <= 4096
        fail_msg: Supply readable 0600 api-token and credential-key files owned by API_CONTAINER_UID. Existing credentials are never replaced.
      loop: "{{ api_secret_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check reviewed runtime and native context files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ RUNTIME_DIR_HOST }}/bundle-runtime.json"
        - "{{ RUNTIME_DIR_HOST }}/ansible.cfg"
        - "{{ RUNTIME_DIR_HOST }}/proxmox-ca.pem"
        - "{{ RUNTIME_DIR_HOST }}/range42/roles/deployer.bootstrap/files/range42-context.sh"
        - "{{ WORKSPACE_DIR_HOST_RESOLVED }}/{{ WORKSPACE_DIR_NAME }}/sourced_range42.sh"
        - "{{ WORKSPACE_DIR_HOST_RESOLVED }}/{{ WORKSPACE_DIR_NAME }}/inventory/inventory_default.yml"
        - "{{ WORKSPACE_DIR_HOST_RESOLVED }}/{{ WORKSPACE_DIR_NAME }}/secrets/default_vault.yml"
        - "{{ WORKSPACE_DIR_HOST_RESOLVED }}/{{ WORKSPACE_DIR_NAME }}/secrets/vault_pass.txt"
        - "{{ API_HOME_DIR_RESOLVED }}/.ssh/config"
        - "{{ API_HOME_DIR_RESOLVED }}/.zshrc"
      register: api_required_files

    - name: Require complete execution inputs
      ansible.builtin.assert:
        that:
          - item.stat.isreg | default(false)
        fail_msg: Prepare the complete runtime, private native context and dedicated container home before installation.
      loop: "{{ api_required_files.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: install deployer-api-backend - Docker Engine and Compose
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  roles:
    - software.install.warmup.basic_packages
  vars:
    INSTALL_PACKAGES_BASICS: "YES"
    INSTALL_PACKAGES_DOCKER: "YES"
    INSTALL_PACKAGES_DOCKER_COMPOSE: "YES"

- name: install deployer-api-backend - firewall
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  roles:
    - software.configure.firewalls
  vars:
    firewall_rules:
      - {ip: "all", port: 22, protocol: tcp}
      - {ip: "all", port: "{{ API_PORT | default(8000) }}", protocol: tcp}

- name: install deployer-api-backend - optional Tailscale
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"
  vars:
    tailscale_authkey: "{{ infrastructure_tailscale_authkey }}"
  tasks:
    - name: Install existing optional Tailscale configuration
      block:
        - include_role:
            name: software.install.tailscale
        - include_role:
            name: software.configure.tailscale_disable_nftables
      when: INSTALL_TAILSCALE | default('NO') | upper == 'YES'

- name: install deployer-api-backend - source and Compose configuration
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  vars: *api_install_vars
  tags: [api_packaging]
  tasks:
    - name: Install rsync
      ansible.builtin.apt:
        name: rsync
        state: present
        update_cache: false

    - name: Create persistent API state directory
      ansible.builtin.file:
        path: "{{ API_STATE_DIR_RESOLVED }}"
        state: directory
        owner: "{{ CONTAINER_UID }}"
        group: "{{ CONTAINER_GID }}"
        mode: '0700'

    - name: Create remote build directory
      ansible.builtin.file:
        path: "{{ REMOTE_PROJECT_DIR_RESOLVED }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Sync backend source through the existing native deployment path
      ansible.posix.synchronize:
        src: "{{ LOCAL_CODE_PATH_RESOLVED }}"
        dest: "{{ REMOTE_PROJECT_DIR_RESOLVED }}/"
        delete: true
        recursive: true
        rsync_opts:
          - --exclude=.git
          - --exclude=.venv
          - --exclude=collections
          - --exclude=__pycache__
          - --exclude=.pytest_cache
          - --exclude=.env
          - --exclude=.env.local
          - --exclude=.container-secrets
          - --exclude=docker-compose.override.yml

    - name: Capture controller-side source provenance
      ansible.builtin.shell:
        cmd: |
          cd {{ item.path | quote }} || exit 1
          printf '%s_ref=%s\n' {{ item.key | quote }} "$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)"
          printf '%s_sha=%s\n' {{ item.key | quote }} "$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          printf '%s_dirty=%s\n' {{ item.key | quote }} "$(git status --porcelain 2>/dev/null | wc -l)"
          printf '%s_upstream=%s\n' {{ item.key | quote }} "$(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}' 2>/dev/null || echo none)"
          printf '%s_unpushed=%s\n' {{ item.key | quote }} "$(git rev-list --count '@{upstream}..HEAD' 2>/dev/null || echo unknown)"
        executable: /bin/bash
      delegate_to: localhost
      become: false
      changed_when: false
      failed_when: false
      loop:
        - {key: backend_api, path: "{{ LOCAL_CODE_PATH_RESOLVED }}"}
        - {key: playbooks, path: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks"}
        - {key: core, path: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42"}
      loop_control:
        label: "{{ item.key }}"
      register: api_source_provenance

    - name: Record installed source and explicit state bindings
      ansible.builtin.copy:
        dest: "{{ API_STATE_DIR_RESOLVED }}/deployer_api_backend.version"
        content: |
          # Managed by range42 / bundles/admin/software.install.deployer_api_backend
          {% for line in api_source_provenance.results | map(attribute='stdout_lines') | flatten %}
          {{ line }}
          {% endfor %}
          backend_api_source_path={{ LOCAL_CODE_PATH_RESOLVED }}
          runtime_path={{ RUNTIME_DIR_HOST }}
          state_path={{ API_STATE_DIR_RESOLVED }}
          workspace_path={{ WORKSPACE_DIR_HOST_RESOLVED }}
        owner: "{{ CONTAINER_UID }}"
        group: "{{ CONTAINER_GID }}"
        mode: '0600'

    - name: Render .env for current application-owned Compose
      ansible.builtin.copy:
        dest: "{{ REMOTE_PROJECT_DIR_RESOLVED }}/.env"
        content: |
          # Managed by range42 / bundles/admin/software.install.deployer_api_backend
          RANGE42_CONTAINER_PORT={{ API_PORT_RESOLVED }}
          RANGE42_LISTEN_ADDRESS={{ API_LISTEN_ADDRESS_RESOLVED }}
          RANGE42_CONTAINER_UID={{ CONTAINER_UID }}
          RANGE42_CONTAINER_GID={{ CONTAINER_GID }}
          RANGE42_CONTAINER_IMAGE={{ API_CONTAINER_IMAGE | default('range42-backend-api:local') }}
          RANGE42_CONTAINER_SECRETS_DIR={{ API_SECRETS_DIR_HOST }}
          RANGE42_RUNTIME_DIR={{ RUNTIME_DIR_HOST }}
          RANGE42_WORKSPACE_TEMPLATE_DIR={{ WORKSPACE_TEMPLATE_DIR_HOST }}
          RANGE42_CORS_ORIGINS={{ BACKEND_CORS_ORIGINS | default('') }}
        owner: root
        group: root
        mode: '0600'

    - name: Render docker-compose.override.yml for persistent native context paths
      ansible.builtin.copy:
        dest: "{{ REMOTE_PROJECT_DIR_RESOLVED }}/docker-compose.override.yml"
        content: |
          # Managed by range42 / bundles/admin/software.install.deployer_api_backend
          services:
            api:
              volumes:
                - type: bind
                  source: {{ API_STATE_DIR_RESOLVED | to_json }}
                  target: /var/lib/range42
                  bind:
                    create_host_path: false
                - type: bind
                  source: {{ API_HOME_DIR_RESOLVED | to_json }}
                  target: /home/range42
                  bind:
                    create_host_path: false
                - type: bind
                  source: {{ WORKSPACE_DIR_HOST_RESOLVED | to_json }}
                  target: /home/range42/range42.config
                  bind:
                    create_host_path: false
              environment:
                HOME: /home/range42
                RANGE42_WORKSPACE_ROOT: /home/range42/range42.config
                RANGE42_DB_URL: sqlite+aiosqlite:////home/range42/range42.config/.range42.db
                RANGE42_CONTEXT_ROOT: /home/range42/range42.config
                RANGE42_CONTEXT_SCRIPT: /runtime/range42/roles/deployer.bootstrap/files/range42-context.sh
                RANGE42_GITDIR__ROOT_DIR: /runtime
                CORS_ORIGIN_REGEX: {{ DEPLOYER_UI_CORS_REGEX_RESOLVED | to_json }}
        owner: root
        group: root
        mode: '0600'

    - name: Build the packaged API image while its service is stopped
      ansible.builtin.command:
        argv: "{{ compose_argv + ['build', 'api'] }}"
      register: api_image_build
      changed_when: true

    - name: Verify runtime credentials native context and idle persistent state before startup
      ansible.builtin.command:
        argv: "{{ compose_argv + ['run', '--rm', '--no-deps', '--entrypoint', 'python', 'api', '-c', api_offline_check] }}"
      vars:
        api_offline_check: |
          import sqlite3
          from pathlib import Path
          from app.core.auth import configured_api_token
          from app.core.config import settings
          from app.core.credential_store import credential_cipher
          from app.core.bundle_runtime import runtime_snapshot
          from app.core.workspace import _template_files
          from app.core.native_contexts import _contexts
          from app.core.maintenance_guard import assert_idle
          from app.core.locks import ProvisioningLock
          configured_api_token(settings)
          credential_cipher(settings)
          runtime_snapshot()
          _template_files(Path('/run/range42-template'))
          contexts = _contexts()
          if not contexts or any(context.issues() for context in contexts):
              raise SystemExit('Native context is incomplete; prepare it through the existing workspace workflow')
          script = Path('/runtime/range42/roles/deployer.bootstrap/files/range42-context.sh').read_text()
          if 'RANGE42_CONTEXT_REPO_LINKS_MANAGED' not in script:
              raise SystemExit('Install the matching native-context compatibility revision')
          gate = Path(settings.maintenance_lock_file)
          if gate.exists() and (gate.is_symlink() or gate.stat().st_size):
              raise SystemExit('Existing maintenance intent requires explicit recovery')
          database = settings.workspace_root / '.range42.db'
          if database.exists():
              with ProvisioningLock(settings.workspace_root):
                  with sqlite3.connect(database) as connection:
                      connection.execute('BEGIN IMMEDIATE')
                      assert_idle(connection, settings.workspace_root)
          print('Runtime, credentials, native context and stopped state verified')
      changed_when: false
      no_log: true

    - name: Start the API with packaged startup migrations
      ansible.builtin.command:
        argv: "{{ compose_argv + ['up', '-d', '--no-build', 'api'] }}"
      register: api_compose_up
      changed_when: true

- name: install deployer-api-backend - health and Proxmox registration
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  vars: *api_install_vars
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"
  tags: [api_verify]
  tasks:
    - name: Wait for API liveness
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ API_PORT_RESOLVED }}/v1/health"
        status_code: 200
      register: api_liveness
      retries: 30
      delay: 2
      until: api_liveness.status == 200

    - name: Read the existing bearer token through protected input
      ansible.builtin.slurp:
        src: "{{ API_SECRETS_DIR_HOST }}/api-token"
      register: api_bearer_file
      no_log: true

    - name: Register Proxmox host with backend using its existing authenticated endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ API_PORT_RESOLVED }}/v1/proxmox/hosts"
        method: POST
        headers:
          Authorization: "Bearer {{ api_bearer_file.content | b64decode | trim }}"
        body_format: json
        body:
          name: "{{ lookup('env', 'RANGE42_INFRASTRUCTURE_CODENAME') }}"
          api_url: "https://{{ proxmox_api_host }}"
          node_name: "{{ proxmox_node }}"
          token_ref: "{{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        status_code: [200, 201]
      register: register_proxmox_result
      no_log: true

    - name: Verify authenticated readiness including the registered Proxmox target
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ API_PORT_RESOLVED }}/v1/health/ready"
        headers:
          Authorization: "Bearer {{ api_bearer_file.content | b64decode | trim }}"
        return_content: true
        status_code: 200
      register: api_readiness
      retries: 10
      delay: 2
      until: api_readiness.status == 200 and api_readiness.json.ready | default(false) | bool
      no_log: true

    - name: Confirm authenticated native API installation
      ansible.builtin.debug:
        msg: "API installed on port {{ API_PORT_RESOLVED }}; authenticated readiness and Proxmox registration passed."
