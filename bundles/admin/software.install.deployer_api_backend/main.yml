# ============================================================================
# bundles/admin/software.install.deployer_api_backend/main.yml
# ============================================================================
# Deploys range42-backend-api as a Docker container, following the canonical
# deploy method shipped by the repo (multi-stage Dockerfile Python 3.13 +
# FastAPI + uvicorn + embedded SQLite via SQLAlchemy async + Alembic + ansible
# runner). The UI talks to this backend via CORS (the deployer-ui bundle ships
# the UI with the Settings modal that lets the operator point at this backend).
#
# Plays (mirror the upstream README Quick Start - Option 1 Docker) :
#   1. Install Docker Engine + compose plugin on the backend host
#      (via software.install.warmup.basic_packages with INSTALL_PACKAGES_DOCKER
#      + INSTALL_PACKAGES_DOCKER_COMPOSE flags)
#   2. Configure firewall on the host : open API_PORT, keep 22
#   3. Conditional tailscale install : gated by the INSTALL_TAILSCALE feature
#      flag (default NO ; opt-in via TUI checkbox or `-e INSTALL_TAILSCALE=YES`,
#      aligned with manifest/feature_flags.yml). When YES, installs tailscale +
#      disables nftables on the backend VM so the container can reach Proxmox
#      via the tailnet. Runs BEFORE compose up so the container inherits the
#      correct /etc/resolv.conf at create time.
#   4. Provision workspace + playbooks + backend-api source on the host :
#      - Rsync the active range42-context workspace from controller
#        ($RANGE42_ACTIVE_CONFIG_DIR) to /home/range42/range42.config/<C>-<S>/
#      - Bridge SSH key naming (admin_keys symlink to backend_keys ;
#        alice/bob key files aliased to backend's expected
#        r42.deployer-key_<user> via relative symlinks)
#      - Rsync the range42-playbooks repo from controller to
#        /home/range42/range42-playbooks/ (bind-mounted RO into container ;
#        used by backend to launch ansible-runner against scenarios/_universal)
#      - Rsync the backend-api source (Docker build context only, BAKED into
#        the image at build time per upstream README, not bind-mounted)
#      - Render .env (PORT, UID/GID, CORS, RANGE42_WORKSPACE_ROOT,
#        API_BACKEND_WWWAPP_PLAYBOOKS_DIR, RANGE42_DB_URL,
#        WEB_CONCURRENCY=1 invariant)
#      - Render docker-compose.override.yml (bind-mount workspace + playbooks RO)
#      - `docker compose up -d --build`
#      - `alembic upgrade head` via `docker compose run --rm` with bind-mounts
#        of alembic.ini + alembic/ (the upstream Dockerfile does NOT COPY them
#        into the image, and the backend startup hook does NOT create_all the
#        schema, so this explicit step is required for the first deploy).
#   5. Wait for /docs/openapi.json to return 200 (container HEALTHCHECK uses
#      the same endpoint).
#   6. Post-deploy seed : register the Proxmox host with the backend via
#      POST /v1/proxmox/hosts (idempotent via 409 ; reads creds from
#      <workspace>/secrets/default_vault.yml). Required before any deploy
#      via the backend can succeed (the backend looks up target_host_id in
#      its proxmox_hosts table).
#
# REQUIRED vars (passed by the calling scenario via import_playbook `vars:`) :
#   - global_vm_ssh_name : inventory hostname for the backend VM
#                          (e.g. "r42.admin-deployer-api-backend")
#   - global_vm_ci_ip    : IP of the backend VM (informational ; not consumed)
#
# OPTIONAL vars (with defaults) :
#   - LOCAL_CODE_PATH               : controller path to range42-backend-api
#                                     (default = $RANGE42_GITDIR__ROOT_DIR/range42-backend-api/)
#   - REMOTE_PROJECT_DIR            : project root on the VM
#                                     (default /var/www/range42_backend_api)
#   - API_PORT                      : host port (default 8000)
#   - WORKSPACE_DIR_HOST            : host path for the persistent workspace
#                                     (default /home/range42/range42.config) -
#                                     also contains the operator's vault_pass.txt
#                                     per workspace (<C>-<S>/secrets/vault_pass.txt)
#   - PLAYBOOKS_DEST_DIR            : host path where range42-playbooks is rsynced
#                                     (default /home/range42/range42-playbooks ;
#                                     bind-mounted RO into the container,
#                                     read by ansible-runner via
#                                     API_BACKEND_WWWAPP_PLAYBOOKS_DIR)
#   - DEPLOYER_UI_CORS_REGEX        : CORS regex passed to the backend
#                                     (default matches http(s)://r42.admin-deployer-ui:<any>)
#
# REQUIRED env (sourced on controller via range42-context use <C> <S>) :
#   - RANGE42_ACTIVE_CONFIG_DIR     : active workspace dir on the controller
#                                     (e.g. ~/range42.config/<C>-<S>)
#   - RANGE42_INFRASTRUCTURE_CODENAME, RANGE42_INFRASTRUCTURE_LAB
#   - RANGE42_GITDIR__ROOT_DIR
#   - RANGE42_ACTIVE_WORKSPACE      : <C>-<S> workspace dir name
#
# Precondition : `range42-context use <C> <S>` MUST be active before running.
# It exports the env vars above AND sets ANSIBLE_CONFIG so the encrypted
# vault loaded by Play 5 decrypts automatically.
#
# Known gap : POST /v1/sources (Git PAT registration per Philippe's design
# note) is NOT seeded by this bundle. Operator must register sources
# manually post-deploy, OR add a `github_pat` vault key and extend Play 5.
#
# Backend connection (CORS path) :
#   The deployer-ui bundle adopts the CORS path - the UI calls this backend
#   directly via fetch, and the Origin header must match CORS_ORIGIN_REGEX.
#   The default regex matches the demo_lab UI hostname. Operators
#   running a different scenario must override DEPLOYER_UI_CORS_REGEX.
#
# Database :
#   SQLite + WAL via SQLAlchemy async + Alembic. NO separate database
#   container. Workspace dir is bind-mounted from host so the SQLite DB and
#   events.jsonl survive container restarts. Backend refuses non-local FS
#   (NFS / CIFS / FUSE) with HTTP 409 ; the bundle uses a host path that
#   is local FS by construction.
#
# Single-worker invariant :
#   WEB_CONCURRENCY=1 and UVICORN_WORKERS=1 are hard-set in .env because the
#   backend keeps SSE state in-process ; multi-worker would silently corrupt
#   that state. The backend logs `multi_worker_deploy_invariant_violated` if
#   someone overrides this.
#
# Example call-site :
#
# - import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/admin/software.install.deployer_api_backend/main.yml"
#   vars:
#     global_vm_ssh_name: "r42.admin-deployer-api-backend"
#     global_vm_ci_ip:    "192.168.142.102"
# ============================================================================

- name: install deployer-api-backend - Docker Engine + compose plugin
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  roles:
    - software.install.warmup.basic_packages
  vars:
    INSTALL_PACKAGES_BASICS: "YES"
    INSTALL_PACKAGES_DOCKER: "YES"
    INSTALL_PACKAGES_DOCKER_COMPOSE: "YES"

# ============================================================================

- name: install deployer-api-backend - firewall (open API_PORT, keep 22)
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  roles:
    - software.configure.firewalls
  vars:
    firewall_rules:
      - ip: "all"
        port: 22
        protocol: "tcp"
      - ip: "all"
        port: "{{ API_PORT | default('8000') }}"
        protocol: "tcp"

# ============================================================================

- name: install deployer-api-backend - conditional tailscale (gated on INSTALL_TAILSCALE feature flag)
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"
  vars:
    tailscale_authkey: "{{ infrastructure_tailscale_authkey }}"
  tasks:
    - name: Install + configure tailscale on the backend VM (opt-in via INSTALL_TAILSCALE=YES)
      block:
        - include_role:
            name: software.install.tailscale
        - include_role:
            name: software.configure.tailscale_disable_nftables
      when: INSTALL_TAILSCALE | default('NO') | upper == "YES"

# ============================================================================

- name: install deployer-api-backend - workspace + playbooks + source sync + .env + compose up
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  vars:
    LOCAL_CODE_PATH_RESOLVED: "{{ LOCAL_CODE_PATH | default(lookup('env', 'RANGE42_GITDIR__ROOT_DIR') + '/range42-backend-api/', true) }}"
    REMOTE_PROJECT_DIR_RESOLVED: "{{ REMOTE_PROJECT_DIR | default('/var/www/range42_backend_api') }}"
    API_PORT_RESOLVED: "{{ API_PORT | default('8000') }}"
    WORKSPACE_DIR_HOST_RESOLVED: "{{ WORKSPACE_DIR_HOST | default('/home/range42/range42.config') }}"
    PLAYBOOKS_DEST_RESOLVED: "{{ PLAYBOOKS_DEST_DIR | default('/home/range42/range42-playbooks') }}"
    PLAYBOOKS_SRC_RESOLVED: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/"
    WORKSPACE_SRC_RESOLVED: "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}"
    WORKSPACE_DIR_NAME: "{{ lookup('env', 'RANGE42_ACTIVE_WORKSPACE') }}"
    DEPLOYER_UI_CORS_REGEX_RESOLVED: "{{ DEPLOYER_UI_CORS_REGEX | default('^https?://r42\\.admin-deployer-ui(:\\d+)?$') }}"
    CONTAINER_UID: 1000
    CONTAINER_GID: 1000
  tasks:
    - name: Install rsync on remote (required for synchronize)
      ansible.builtin.apt:
        name: rsync
        state: present
        update_cache: false

    - name: Create workspace dir on host (SQLite + events.jsonl persistence)
      ansible.builtin.file:
        path: "{{ WORKSPACE_DIR_HOST_RESOLVED }}"
        state: directory
        owner: "{{ CONTAINER_UID }}"
        group: "{{ CONTAINER_GID }}"
        mode: "0700"

    - name: Create remote project dir
      ansible.builtin.file:
        path: "{{ REMOTE_PROJECT_DIR_RESOLVED }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Sync active range42-context workspace from controller to backend host
      ansible.posix.synchronize:
        src: "{{ WORKSPACE_SRC_RESOLVED }}"
        dest: "{{ WORKSPACE_DIR_HOST_RESOLVED }}/"
        delete: false
        recursive: true
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=__pycache__"

    - name: Bridge SSH key naming - admin_keys symlink to backend_keys
      ansible.builtin.file:
        src: backend_keys
        dest: "{{ WORKSPACE_DIR_HOST_RESOLVED }}/{{ WORKSPACE_DIR_NAME }}/ssh_keys/admin_keys"
        state: link
        force: true

    - name: Bridge SSH key naming - alice key alias for backend lookup
      ansible.builtin.file:
        src: "r42.{{ WORKSPACE_DIR_NAME }}-deployer-key_alice"
        dest: "{{ WORKSPACE_DIR_HOST_RESOLVED }}/{{ WORKSPACE_DIR_NAME }}/ssh_keys/backend_keys/r42.deployer-key_alice"
        state: link
        force: true

    - name: Bridge SSH key naming - bob key alias for backend lookup
      ansible.builtin.file:
        src: "r42.{{ WORKSPACE_DIR_NAME }}-student-key_bob"
        dest: "{{ WORKSPACE_DIR_HOST_RESOLVED }}/{{ WORKSPACE_DIR_NAME }}/ssh_keys/student_keys/r42.deployer-key_bob"
        state: link
        force: true

    - name: Create playbooks dest dir on backend host
      ansible.builtin.file:
        path: "{{ PLAYBOOKS_DEST_RESOLVED }}"
        state: directory
        owner: "{{ CONTAINER_UID }}"
        group: "{{ CONTAINER_GID }}"
        mode: "0755"

    - name: Sync range42-playbooks repo from controller to backend host
      ansible.posix.synchronize:
        src: "{{ PLAYBOOKS_SRC_RESOLVED }}"
        dest: "{{ PLAYBOOKS_DEST_RESOLVED }}/"
        delete: true
        recursive: true
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=__pycache__"
          - "--exclude=.pytest_cache"

    - name: Sync backend-api source from controller to remote project dir
      ansible.posix.synchronize:
        src: "{{ LOCAL_CODE_PATH_RESOLVED }}"
        dest: "{{ REMOTE_PROJECT_DIR_RESOLVED }}/"
        delete: true
        recursive: true
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=.venv"
          - "--exclude=collections"
          - "--exclude=__pycache__"
          - "--exclude=.pytest_cache"
          - "--exclude=.env"
          - "--exclude=.env.local"

    - name: Render .env (PORT, UID/GID, CORS, workspace path, WEB_CONCURRENCY=1 invariant)
      ansible.builtin.copy:
        dest: "{{ REMOTE_PROJECT_DIR_RESOLVED }}/.env"
        content: |
          # Managed by range42 / bundles/admin/software.install.deployer_api_backend

          # Host port for the FastAPI service
          PORT={{ API_PORT_RESOLVED }}

          # Container runtime user UID/GID (matches the workspace dir + ssh dir owner)
          UID={{ CONTAINER_UID }}
          GID={{ CONTAINER_GID }}

          # Image name used to tag the locally-built image (rsync + build path)
          IMAGE_NAME=range42-backend-api:local

          # Host paths bind-mounted into the container
          SSH_KEY_PATH=~/.ssh

          # Vault password file - empty by default (matches upstream .env.example).
          # The workspace bind-mount makes each deployment's vault_pass.txt available
          # inside the container at /home/range42/range42.config/<C>-<S>/secrets/vault_pass.txt.
          # Backend resolves the per-deployment path at runtime and passes it to
          # ansible-runner as ANSIBLE_VAULT_PASSWORD_FILE ; no global default here.
          VAULT_PASSWORD_FILE=

          # CORS - allow the deployer-ui origin (browser sends Origin header)
          CORS_ORIGIN_REGEX={{ DEPLOYER_UI_CORS_REGEX_RESOLVED }}

          # Workspace dir INSIDE the container (bind-mounted via override compose)
          RANGE42_WORKSPACE_ROOT=/home/range42/range42.config

          # Playbooks repo INSIDE the container (bind-mounted RO via override compose).
          # Must contain scenarios/_universal/main.yml (per Philippe's design ; the
          # backend launches ansible-runner against this path).
          API_BACKEND_WWWAPP_PLAYBOOKS_DIR=/home/range42/range42-playbooks

          # SQLite DB - file lives in the workspace bind-mount, so it survives
          # container restarts and is browsable from the host. Async stack
          # (aiosqlite) - prefix required by backend's create_async_engine.
          RANGE42_DB_URL=sqlite+aiosqlite:////home/range42/range42.config/.range42.db

          # Single-worker invariant per backend requirement
          # (SSE state lives in-process ; multi-worker corrupts it silently)
          WEB_CONCURRENCY=1
          UVICORN_WORKERS=1

          # Logging
          DEBUG=false
        owner: root
        group: root
        mode: "0644"

    - name: Render docker-compose.override.yml (bind-mount workspace + playbooks RO)
      ansible.builtin.copy:
        dest: "{{ REMOTE_PROJECT_DIR_RESOLVED }}/docker-compose.override.yml"
        content: |
          # Managed by range42 - additional bind-mounts on top of the upstream compose.
          # 1. Workspace dir (RW) : SQLite + events.jsonl + per-deployment secrets/
          #    (vault_pass.txt + default_vault.yml) + ssh_keys/ + inventory/.
          # 2. Playbooks repo (RO) : ansible-runner reads from here to launch
          #    scenarios/_universal and its bundles. Read-only by design ; updates
          #    require a fresh bundle run (which re-rsyncs from controller).
          services:
            api:
              volumes:
                - "{{ WORKSPACE_DIR_HOST_RESOLVED }}:/home/range42/range42.config"
                - "{{ PLAYBOOKS_DEST_RESOLVED }}:/home/range42/range42-playbooks:ro"
        owner: root
        group: root
        mode: "0644"

    - name: Chown workspace + playbooks trees to container UID/GID (post-rsync)
      ansible.builtin.file:
        path: "{{ item }}"
        owner: "{{ CONTAINER_UID }}"
        group: "{{ CONTAINER_GID }}"
        recurse: true
      loop:
        - "{{ WORKSPACE_DIR_HOST_RESOLVED }}/{{ WORKSPACE_DIR_NAME }}"
        - "{{ PLAYBOOKS_DEST_RESOLVED }}"

    - name: Run docker compose up -d --build
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ REMOTE_PROJECT_DIR_RESOLVED }}"
      register: compose_up_result
      changed_when: >-
        ('Started' in compose_up_result.stdout)
        or ('Started' in compose_up_result.stderr)
        or ('Recreated' in compose_up_result.stdout)
        or ('Recreated' in compose_up_result.stderr)
        or ('Built' in compose_up_result.stdout)
        or ('Built' in compose_up_result.stderr)

    - name: Show docker compose up output (last lines)
      ansible.builtin.debug:
        var: compose_up_result.stderr_lines
      when: compose_up_result.stderr_lines | length > 0

    - name: Run alembic upgrade head (schema bootstrap, bind-mount alembic.ini + alembic/)
      ansible.builtin.command:
        cmd: >-
          docker compose run --rm
          -v {{ REMOTE_PROJECT_DIR_RESOLVED }}/alembic.ini:/app/alembic.ini:ro
          -v {{ REMOTE_PROJECT_DIR_RESOLVED }}/alembic:/app/alembic:ro
          api alembic upgrade head
        chdir: "{{ REMOTE_PROJECT_DIR_RESOLVED }}"
      register: alembic_result
      changed_when: >-
        ('Running upgrade' in alembic_result.stdout)
        or ('Running upgrade' in alembic_result.stderr)

    - name: Show alembic upgrade output (last lines)
      ansible.builtin.debug:
        var: alembic_result.stdout_lines
      when: alembic_result.stdout_lines | length > 0

# ============================================================================

- name: install deployer-api-backend - /docs/openapi.json probe
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  vars:
    API_PORT_RESOLVED: "{{ API_PORT | default('8000') }}"
  tasks:
    - name: Wait for API port to accept connections
      ansible.builtin.wait_for:
        port: "{{ API_PORT_RESOLVED }}"
        host: 127.0.0.1
        delay: 5
        timeout: 180

    - name: Probe /docs/openapi.json (same endpoint as container HEALTHCHECK)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ API_PORT_RESOLVED }}/docs/openapi.json"
        return_content: false
        status_code: 200
      register: api_status
      retries: 10
      delay: 5
      until: api_status.status == 200

    - name: Confirm backend is ready
      ansible.builtin.debug:
        msg: "deployer-api-backend ready on port {{ API_PORT_RESOLVED }}"

# ============================================================================

- name: install deployer-api-backend - post-deploy seed (register Proxmox host)
  hosts: "{{ global_vm_ssh_name }}"
  become: false
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"
  vars:
    API_PORT_RESOLVED: "{{ API_PORT | default('8000') }}"
  tasks:
    - name: Register Proxmox host with backend (idempotent via 409)
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ API_PORT_RESOLVED }}/v1/proxmox/hosts"
        method: POST
        body_format: json
        body:
          name: "{{ lookup('env', 'RANGE42_INFRASTRUCTURE_CODENAME') }}"
          api_url: "https://{{ proxmox_api_host }}"
          node_name: "{{ proxmox_node }}"
          token_ref: "{{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        status_code: [200, 201, 409]
      register: register_proxmox_result

    - name: Show Proxmox host registration result
      ansible.builtin.debug:
        msg: "Proxmox host registration on backend : HTTP {{ register_proxmox_result.status }} (200/201 = created, 409 = already registered)"
