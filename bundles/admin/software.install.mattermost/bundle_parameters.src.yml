---
bundle: admin/software.install.mattermost

description: Mattermost docker-compose stack (postgres + mattermost + provisioner) installed on a dedicated VM via the catalog element

optional: true

install_flag: INSTALL_MATTERMOST

params:
  - name: global_vm_ssh_name
    target: true
    type: string
    required: true
    default_where: none
    description: Inventory hostname of the Mattermost VM, used as the play hosts target for the install, firewall and deploy plays

  - name: global_vm_ci_ip
    type: string
    required: true
    default_where: none
    description: IP of the Mattermost server, informational only (documented at the call-site, not consumed by any executable task in this bundle)

  - name: BUNDLE_CATALOG_SOURCE_DIR
    type: string
    required: false
    default_where: bundle-inline
    description: Optional controller delivery directory; uses its existing private .env instead of seeding
      demo defaults.
    default: ''
  - name: BUNDLE_CATALOG_REMOTE_DIR
    type: string
    required: false
    default_where: bundle-inline
    description: Catalog remote dir
    default: /home/alice/mattermost
  - name: BUNDLE_CATALOG_OPERATOR
    type: string
    required: false
    default_where: bundle-inline
    description: Catalog operator
    default: alice
  - name: BUNDLE_CATALOG_PRIVATE
    type: bool
    required: false
    default_where: bundle-inline
    description: Catalog private
    default: false
