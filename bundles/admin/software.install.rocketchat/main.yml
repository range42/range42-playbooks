---
# ============================================================================
# bundles/admin/software.install.rocketchat/main.yml
# ============================================================================
# Rocket.Chat docker-compose stack install playbook. Deploys the rocketchat
# catalog element (mongodb + mongo-init-replica + rocketchat + provisioner
# build:) on a dedicated VM via Docker compose. The catalog element source is
# range42-catalog/03_container_layer/docker/admin/rocketchat/ and is rsynced to
# the VM at /home/alice/rocketchat/.
#
# REQUIRED vars (passed by the calling scenario via import_playbook `vars:`) :
#   - global_vm_ssh_name   : inventory hostname for the Rocket.Chat VM
#                            (e.g. "r42.admin-rocketchat-standalone")
#   - global_vm_ci_ip      : IP of the Rocket.Chat server (e.g. "192.168.142.185")
#
# Catalog .env handling :
#   Play 1 (on the proxmox/local host) cp .env.example -> .env on the catalog
#   if .env is absent (force=false respects an existing customized .env). The
#   compose file uses ${VAR:-default} fallbacks for every variable, so the
#   stack boots with or without .env ; the seed is hygiene + lets the operator
#   customize creds. Populate the catalog .env BEFORE running for stronger creds.
#
# Service port :
#   This bundle opens 3000 (Rocket.Chat HTTP) on the VM itself (Play 3). The
#   scenario baseline only opens 22 ; a reusable software bundle owns its own
#   service port so INSTALL_ROCKETCHAT works in any scenario without the
#   scenario needing to know the port.
#
# First-boot timing :
#   The stack uses a MongoDB replica-set ; cold-start convergence takes
#   ~90-180s on first deploy (mongo-init-replica + provisioner are one-shot
#   restart:no). Re-runs are idempotent.
#
# Example call-site (in scenarios/<scenario>/.../admin-rocketchat.yml) :
#
#   - import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/admin/software.install.rocketchat/main.yml"
#     when: INSTALL_ROCKETCHAT | default("NO") | upper == "YES"
#     vars:
#       global_vm_ssh_name: "r42.admin-rocketchat-standalone"
#       global_vm_ci_ip:    "192.168.142.185"
#
# ============================================================================
- name: rocketchat - ensure catalog .env exists (cp .env.example -> .env if missing)
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: cp .env.example -> .env if .env absent (force=false respects an existing customized .env)
      ansible.builtin.copy:
        src: "{{ lookup('env', 'RANGE42_INVENTORY') }}/03_container_layer/docker/admin/rocketchat/.env.example"
        dest: "{{ lookup('env', 'RANGE42_INVENTORY') }}/03_container_layer/docker/admin/rocketchat/.env"
        force: false
        remote_src: true

# #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: rocketchat - install Docker + docker-compose on the Rocket.Chat VM
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  gather_facts: true
  roles:
    - software.install.warmup.basic_packages
  vars:
    INSTALL_PACKAGES_BASICS: "YES"
    INSTALL_PACKAGES_DOCKER: "YES"
    INSTALL_PACKAGES_DOCKER_COMPOSE: "YES"
    INSTALL_PACKAGES_NTP_AND_UPDATE_TIME: "YES"

# #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: rocketchat - open firewall ports (22 SSH + 3000 HTTP)
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  gather_facts: false
  roles:
    - software.configure.firewalls
  vars:
    firewall_rules:
      - { ip: "all", port: 22, protocol: "tcp" }
      - { ip: "all", port: 3000, protocol: "tcp" }

# #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: rocketchat - deploy rocketchat docker-compose stack from catalog
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  gather_facts: false
  pre_tasks:
    ##
    ## Seed .env on the VM (cp .env.example -> .env, force=false). The compose
    ## file has ${VAR:-default} fallbacks everywhere so this is hygiene, not a
    ## boot requirement ; it lets the operator customize creds on the VM and
    ## have subsequent re-deploys respect them. The rsync that follows transfers
    ## .env.example as a sibling, never touches .env.
    ##
    - name: ensure REMOTE_PROJECT_DIR exists on the VM (idempotent ; the role's CREATE TMP DIR runs the same op)
      ansible.builtin.file:
        path: "/home/alice/rocketchat"
        state: directory
        owner: "alice"
        group: "alice"
        mode: "0700"

    - name: push .env on the VM (cp .env.example -> .env if .env absent on the VM)
      ansible.builtin.copy:
        src: "{{ lookup('env', 'RANGE42_INVENTORY') }}/03_container_layer/docker/admin/rocketchat/.env.example"
        dest: "/home/alice/rocketchat/.env"
        owner: "alice"
        group: "alice"
        mode: "0600"
        force: false
  roles:
    - software.configure.docker-compose
  vars:
    LABEL_PROJECT_TYPE: "admin"
    LABEL_PROJET_NAME: "rocketchat"
    LOCAL__PROJECT_DIR: "{{ lookup('env', 'RANGE42_INVENTORY') }}/03_container_layer/docker/admin/rocketchat"
    REMOTE_PROJECT_DIR: "/home/alice/rocketchat"
    OPERATOR_USER: "alice"
    CLEAN_UP_DEPLOY_DIR: "NO"
    SEND_POC_DIR: "NO"
