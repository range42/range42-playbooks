---
bundle: admin/software.install.rocketchat

description: Rocket.Chat docker-compose stack (mongodb + rocketchat + provisioner) installed on a dedicated VM

optional: true

install_flag: INSTALL_ROCKETCHAT

params:
  - name: global_vm_ssh_name
    target: true
    type: string
    required: true
    default_where: call-site
    description: Inventory hostname of the Rocket.Chat VM (used as hosts for the install, firewall and deploy plays)

  - name: global_vm_ci_ip
    type: string
    required: true
    default_where: call-site
    description: IP of the Rocket.Chat server; informational only (web UI at port 3500), not consumed by any task

  - name: BUNDLE_CATALOG_SOURCE_DIR
    type: string
    required: false
    default_where: bundle-inline
    description: Optional controller delivery directory; uses its existing private .env instead of seeding
      demo defaults.
    default: ''
  - name: BUNDLE_CATALOG_REMOTE_DIR
    type: string
    required: false
    default_where: bundle-inline
    description: Catalog remote dir
    default: /home/alice/rocketchat
  - name: BUNDLE_CATALOG_OPERATOR
    type: string
    required: false
    default_where: bundle-inline
    description: Catalog operator
    default: alice
  - name: BUNDLE_CATALOG_PRIVATE
    type: bool
    required: false
    default_where: bundle-inline
    description: Catalog private
    default: false
