# ============================================================================
# bundles/core/system-baseline-default/main.yml
# ============================================================================
# Group-level system baseline VM setup : basic packages + dotfiles.
# Firewall is handled by a separate `network-baseline-*` policy bundle
# (see bundles/core/network-baseline-ssh/ and siblings).
# Tailscale is handled by another separate bundle (bundles/core/tailscale-on-group/).
#
# REQUIRED vars (passed at call-site via import_playbook vars:) :
#   target_group : ansible group name (e.g. r42_admin, r42_student_box_group,
#                  r42_vuln_box_group)
#
# OPTIONAL vars (defaults applied via set_fact pre_tasks ; pass at call-site
# to override per scenario group) :
#   INSTALL_PACKAGES_BASICS               (default YES)
#   INSTALL_PACKAGES_FIREWALLS            (default YES)
#   INSTALL_PACKAGES_DOCKER               (default NO)
#   INSTALL_PACKAGES_DOCKER_COMPOSE       (default NO)
#   INSTALL_PACKAGES_UTILS_JSON           (default NO)
#   INSTALL_PACKAGES_UTILS_NETWORK        (default YES)
#   INSTALL_PACKAGES_NTP_AND_UPDATE_TIME  (default YES)
#   SPECIFIC_PACKAGES_CLEANING            (default NO)
#   OPERATOR_USER                         (default alice)
#   INSTALL_VIM_DOTFILES                  (default YES)
#   INSTALL_ZSH_DOTFILES                  (default YES)
#
# Variable names are preserved verbatim from the previous monolithic
# `baseline` bundle - same contract, just packages + dotfiles now.
#
# Example call-site :
#
# - import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/system-baseline-default/main.yml"
#   vars:
#     target_group: "r42_admin"
#     INSTALL_PACKAGES_UTILS_NETWORK: "NO"   # override only when needed
# ============================================================================

- name: system-baseline-default - install basics packages
  hosts: "{{ target_group }}"
  become: true
  pre_tasks:
    - name: Apply system-baseline defaults (packages play)
      ansible.builtin.set_fact:
        INSTALL_PACKAGES_BASICS: "{{ INSTALL_PACKAGES_BASICS | default('YES') }}"
        INSTALL_PACKAGES_FIREWALLS: "{{ INSTALL_PACKAGES_FIREWALLS | default('YES') }}"
        INSTALL_PACKAGES_DOCKER: "{{ INSTALL_PACKAGES_DOCKER | default('NO') }}"
        INSTALL_PACKAGES_DOCKER_COMPOSE: "{{ INSTALL_PACKAGES_DOCKER_COMPOSE | default('NO') }}"
        INSTALL_PACKAGES_UTILS_JSON: "{{ INSTALL_PACKAGES_UTILS_JSON | default('NO') }}"
        INSTALL_PACKAGES_UTILS_NETWORK: "{{ INSTALL_PACKAGES_UTILS_NETWORK | default('YES') }}"
        INSTALL_PACKAGES_NTP_AND_UPDATE_TIME: "{{ INSTALL_PACKAGES_NTP_AND_UPDATE_TIME | default('YES') }}"
        SPECIFIC_PACKAGES_CLEANING: "{{ SPECIFIC_PACKAGES_CLEANING | default('NO') }}"
  roles:
    - software.install.warmup.basic_packages

- name: system-baseline-default - install dot files
  hosts: "{{ target_group }}"
  become: true
  pre_tasks:
    - name: Apply system-baseline defaults (dotfiles play)
      ansible.builtin.set_fact:
        OPERATOR_USER: "{{ OPERATOR_USER | default('alice') }}"
        INSTALL_VIM_DOTFILES: "{{ INSTALL_VIM_DOTFILES | default('YES') }}"
        INSTALL_ZSH_DOTFILES: "{{ INSTALL_ZSH_DOTFILES | default('YES') }}"
  roles:
    - software.install.warmup.dot_files
