# ============================================================================
# bundles/core/system-baseline-default/main.yml
# ============================================================================
# Group-level baseline : basic packages + dotfiles.
# Firewall  = bundles/core/network-baseline-*  Tailscale = bundles/core/tailscale-on-group/
#
# REQUIRED : target_group
#
# OPTIONAL caller overrides (BASELINE_* prefix is intentional, see below) :
#   BASELINE_INSTALL_BASICS           (default YES)
#   BASELINE_INSTALL_FIREWALLS        (default YES)
#   BASELINE_INSTALL_DOCKER           (default NO)
#   BASELINE_INSTALL_DOCKER_COMPOSE   (default NO)
#   BASELINE_INSTALL_UTILS_JSON       (default NO)
#   BASELINE_INSTALL_UTILS_NETWORK    (default YES)
#   BASELINE_INSTALL_NTP              (default YES)
#   BASELINE_CLEANING                 (default NO)
#   BASELINE_OPERATOR_USER            (default alice)
#   BASELINE_INSTALL_VIM_DOTFILES     (default YES)
#   BASELINE_INSTALL_ZSH_DOTFILES     (default YES)
#
# Example :
#   - import_playbook: ".../system-baseline-default/main.yml"
#     vars:
#       target_group: "r42_admin"
#       BASELINE_INSTALL_DOCKER: "YES"   # opt-in override, takes effect
#
# ----------------------------------------------------------------------------
# Two-stage var indirection : INTENTIONAL (not a bad practice)
# ----------------------------------------------------------------------------
# Caller passes BASELINE_*. Bundle resolves into private `_baseline_*` (p12),
# then role-level (p20) maps those into the role's expected INSTALL_PACKAGES_*
# names. The BASELINE_* prefix is mandatory : if we reused INSTALL_PACKAGES_*
# on the caller side, the reference graph would form a 2-cycle (role-level
# p20 wins over play-vars p12 in every lookup) and Ansible loops forever.
#
# This indirection is what gives the scenario the ability to override defaults
# per group via `import_playbook vars:`. Hardcoding the role-level vars would
# also break the cycle but would lose caller override (only `-e` would work).
#
# DO NOT "simplify" by renaming BASELINE_* back to INSTALL_PACKAGES_* on the
# caller side - that re-introduces the cycle and the deploy fails on the
# first templated `when:` (typically NTP).
# ============================================================================

- name: system-baseline-default - install basics packages
  hosts: "{{ target_group }}"
  become: true
  vars:
    _baseline_basics: "{{ BASELINE_INSTALL_BASICS | default('YES') }}"
    _baseline_firewalls: "{{ BASELINE_INSTALL_FIREWALLS | default('YES') }}"
    _baseline_docker: "{{ BASELINE_INSTALL_DOCKER | default('NO') }}"
    _baseline_docker_compose: "{{ BASELINE_INSTALL_DOCKER_COMPOSE | default('NO') }}"
    _baseline_utils_json: "{{ BASELINE_INSTALL_UTILS_JSON | default('NO') }}"
    _baseline_utils_network: "{{ BASELINE_INSTALL_UTILS_NETWORK | default('YES') }}"
    _baseline_ntp: "{{ BASELINE_INSTALL_NTP | default('YES') }}"
    _baseline_cleaning: "{{ BASELINE_CLEANING | default('NO') }}"
  roles:
    - role: software.install.warmup.basic_packages
      vars:
        INSTALL_PACKAGES_BASICS: "{{ _baseline_basics }}"
        INSTALL_PACKAGES_FIREWALLS: "{{ _baseline_firewalls }}"
        INSTALL_PACKAGES_DOCKER: "{{ _baseline_docker }}"
        INSTALL_PACKAGES_DOCKER_COMPOSE: "{{ _baseline_docker_compose }}"
        INSTALL_PACKAGES_UTILS_JSON: "{{ _baseline_utils_json }}"
        INSTALL_PACKAGES_UTILS_NETWORK: "{{ _baseline_utils_network }}"
        INSTALL_PACKAGES_NTP_AND_UPDATE_TIME: "{{ _baseline_ntp }}"
        SPECIFIC_PACKAGES_CLEANING: "{{ _baseline_cleaning }}"

- name: system-baseline-default - install dot files
  hosts: "{{ target_group }}"
  become: true
  vars:
    _baseline_operator_user: "{{ BASELINE_OPERATOR_USER | default('alice') }}"
    _baseline_vim_dotfiles: "{{ BASELINE_INSTALL_VIM_DOTFILES | default('YES') }}"
    _baseline_zsh_dotfiles: "{{ BASELINE_INSTALL_ZSH_DOTFILES | default('YES') }}"
  roles:
    - role: software.install.warmup.dot_files
      vars:
        OPERATOR_USER: "{{ _baseline_operator_user }}"
        INSTALL_VIM_DOTFILES: "{{ _baseline_vim_dotfiles }}"
        INSTALL_ZSH_DOTFILES: "{{ _baseline_zsh_dotfiles }}"
