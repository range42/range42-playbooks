# ============================================================================
# bundles/core/gitclone/main.yml
# ============================================================================
# Generic gitclone bundle : clones a caller-provided list of repositories on
# a target group of VMs.
#
# REQUIRED caller vars (passed via import_playbook vars:) :
#   target_group        : ansible group name (e.g. r42_kunai_lab_students_group)
#   GITCLONE_REPOS      : list of {name: <str>, url: <str>} dicts
#
# OPTIONAL caller vars (with defaults) :
#   GITCLONE_OPERATOR_USER : (default 'alice') - become_user that owns the cloned repos
#   GITCLONE_REPOS_DIR     : (default '/home/<operator>/repos') - parent dir for the clones
#   GITCLONE_DEPTH         : (default 1) - shallow clone depth
#
# Example call-site :
#
#   - import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/gitclone/main.yml"
#     vars:
#       target_group: "r42_kunai_lab_students_group"
#       GITCLONE_OPERATOR_USER: "alice"
#       GITCLONE_REPOS_DIR: "/home/alice/kunai-project"
#       GITCLONE_REPOS:
#         - { name: "workshops",  url: "https://github.com/kunai-project/workshops.git" }
#         - { name: "kunai-doc",  url: "https://github.com/kunai-project/kunai-doc.git" }
#
# ----------------------------------------------------------------------------

- name: gitclone - clone repos on {{ target_group }}
  hosts: "{{ target_group }}"
  become: true
  gather_facts: false

# ============================================================================
# Variable propagation : caller passes GITCLONE_* (uppercase prefix), bundle
# resolves into private _gitclone_* play-vars (lowercase) with default()
# fallbacks. The prefix split is intentional (consistent with the project's
# BASELINE_*-style bundles + future-proof against role-level mappings if the
# bundle ever wraps a role with the same expected var names).
# ============================================================================
  vars:
    _gitclone_operator_user: "{{ GITCLONE_OPERATOR_USER | default('alice') }}"
    _gitclone_repos_dir:     "{{ GITCLONE_REPOS_DIR | default('/home/' + _gitclone_operator_user + '/repos') }}"
    _gitclone_repos:         "{{ GITCLONE_REPOS | default([]) }}"
    _gitclone_depth:         "{{ GITCLONE_DEPTH | default(1) }}"

  tasks:
    - name: gitclone - ensure parent directory exists ({{ _gitclone_repos_dir }})
      ansible.builtin.file:
        path: "{{ _gitclone_repos_dir }}"
        state: directory
        owner: "{{ _gitclone_operator_user }}"
        group: "{{ _gitclone_operator_user }}"
        mode: "0755"

    - name: gitclone - clone repositories ({{ _gitclone_operator_user }})
      ansible.builtin.git:
        repo: "{{ item.url }}"
        dest: "{{ _gitclone_repos_dir }}/{{ item.name }}"
        depth: "{{ _gitclone_depth }}"
        update: true
        accept_hostkey: true
      become_user: "{{ _gitclone_operator_user }}"
      loop: "{{ _gitclone_repos }}"
      loop_control:
        label: "{{ item.name }}"
