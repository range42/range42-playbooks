# ============================================================================
# bundles/core/network-baseline-deployer-backend-api/main.yml
# ============================================================================
# Network policy : SSH + deployer-backend-api (FastAPI).
# Opens 22/tcp + 8000/tcp on the target group. Designed for VMs hosting
# the range42-backend-api service (default API port = 8000).
#
# REQUIRED vars : target_group
#
# Example call-site :
#
# - import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/network-baseline-deployer-backend-api/main.yml"
#   vars:
#     target_group: "r42_admin"
# ============================================================================

- name: network-baseline-deployer-backend-api - configure firewall (ports 22, 8000)
  hosts: "{{ target_group }}"
  become: true
  roles:
    - software.configure.firewalls
  vars:
    firewall_rules:
      - { ip: "all", port: 22,   protocol: "tcp" }
      - { ip: "all", port: 8000, protocol: "tcp" }
