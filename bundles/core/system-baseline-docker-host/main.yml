# ============================================================================
# bundles/core/system-baseline-docker-host/main.yml
# ============================================================================
# System baseline profile : adds Docker + docker-compose to the base. For VMs
# that host docker-compose stacks (CTF vuln-boxes, future docker-driven admin
# VMs).
#
# Identical structure to `system-baseline-default`, only the defaults differ :
#   INSTALL_PACKAGES_DOCKER          defaults to YES (vs NO in default)
#   INSTALL_PACKAGES_DOCKER_COMPOSE  defaults to YES (vs NO in default)
#   INSTALL_PACKAGES_UTILS_NETWORK   defaults to NO  (vs YES in default ; docker hosts typically don't need net debug)
#
# Dotfiles (vim + zsh) installed by default in every system-baseline-* profile
# per project convention.
#
# REQUIRED vars : target_group
#
# Example call-site :
#
# - import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/system-baseline-docker-host/main.yml"
#   vars:
#     target_group: "r42_vuln_box_group"
# ============================================================================

- name: system-baseline-docker-host - install basics packages
  hosts: "{{ target_group }}"
  become: true
  pre_tasks:
    - name: Apply system-baseline-docker-host defaults (packages play)
      ansible.builtin.set_fact:
        INSTALL_PACKAGES_BASICS: "{{ INSTALL_PACKAGES_BASICS | default('YES') }}"
        INSTALL_PACKAGES_FIREWALLS: "{{ INSTALL_PACKAGES_FIREWALLS | default('YES') }}"
        INSTALL_PACKAGES_DOCKER: "{{ INSTALL_PACKAGES_DOCKER | default('YES') }}"
        INSTALL_PACKAGES_DOCKER_COMPOSE: "{{ INSTALL_PACKAGES_DOCKER_COMPOSE | default('YES') }}"
        INSTALL_PACKAGES_UTILS_JSON: "{{ INSTALL_PACKAGES_UTILS_JSON | default('NO') }}"
        INSTALL_PACKAGES_UTILS_NETWORK: "{{ INSTALL_PACKAGES_UTILS_NETWORK | default('NO') }}"
        INSTALL_PACKAGES_NTP_AND_UPDATE_TIME: "{{ INSTALL_PACKAGES_NTP_AND_UPDATE_TIME | default('YES') }}"
        SPECIFIC_PACKAGES_CLEANING: "{{ SPECIFIC_PACKAGES_CLEANING | default('NO') }}"
  roles:
    - software.install.warmup.basic_packages

- name: system-baseline-docker-host - install dot files
  hosts: "{{ target_group }}"
  become: true
  pre_tasks:
    - name: Apply system-baseline-docker-host defaults (dotfiles play)
      ansible.builtin.set_fact:
        OPERATOR_USER: "{{ OPERATOR_USER | default('alice') }}"
        INSTALL_VIM_DOTFILES: "{{ INSTALL_VIM_DOTFILES | default('YES') }}"
        INSTALL_ZSH_DOTFILES: "{{ INSTALL_ZSH_DOTFILES | default('YES') }}"
  roles:
    - software.install.warmup.dot_files
