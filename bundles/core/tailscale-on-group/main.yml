# ============================================================================
# bundles/core/tailscale-on-group/main.yml
# ============================================================================
# Group-level tailscale setup :
#   - Play 1 : cleanup stale client entries on the wazuh server (so re-joining
#              VMs don't conflict with their previous identity in the tailnet).
#   - Play 2 : install tailscale + disable nftables on the target group's VMs.
#
# Both plays are gated by `INSTALL_TAILSCALE` (default NO). When NO, the bundle
# is effectively a no-op (no rules deleted, no install).
#
# Replaces the duplicated 2-play tailscale block that previously lived inline
# in each scenario's `_baseline_<group>.yml`.
#
# REQUIRED vars (passed at call-site via import_playbook vars:) :
#   target_group        : ansible group name (e.g. r42_admin)
#   tailscale_hostnames : list of short hostnames for cleanup on wazuh server
#                         (e.g. ["admin-wazuh", "admin-deployer-api-gateway", ...])
#
# OPTIONAL vars (defaults applied via set_fact pre_tasks ; pass at call-site
# to override) :
#   INSTALL_TAILSCALE        (default NO ; gates BOTH plays)
#   tailscale_cleanup_host   (default r42.admin-wazuh ; the wazuh server host)
#
# REQUIRED env (from `range42-context use <C> <S>`) :
#   RANGE42_ACTIVE_CONFIG_DIR  : for vault loading
#                                (infrastructure_tailscale_authkey)
#
# Example call-site :
#
# - import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/tailscale-on-group/main.yml"
#   vars:
#     target_group: "r42_admin"
#     INSTALL_TAILSCALE: "YES"
#     tailscale_hostnames:
#       - "admin-wazuh"
#       - "admin-deployer-api-gateway"
#       - "admin-deployer-api-backend"
#       - "admin-deployer-ui"
# ============================================================================

- name: tailscale - cleanup stale client entries on wazuh server
  hosts: "{{ tailscale_cleanup_host | default('r42.admin-wazuh') }}"
  gather_facts: false
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"
  vars:
    requested_tasks:
      - delete/tailscale_client.yml
  pre_tasks:
    - name: Apply tailscale defaults (cleanup play)
      ansible.builtin.set_fact:
        INSTALL_TAILSCALE: "{{ INSTALL_TAILSCALE | default('NO') }}"
  tasks:
    - name: TASK DYNAMIC INCLUDE FROM ansible.utils
      include_role:
        name: ansible.utils
      loop: "{{ tailscale_hostnames }}"
      loop_control:
        loop_var: tailscale_hostname
      when: INSTALL_TAILSCALE | upper == "YES"

- name: tailscale - install + disable nftables on target group
  hosts: "{{ target_group }}"
  become: true
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"
  vars:
    tailscale_authkey: "{{ infrastructure_tailscale_authkey }}"
  pre_tasks:
    - name: Apply tailscale defaults (install play)
      ansible.builtin.set_fact:
        INSTALL_TAILSCALE: "{{ INSTALL_TAILSCALE | default('NO') }}"
  tasks:
    - block:
        - include_role:
            name: software.install.tailscale
        - include_role:
            name: software.configure.tailscale_disable_nftables
      when: INSTALL_TAILSCALE | upper == "YES"
