# ============================================================================
# bundles/core/network-baseline-ssh-http/main.yml
# ============================================================================
# Network policy : SSH + HTTP + HTTPS.
# Opens 22, 80, 443 on the target group. Standard web-facing VM profile.
#
# REQUIRED vars : target_group
#
# Example call-site :
#
# - import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/network-baseline-ssh-http/main.yml"
#   vars:
#     target_group: "r42_admin"
# ============================================================================

- name: network-baseline-ssh-http - configure firewall (ports 22, 80, 443)
  hosts: "{{ target_group }}"
  become: true
  roles:
    - software.configure.firewalls
  vars:
    firewall_rules:
      - { ip: "all", port: 22,  protocol: "tcp" }
      - { ip: "all", port: 80,  protocol: "tcp" }
      - { ip: "all", port: 443, protocol: "tcp" }
