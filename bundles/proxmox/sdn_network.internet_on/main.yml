# Scoped internet state: change the selected subnet, preserve every other rule.
# Snapshot before writes; apply only for declaration drift or a missing enabled
# rule. Target cleanup still runs when no global apply is needed.
- name: sdn_network.internet_on
  hosts: proxmox
  gather_facts: false
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"
  tasks:
    - name: SDN INTERNET - READ SUBNETS
      ansible.builtin.include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: network_list_sdn_subnets

    - name: SDN INTERNET - SELECT THE REQUESTED SUBNET
      ansible.builtin.set_fact:
        _sdn_matches: "{{ network_list_sdn_subnets | selectattr('subnet', 'equalto', BUNDLE_SDN_SUBNET_ID) | list }}"

    - name: SDN INTERNET - REQUIRE ONE CONCRETE TARGET
      ansible.builtin.assert:
        that:
          - _sdn_matches | length == 1
          - (_sdn_matches[0].subnet_cidr | default('')) | length > 0
        fail_msg: The requested subnet must exist exactly once and have a concrete CIDR.

    - name: SDN INTERNET - RETAIN THE TARGET
      ansible.builtin.set_fact:
        _sdn_entry: "{{ _sdn_matches[0] }}"

    - name: SDN INTERNET - SELECT THE DESIRED STATE
      ansible.builtin.set_fact:
        _sdn_want: "{{ 1 }}"

    - name: SDN INTERNET - SNAPSHOT BEFORE ANY WRITE
      ansible.builtin.include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: network_snapshot_snat_rules

    - name: SDN INTERNET - IDENTIFY NECESSARY WRITES AND APPLY
      ansible.builtin.set_fact:
        _sdn_write: "{{ (_sdn_entry.subnet_snat | default(0) | int) != (_sdn_want | int) }}"
        _sdn_apply: "{{ ((_sdn_entry.subnet_snat | default(0) | int) != (_sdn_want | int)) or ((_sdn_want | int) == 1 and (network_snat_snapshot.nat_counts[_sdn_entry.subnet_cidr] | default(0) | int) == 0) }}"

    - name: SDN INTERNET - UPDATE ONLY THE TARGET DECLARATION
      ansible.builtin.include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: network_update_sdn_subnet
        sdn_vnet: "{{ _sdn_entry.subnet_vnet }}"
        sdn_subnet_id: "{{ BUNDLE_SDN_SUBNET_ID }}"
        sdn_subnet_snat: "{{ _sdn_want | int }}"
      when: _sdn_write | bool

    - name: SDN INTERNET - APPLY ONLY WHEN NECESSARY
      ansible.builtin.include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: network_apply_sdn
      when: _sdn_apply | bool

    - name: SDN INTERNET - RECONCILE ONLY THE SELECTED SOURCE
      ansible.builtin.include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: network_delete_extra_snat_rules
        sdn_subnet_cidr: "{{ _sdn_entry.subnet_cidr }}"
        sdn_snat_want: "{{ _sdn_want | int }}"

    - name: SDN INTERNET - PRESERVE NON-TARGET RULE IDENTITIES AND ORDER
      ansible.builtin.include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: network_restore_snat_snapshot
        sdn_snat_excluded_sources: "{{ [_sdn_entry.subnet_cidr] }}"
        sdn_snat_allow_new_rules: false
      when: _sdn_apply | bool
