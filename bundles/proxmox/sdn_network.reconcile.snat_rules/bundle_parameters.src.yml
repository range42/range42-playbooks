---
bundle: proxmox/sdn_network.reconcile.snat_rules
description: >-
  Reconcile one uniquely declared source on every applicable zone member with WANT 0/1,
  or inspect fresh per-node counts without mutations with WANT 99. Requires complete
  cluster snapshot coverage; never falls back to pruning only the API coordinator.
optional: false

params:
  - name: BUNDLE_SDN_SUBNET_CIDR
    type: string
    required: true
    default_where: none
    description: >-
      Canonical IPv4 CIDR including its mask, for example 192.168.199.0/24, not a Proxmox
      subnet ID. WANT 0/1 requires one authoritative subnet-to-VNet-to-zone binding.
      Read-only WANT 99 also accepts a source whose declaration has been deleted.

  - name: BUNDLE_SDN_SNAT_WANT
    type: int
    required: true
    default_where: none
    description: >-
      Exactly integer 0, 1, or 99. For 0/1, the declared SNAT state must already match;
      exact-source NAT rules are reconciled on zone members after complete snapshot
      and stable-state validation. Missing enabled rules are refused before cleanup.
      99 only reports every node's snapshot count, without rule writes or SDN apply,
      regardless of the count. Other numbers, strings and booleans are refused.

  - name: proxmox_node
    type: string
    required: true
    from_vault: true
    default_where: none
    description: >-
      API coordinator node resolved from the scenario vault. Every cluster node must
      have a verified SSH mapping into proxmox_cli; a standalone node may use the
      controller default. Reconciliation is scoped to applicable zone members, while
      read-only counts cover all nodes. The legacy snat_before alias identifies only
      this primary node and is not an aggregate.
