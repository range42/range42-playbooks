---
# Explicit zone deletion retains original scope across declaration removal.
- name: sdn_network.delete.all
  hosts: proxmox
  gather_facts: false
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"
  tasks:
    - name: SDN DELETE - RUN THE GUARDED WHOLE-ZONE FLOW
      ansible.builtin.include_tasks: ../_shared/sdn_delete.yml
      vars:
        _sdnd_zone: "{{ BUNDLE_SDN_ZONE }}"
        _sdnd_vnets: null
        _sdnd_read_only: false
