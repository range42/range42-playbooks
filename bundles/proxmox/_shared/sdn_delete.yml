---
# One guarded deletion pipeline; wrappers supply explicit normalized scope.
- name: SDN DELETE - REQUIRE EXPLICIT ZONE AND STABLE PRIVATE STATE
  ansible.builtin.assert:
    that:
      - _sdnd_zone is string
      - _sdnd_zone is match('^[A-Za-z][A-Za-z0-9]{1,7}$')
      - _sdnd_read_only or lookup('env', 'RANGE42_SDN_DELETE_STATE_DIR').startswith('/')
    fail_msg: Deletion requires one zone and an operator-owned persistent RANGE42_SDN_DELETE_STATE_DIR shared across attempts for this cluster.

- name: SDN DELETE - RETAIN THE JOURNAL ADDRESS
  ansible.builtin.set_fact:
    _sdnd_address:
      root: "{{ lookup('env', 'RANGE42_SDN_DELETE_STATE_DIR') }}"
      zone: "{{ _sdnd_zone }}"
    _sdnd_completed: []
    network_plan_sdn_delete: null
  no_log: true

- name: SDN DELETE - REFUSE UNFINISHED PRIOR DELETION EVEN IF DECLARATIONS ARE ABSENT
  ansible.builtin.include_role:
    name: range42-ansible_roles-proxmox_controller
  vars:
    proxmox_vm_action: network_sdn_delete_journal
    sdn_delete_journal_operation: check
    sdn_delete_journal_request: "{{ _sdnd_address }}"
  when: not _sdnd_read_only

- name: SDN DELETE - RESOLVE COMPLETE PENDING AND GUEST SCOPE
  ansible.builtin.include_role:
    name: range42-ansible_roles-proxmox_controller
  vars:
    proxmox_vm_action: network_plan_sdn_delete
    sdn_zone: "{{ _sdnd_zone }}"
    sdn_delete_vnets: "{{ _sdnd_vnets }}"

- name: SDN DELETE - REQUIRE CURRENT PRIVILEGED COORDINATOR RESULT
  ansible.builtin.assert:
    that:
      - network_plan_sdn_delete is mapping
      - network_plan_sdn_delete.privileged is sameas true
      - network_plan_sdn_delete.node == proxmox_node
      - network_plan_sdn_delete.scope.zone == _sdnd_zone
      - network_plan_sdn_delete.scope.selection == ('zone' if _sdnd_vnets is none else 'vnets')
      - network_plan_sdn_delete.scope.requested_vnets == ([] if _sdnd_vnets is none else _sdnd_vnets | sort)
    fail_msg: The matching controller must prove complete privileged deletion scope.

- name: SDN DELETE - RETAIN ORIGINAL DECLARATIONS AND SOURCE INTENT
  ansible.builtin.set_fact:
    _sdnd_scope: "{{ network_plan_sdn_delete.scope }}"
    network_list_sdn_subnets: "{{ network_plan_sdn_delete.scope.known_subnets }}"
  no_log: true

- name: SDN DELETE - BIND THE JOURNAL ADDRESS TO THE ACTUAL CLUSTER CA
  ansible.builtin.set_fact:
    _sdnd_address: "{{ _sdnd_address | combine({'cluster_identity': _sdnd_scope.cluster_identity}) }}"
  no_log: true

- name: SDN DELETE - REFUSE STATE DIRECTORY REUSE ACROSS CLUSTERS
  ansible.builtin.include_role:
    name: range42-ansible_roles-proxmox_controller
  vars:
    proxmox_vm_action: network_sdn_delete_journal
    sdn_delete_journal_operation: check
    sdn_delete_journal_request: "{{ _sdnd_address }}"
  when: not _sdnd_read_only

- name: SDN DELETE - REMOVE ONLY THE EXPLICIT EXISTING OBJECTS
  when: _sdnd_scope.objects_present and not _sdnd_read_only
  block:
    - name: SDN DELETE - SNAPSHOT EVERY NODE BEFORE ANY DECLARATION WRITE
      ansible.builtin.include_tasks: ../_shared/sdn_cluster_snapshot.yml
      vars:
        _sdn_snapshot_new_zones: {}
        _sdn_snapshot_desired_sources: "{{ _sdnd_scope.desired_sources }}"

    - name: SDN DELETE - REFRESH PENDING MEMBERSHIP AND ATTACHMENT GUARDS
      ansible.builtin.include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: network_plan_sdn_delete
        sdn_zone: "{{ _sdnd_zone }}"
        sdn_delete_vnets: "{{ _sdnd_vnets }}"

    - name: SDN DELETE - REQUIRE UNCHANGED ORIGINAL SCOPE BEFORE FIRST WRITE
      ansible.builtin.assert:
        that:
          - network_plan_sdn_delete.privileged is sameas true
          - network_plan_sdn_delete.node == proxmox_node
          - network_plan_sdn_delete.scope == _sdnd_scope
          - (network_snat_plan.nodes | map(attribute='node') | sort) == _sdnd_scope.cluster_nodes
        fail_msg: Declaration, node membership or guest attachment state changed after snapshot. No deletion is authorized.

    - name: SDN DELETE - DURABLY RETAIN ORIGINAL PROOF BEFORE FIRST WRITE
      ansible.builtin.include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: network_sdn_delete_journal
        sdn_delete_journal_operation: begin
        sdn_delete_journal_request: >-
          {{ _sdnd_address | combine({'payload': {'scope': _sdnd_scope,
              'plan': network_snat_plan, 'plan_input': network_snat_plan_input,
              'snapshots': network_snat_snapshots, 'reload_baseline': network_snat_reload_baseline}}) }}

    - name: SDN DELETE - RETAIN EXCLUSIVE JOURNAL RECEIPT
      ansible.builtin.set_fact:
        _sdnd_receipt: "{{ network_sdn_delete_journal }}"
      no_log: true

    - name: SDN DELETE - BUILD THE EXACT ORDERED DECLARATION OPERATIONS
      ansible.builtin.set_fact:
        _sdnd_operations: >-
          {%- set operations = [] -%}
          {%- for entry in _sdnd_scope.subnets -%}
          {%- set _ = operations.append({'action': 'network_delete_sdn_subnet', 'id': entry.subnet, 'vnet': entry.subnet_vnet}) -%}
          {%- endfor -%}
          {%- for name in _sdnd_scope.vnets -%}
          {%- set _ = operations.append({'action': 'network_delete_sdn_vnet', 'id': name, 'vnet': name}) -%}
          {%- endfor -%}
          {{ operations + ([{'action': 'network_delete_sdn_zone', 'id': _sdnd_scope.zone}] if _sdnd_scope.selection == 'zone' else []) }}

    - name: SDN DELETE - EXECUTE WITH DURABLE PARTIAL-FAILURE EVIDENCE
      block:
        - name: SDN DELETE - REMOVE OBJECTS IN THE RETAINED DECLARATION ORDER
          ansible.builtin.include_tasks: ../_shared/sdn_delete_object.yml
          loop: "{{ _sdnd_operations }}"
          loop_control:
            loop_var: _sdnd_object
            label: "{{ _sdnd_object.action }} {{ _sdnd_object.id }}"

        - name: SDN DELETE - RETAIN APPLY START BEFORE GLOBAL WRITE
          ansible.builtin.include_tasks: ../_shared/sdn_delete_phase.yml
          vars:
            _sdnd_phase: applying

        - name: SDN DELETE - APPLY WITH ORIGINAL MEMBERSHIP AND ALL-NODE COMPLETION
          ansible.builtin.include_role:
            name: range42-ansible_roles-proxmox_controller
          vars:
            proxmox_vm_action: network_apply_sdn

        - name: SDN DELETE - RETAIN VERIFIED COMPLETION BEFORE RULE CLEANUP
          ansible.builtin.include_tasks: ../_shared/sdn_delete_phase.yml
          vars:
            _sdnd_phase: reconciling
            _sdnd_extra_evidence:
              apply: "{{ network_apply_sdn }}"

        - name: SDN DELETE - RECONCILE RETAINED REMOVED SOURCES ON ORIGINAL MEMBERS
          ansible.builtin.include_role:
            name: range42-ansible_roles-proxmox_controller
          vars:
            proxmox_vm_action: network_reconcile_snat_sources

        - name: SDN DELETE - PRESERVE EXACT NON-TARGET AND NONMEMBER RULES
          ansible.builtin.include_role:
            name: range42-ansible_roles-proxmox_controller
          vars:
            proxmox_vm_action: network_restore_snat_snapshot

        - name: SDN DELETE - VERIFY SETTLED REMOVAL AND UNCHANGED OTHER DECLARATIONS
          ansible.builtin.include_role:
            name: range42-ansible_roles-proxmox_controller
          vars:
            proxmox_vm_action: network_plan_sdn_delete
            sdn_zone: "{{ _sdnd_zone }}"
            sdn_delete_vnets: "{{ _sdnd_vnets }}"

        - name: SDN DELETE - REQUIRE THE EXACT EXPECTED REMAINING INVENTORY
          ansible.builtin.assert:
            that:
              - network_plan_sdn_delete.privileged is sameas true
              - network_plan_sdn_delete.node == proxmox_node
              - network_plan_sdn_delete.scope.objects_present is sameas false
              - network_plan_sdn_delete.scope.cluster_identity == _sdnd_scope.cluster_identity
              - network_plan_sdn_delete.scope.inventory_sha256 == _sdnd_scope.remaining_sha256
            fail_msg: Deletion/apply may have completed, but final declarations or pending state differ. Retained private evidence requires inspection before retry.

        - name: SDN DELETE - MARK COMPLETE ONLY AFTER ALL READBACKS
          ansible.builtin.include_role:
            name: range42-ansible_roles-proxmox_controller
          vars:
            proxmox_vm_action: network_sdn_delete_journal
            sdn_delete_journal_operation: complete
            sdn_delete_journal_request: "{{ _sdnd_address | combine({'token': _sdnd_receipt.token, 'evidence': {'completed': _sdnd_completed, 'apply': network_apply_sdn, 'preservation': network_restore_snat_snapshot}}) }}"
      rescue:
        - name: SDN DELETE - RETAIN FAILURE WITHOUT GUESSING WHICH REMOTE WRITE COMMITTED
          ansible.builtin.include_tasks: ../_shared/sdn_delete_phase.yml
          vars:
            _sdnd_phase: failed
        - name: SDN DELETE - REFUSE AUTOMATIC PARTIAL DELETE RESUME
          ansible.builtin.fail:
            msg: Deletion did not complete. The private journal retains original scope, snapshots and last phase; inspect all covered nodes and declarations before an operator-managed recovery. Blind retries are blocked.

- name: SDN DELETE - REPORT VERIFIED ABSENCE WITHOUT CLAIMING ORPHAN CLEANUP
  ansible.builtin.debug:
    msg: "The selected objects are already absent; no declaration, apply or rule write was performed. This observation does not infer orphan rule scope."
  when: not _sdnd_scope.objects_present and not _sdnd_read_only

- name: SDN DELETE - REPORT READ-ONLY DECLARATION SCOPE
  ansible.builtin.debug:
    msg:
      read_only: true
      zone: "{{ _sdnd_scope.zone }}"
      keep_zone: "{{ _sdnd_scope.selection == 'vnets' }}"
      vnets: "{{ _sdnd_scope.vnets }}"
      absent_vnets: "{{ _sdnd_scope.absent_vnets }}"
      subnets: "{{ _sdnd_scope.subnets }}"
      note: Read-only declaration and guest inspection; no declaration, apply, rule or journal write. Mutation admission and rule snapshots are not checked; no orphan cleanup is inferred.
  when: _sdnd_read_only
