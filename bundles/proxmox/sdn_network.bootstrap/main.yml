---
# List entrypoint: keep the caller's full declared list authoritative.
# Shared tasks read proxmox_node from this play's vault.
- name: sdn_network.bootstrap
  hosts: proxmox
  gather_facts: false
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"
  tasks:
    - name: SDN BOOTSTRAP - RUN THE VERIFIED FLOW FOR THE DECLARED LIST
      ansible.builtin.include_tasks: ../_shared/sdn_bootstrap.yml
      vars:
        _sdn_bootstrap_zone: "{{ BUNDLE_SDN_ZONE }}"
        _sdn_bootstrap_networks: "{{ BUNDLE_SDN_VNETS }}"
