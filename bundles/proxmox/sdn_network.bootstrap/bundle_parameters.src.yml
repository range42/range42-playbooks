---
bundle: proxmox/sdn_network.bootstrap
description: >-
  Bring the declared SDN networks up on a Proxmox cluster - read the live state, create what is
  missing, update what has drifted, apply once, then reconcile the live SNAT rules. This is the
  single bundle a scenario imports for its networks.
optional: false

##
## NAMING - first application of the BUNDLE_<AREA>_<NAME> namespace
##
## Caller-passed inputs carry the BUNDLE_ prefix. It is not decoration for a human reading a
## vars: block - there, everything is a bundle param by construction. It is for the BACKEND,
## which will generate call-sites and inject its own vars into a play whose variable space is
## FLAT and already holds group_vars, host_vars, scenario vars, vault vars and role defaults.
## A generator needs a mechanical rule for which names it owns ; "starts with BUNDLE_" is one
## it can apply without reading the contract's semantics.
##
## proxmox_node is DELIBERATELY NOT renamed. The BUNDLE_ namespace is for what the caller
## PASSES ; a vault value is not passed, it is read - the play loads default_vault.yml and the
## role reads the key directly. Same treatment as admin/software.install.deployer_api_backend,
## the one existing contract that declares it. Renaming it would also need a vault_key field
## and, to stay overridable, `proxmox_node: "{{ BUNDLE_PROXMOX_NODE | default(proxmox_node) }}"`
## - which self-references and raises "Recursive loop detected in template".
##

params:

  - name: BUNDLE_SDN_ZONE
    renamed_to: [sdn_zone]
    type: string
    required: true
    default_where: none
    description: >-
      Name of the SDN zone that holds every vnet of the list below. Created if absent. Its type is
      pinned to `simple` by the role (host-local, no VLAN, no VXLAN), so it is not a parameter here.
      The zone name is also the prefix Proxmox uses to build each subnet id, `<zone>-<network>-<mask>`.

  ##
  ## NO renamed_to HERE, DELIBERATELY. The schema defines it as "the role var(s) the caller name maps
  ## to, a list because one caller var can fan out" - a fan-out being the SAME value under several
  ## names, as in vm.bootstrap where global_vm_id feeds both vm_new_id and vm_id. This is not that :
  ## BUNDLE_SDN_VNETS never becomes sdn_vnet, `item.vnet` does. It is a structural decomposition, and
  ## `items` below is what describes it correctly. Listing the four role vars here would also invite a
  ## generating backend to pass sdn_vnet directly, bypassing this bundle's interface.
  ##
  - name: BUNDLE_SDN_VNETS
    type: list
    items: "{ vnet: string, subnet: string (CIDR), gateway: string (optional), snat: bool (optional, default true) }"
    required: true
    default_where: none
    description: >-
      The networks to bring up. One call per entry ; each entry's fields feed the role vars
      sdn_vnet / sdn_subnet / sdn_subnet_gateway / sdn_subnet_snat. `snat: true` is what gives the
      guests outbound internet ; omitted, it defaults to true. `gateway` is optional - a subnet
      without one is legal and gets no gateway. A single-entry list is the "on the fly" case the
      backend uses, and works exactly the same.

  - name: proxmox_node
    type: string
    required: true
    from_vault: true
    default_where: none
    description: >-
      Proxmox node the SDN objects are read and written through, resolved from the scenario vault.
      Read directly by the role from default_vault.yml, not passed at the call-site - hence no
      BUNDLE_ prefix and no bridge in main.yml.
