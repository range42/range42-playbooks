#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#
# vm.detach.sdn_vnet - remove one network card from a VM
#
# NO BRIDGE PARAMETER, and that is not an omission : the API addresses a card by its SLOT, netN, not by
# what it is attached to. So this bundle takes the id, never a bridge name.
#
# Subject `vm` and not `sdn_network` : it removes a card on a legacy vmbr as readily as one on a vnet.
#
# WHY IT READS BEFORE DELETING
# Deleting a slot the VM does not have is a silent no-op on some Proxmox versions and an error on
# others. Reading first turns both into one clear refusal that names the cards the VM really has.
#
# THIS IS WHAT FREES A VNET
# Proxmox REFUSES to delete a vnet that still carries a VM card. So a delete that stops at
# sdn_network.delete.sdn_vnet without detaching first fails, and the failure blames the vnet rather than
# the card. Detach first, or use vm.replace.sdn_vnet to move the card somewhere else.
#
# Required : BUNDLE_VM_ID, BUNDLE_VM_VMNET_ID. From the vault : proxmox_node.
#
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: "vm.detach.sdn_vnet"
  hosts: proxmox
  gather_facts: false
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"

  tasks:

    ## In a TASK, not the play name : a play name is templated at parse time and would break --syntax-check.
    - name: VM DETACH - WHAT WAS ASKED
      ansible.builtin.debug:
        msg:
          - "proxmox node : {{ proxmox_node }}"
          - "vm id        : {{ BUNDLE_VM_ID }}"
          - "card         : net{{ BUNDLE_VM_VMNET_ID }}"

    ## The fact APPENDS, so it is reset before the read - see vm.list.interfaces.
    - name: VM DETACH - RESET THE ACCUMULATING FACT
      ansible.builtin.set_fact:
        network_list_interfaces_vm: []

    - name: VM DETACH - READ THE CARDS
      include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: "network_list_interfaces_vm"
        vm_id: "{{ BUNDLE_VM_ID }}"

    - name: VM DETACH - REFUSE IF THE CARD IS NOT THERE
      ansible.builtin.assert:
        that:
          - ((network_list_interfaces_vm | default([])) | selectattr('vm_vmnet_id', 'equalto',
             (BUNDLE_VM_VMNET_ID | int)) | list | length) == 1
        fail_msg: >-
          vm {{ BUNDLE_VM_ID }} has no card net{{ BUNDLE_VM_VMNET_ID }}. Nothing was changed. Cards it
          really has :
          {{ (network_list_interfaces_vm | default([])) | map(attribute='vm_network_device') | list }}
        success_msg: >-
          net{{ BUNDLE_VM_VMNET_ID }} is there, on
          {{ (network_list_interfaces_vm | selectattr('vm_vmnet_id', 'equalto',
              (BUNDLE_VM_VMNET_ID | int)) | first).vm_network_bridge }} - removing it

    - name: VM DETACH - REMOVE THE CARD
      include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: "network_delete_interfaces_vm"
        vm_id: "{{ BUNDLE_VM_ID }}"
        vm_vmnet_id: "{{ BUNDLE_VM_VMNET_ID | int }}"
