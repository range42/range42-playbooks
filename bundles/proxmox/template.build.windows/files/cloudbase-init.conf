[DEFAULT]
# cloudbase-init service configuration of the range42 Windows templates
# (copied by finalize.ps1 over the file the MSI installs).
# Source of every value : the Proxmox cloud-init drive (configdrive2) on ide2 of each clone.
username=alice
groups=Administrators
inject_user_password=true
first_logon_behaviour=no
netbios_host_name_compatibility=true
metadata_services=cloudbaseinit.metadata.services.configdrive.ConfigDriveService
# Proxmox presents the cloud-init drive only as an iso9660 cdrom (ide2) : keep both narrow
# (see the README security notes).
config_drive_types=iso
config_drive_locations=cdrom
plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,cloudbaseinit.plugins.common.networkconfig.NetworkConfigPlugin,cloudbaseinit.plugins.windows.extendvolumes.ExtendVolumesPlugin,cloudbaseinit.plugins.windows.createuser.CreateUserPlugin,cloudbaseinit.plugins.common.setuserpassword.SetUserPasswordPlugin,cloudbaseinit.plugins.common.sshpublickeys.SetUserSSHPublicKeysPlugin,cloudbaseinit.plugins.common.userdata.UserDataPlugin,cloudbaseinit.plugins.common.localscripts.LocalScriptsPlugin
mtu_use_dhcp_config=false
ntp_use_dhcp_config=false
allow_reboot=true
stop_service_on_exit=true
check_latest_version=false
bsdtar_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\bsdtar.exe
mtools_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\
local_scripts_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\LocalScripts\
# verbose and debug : set both to true for diagnostics only (see the README security notes)
verbose=false
debug=false
log_dir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
log_file=cloudbase-init.log
default_log_levels=comtypes=INFO,suds=INFO,iso8601=WARN,requests=WARN
logging_serial_port_settings=
