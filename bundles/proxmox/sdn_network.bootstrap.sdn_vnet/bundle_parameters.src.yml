---
bundle: proxmox/sdn_network.bootstrap.sdn_vnet
description: >-
  Bring up one VNet and subnet from direct parameters. Verify complete cluster coverage before
  creating missing objects or updating explicit drift, apply at most once when needed, and reconcile
  SNAT on the zone's members while preserving unrelated rules.
optional: false

##
## Caller-passed inputs carry the BUNDLE_ prefix : the backend will generate call-sites and inject its
## own variables into a play whose variable space is FLAT, so a generator needs a mechanical rule for
## which names it owns. proxmox_node is NOT prefixed - it is read from the scenario vault, not passed.
## Full reasoning in ______TODO_bundle-parameters-declaration_v6.md section 9.
##
## BUNDLE_SDN_SUBNET_SNAT is optional with the default carried HERE and not left to the role : the role
## consumes it into a module-arg dict, but the reconciliation step needs a real integer for `want`, and a
## `| default(omit)` placeholder would make the role's own `| default(1)` never fire. See v6 section 11.
##

params:

  - name: BUNDLE_SDN_ZONE
    renamed_to: [sdn_zone]
    type: string
    required: true
    default_where: none
    description: >-
      SDN zone that will hold the vnet. Created if absent. Its type is pinned to `simple` by the role -
      host-local, no VLAN, no VXLAN.

  - name: BUNDLE_SDN_VNET
    renamed_to: [sdn_vnet]
    type: string
    required: true
    default_where: none
    description: >-
      Name of the vnet. Created if absent. This is the name a VM uses as its bridge, so it is the name
      that ends up in a manifest.

  - name: BUNDLE_SDN_SUBNET_CIDR
    renamed_to: [sdn_subnet]
    type: string
    required: true
    default_where: none
    description: >-
      The subnet as a CIDR, for instance 192.168.142.0/24. Used twice - to create the subnet, and to
      anchor the live-rule reconciliation, which matches on the source network.

  - name: BUNDLE_SDN_SUBNET_GATEWAY
    renamed_to: [sdn_subnet_gateway]
    type: string
    required: false
    default_where: none
    description: >-
      Optional subnet gateway. Omission preserves an existing gateway; a new subnet gets no gateway
      when omitted. An explicit value participates in drift detection and updates.

  - name: BUNDLE_SDN_SUBNET_SNAT
    renamed_to: [sdn_subnet_snat]
    type: int
    required: false
    default_where: bundle-inline
    default: 1
    description: >-
      Integer 1 enables subnet SNAT and 0 disables it; defaults to 1. Updates the declaration and
      reconciles its live rules on every applicable zone member. A missing enabled rule can require
      one apply even when the declaration already matches.

  - name: proxmox_node
    type: string
    required: true
    from_vault: true
    default_where: none
    description: >-
      API coordinator resolved from the scenario vault. The inventory must provide complete
      node-to-SSH coverage in proxmox_cli; reconciliation covers the subnet's zone members and
      preservation covers every cluster node.
