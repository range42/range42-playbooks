---
bundle: proxmox/sdn_network.delete.sdn_zone
description: >-
  Delete one zone. Raw single API call - not idempotent, and what it writes stays pending until
  sdn_network.apply runs.
optional: false

##
## Caller-passed inputs carry the BUNDLE_ prefix : the backend will generate call-sites and inject its
## own variables into a play whose variable space is FLAT, so a generator needs a mechanical rule for
## which names it owns. proxmox_node is NOT prefixed - it is read from the scenario vault, not passed.
## Full reasoning in ______TODO_bundle-parameters-declaration_v6.md section 9.
##

params:

  - name: BUNDLE_SDN_ZONE
    renamed_to: [sdn_zone]
    type: string
    required: true
    default_where: none
    description: >-
      Name of the SDN zone. Its type is pinned to `simple` by the role - host-local, no VLAN, no VXLAN.

  - name: proxmox_node
    type: string
    required: true
    from_vault: true
    default_where: none
    description: >-
      Proxmox node the API call goes through, resolved from the scenario vault. The SDN endpoints are
      cluster-level, so the node decides where the request lands, not what it affects.
