---
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#
# PROMOX INIT - create alpine 3.21 template :
#
#   vm_id    : 9903
#   cpu core : 1
#   ram      : 512m
#   disk     : 4g
#   ip       : 192.168.142.203
#
# NOTE : alpine template uses subnet 142 (not 140 like ubuntu_noble) since
# alpine doesn't need an apt-update flow before template conversion.
# Template gets converted inline (no separate finalize step).
#
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

##
##

- hosts: proxmox
  gather_facts: false
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"

  tasks:
    #### #### IDEMPOTENCE - skip everything if VM is already finalized as template ####
    - name: TEMPLATE 9903 - CHECK if already finalized as template
      ansible.builtin.shell: qm config 9903 2>/dev/null | grep -q '^template:'
      register: tpl_9903_is_template
      failed_when: false
      changed_when: false
      delegate_to: "{{ inventory_hostname }}-cli"

    - name: TEMPLATE 9903 - WAIT for unlock if a parallel deploy holds the VM
      ansible.builtin.shell: qm config 9903 | grep -q '^lock:'
      register: tpl_9903_lock
      until: tpl_9903_lock.rc != 0
      retries: 30
      delay: 10
      failed_when: false
      changed_when: false
      delegate_to: "{{ inventory_hostname }}-cli"
      when: tpl_9903_is_template.rc != 0

    - name: TEMPLATE 9903 - SKIP all (already finalized as template)
      ansible.builtin.debug:
        msg: "Template 9903 is already a template - skipping. Run delete-everything to recreate."
      when: tpl_9903_is_template.rc == 0

    #### #### vm_create idempotence: separate "exists" check (skip vm_create only) ####
    - name: TEMPLATE 9903 - CHECK if VM exists (vm_create idempotence)
      ansible.builtin.shell: qm config 9903 2>/dev/null
      register: tpl_9903_exists
      failed_when: false
      changed_when: false
      delegate_to: "{{ inventory_hostname }}-cli"
      when: tpl_9903_is_template.rc != 0

    - name: PROMOX INIT - TEMPLATES - CREATE TEMPLATE - template-vm-alpine-nano
      include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: "vm_create"
        vm_id: 9903
        vm_name: "template-vm-alpine-nano"
        vm_cpu: "host"
        vm_cores: 1
        vm_sockets: 1
        vm_memory: 512
        vm_net_virtio_bridge: "vmbr140"
      when:
        - tpl_9903_is_template.rc != 0
        - tpl_9903_exists.rc != 0

    ####
    - name: PROMOX INIT - TEMPLATES - WAIT for vm_create to finish (lock-aware)
      ansible.builtin.shell: qm config 9903 | grep -q '^lock:'
      register: tpl_9903_post_create_lock
      until: tpl_9903_post_create_lock.rc != 0
      retries: 60 # 60 x 5s = 5 min max safety
      delay: 5
      failed_when: false
      changed_when: false
      delegate_to: "{{ inventory_hostname }}-cli"
      when:
        - tpl_9903_is_template.rc != 0
        - tpl_9903_exists.rc != 0
####

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- hosts: proxmox_cli
  gather_facts: false
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"

  tasks:
    - name: TEMPLATE 9903 - CHECK if already template (proxmox_cli play)
      ansible.builtin.shell: qm config 9903 2>/dev/null | grep -q '^template:'
      register: tpl_9903_is_template
      failed_when: false
      changed_when: false

    #
    - name: PROMOX INIT - TEMPLATES - IMPORT CLOUD INIT DISK - template-vm-alpine-nano
      include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: "template_cloudinit_import_disk"
        proxmox_node: "px-testing-cli"
        cloudinit_image_full_path: "/var/lib/vz/template/iso/nocloud_alpine-3.21.0-x86_64-bios-cloudinit-r0.img"
        vm_id: 9903
        vm_disk_size: "4g"
        proxmox_dest_vm_storage_name: "local-lvm"
      when: tpl_9903_is_template.rc != 0

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- hosts: proxmox
  gather_facts: false
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"

  tasks:
    - name: TEMPLATE 9903 - CHECK if already template (third play)
      ansible.builtin.shell: qm config 9903 2>/dev/null | grep -q '^template:'
      register: tpl_9903_is_template
      failed_when: false
      changed_when: false
      delegate_to: "{{ inventory_hostname }}-cli"

    #
    - name: PROMOX INIT - TEMPLATES - SET CLOUD DEFAULT INIT VARIABLE - template-vm-alpine-nano
      include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: "cloudinit_set_variables"
        vm_id: 9903
        vm_ci_user: "{{ default_admin_vm_ci_user | default('alice') }}"
        vm_ci_password: "{{ default_trainee_vm_ci_password | default('supersecret') }}"
        vm_ci_ssh_key: "{{ default_trainee_vm_ci_ssh_key  }}"
        vm_ci_dns_ips: "1.1.1.1"
        vm_ci_ip: "192.168.142.203"
        vm_ci_netmask: "24"
        vm_ci_ip_gw: "192.168.142.1"
      when: tpl_9903_is_template.rc != 0

    #
    - name: PROMOX INIT - TEMPLATES - SET PROMOX TAG
      include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: "vm_set_tag"
        vm_id: 9903
        vm_tag_name: "template"
      when: tpl_9903_is_template.rc != 0

    #
    # NOTE : alpine converts inline (no separate finalize step like ubuntu_noble's
    # _update_templates.yml). Alpine doesn't need apt-update before conversion.
    #
    - name: PROMOX INIT - TEMPLATES - CONVERT VM TO TEMPLATE - template-vm-alpine-nano
      include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: "template_convert_vm_to_template"
        proxmox_storage: "local"
        vm_id: 9903
      when: tpl_9903_is_template.rc != 0
