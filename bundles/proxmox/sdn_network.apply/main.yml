# Apply explicitly pending configuration once. Preserve prior duplicate rule
# identities; retain legitimate new NAT rules created by this global operation.
- name: sdn_network.apply
  hosts: proxmox
  gather_facts: false
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"
  tasks:
    - name: SDN APPLY - SNAPSHOT EVERY NODE BEFORE APPLY
      ansible.builtin.include_tasks: ../_shared/sdn_cluster_snapshot.yml
      vars:
        _sdn_snapshot_desired_sources: []
        _sdn_snapshot_new_zones: {}
        _sdn_snapshot_excluded_sources: "{{ BUNDLE_SDN_CHANGED_SOURCES | default([]) }}"
        _sdn_snapshot_allow_new_rules: true

    - name: SDN APPLY - REQUIRE THE REVIEWED SNAPSHOT BEFORE ANY WRITE
      ansible.builtin.assert:
        that:
          - "(network_snat_snapshot.reviewed_policy | default(none)) == {'excluded_sources': BUNDLE_SDN_CHANGED_SOURCES | default([]), 'allow_new_rules': true}"
        fail_msg: The controller must validate and record the requested NAT preservation scope before apply.

    - name: SDN APPLY - FLUSH PENDING CONFIGURATION ONCE
      ansible.builtin.include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: network_apply_sdn

    - name: SDN APPLY - REMOVE ONLY APPENDED DUPLICATES OF PRIOR NAT RULES
      ansible.builtin.include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: network_restore_snat_snapshot
        sdn_snat_excluded_sources: "{{ BUNDLE_SDN_CHANGED_SOURCES | default([]) }}"
        sdn_snat_allow_new_rules: true
