# Apply explicitly pending configuration once. Preserve prior duplicate rule
# identities; retain legitimate new NAT rules created by this global operation.
- name: sdn_network.apply
  hosts: proxmox
  gather_facts: false
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"
  tasks:
    - name: SDN APPLY - SNAPSHOT THE NODE BEFORE APPLY
      ansible.builtin.include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: network_snapshot_snat_rules

    - name: SDN APPLY - FLUSH PENDING CONFIGURATION ONCE
      ansible.builtin.include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: network_apply_sdn

    - name: SDN APPLY - REMOVE ONLY APPENDED DUPLICATES OF PRIOR NAT RULES
      ansible.builtin.include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: network_restore_snat_snapshot
        sdn_snat_excluded_sources: []
        sdn_snat_allow_new_rules: true
