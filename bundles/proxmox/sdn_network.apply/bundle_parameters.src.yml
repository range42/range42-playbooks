---
bundle: proxmox/sdn_network.apply
description: >-
  Flush the pending SDN config into the running one - PUT /cluster/sdn, then poll the UPID to
  completion. Preserve untouched NAT sources, with explicit review of existing source CIDRs
  whose rules may change. Apply remains cluster-wide; preservation currently covers one node.
optional: false

##
## The endpoint applies all pending configuration. BUNDLE_SDN_CHANGED_SOURCES scopes only the
## local preservation policy, never the cluster-wide apply itself.
##
## The role's two polling knobs (sdn_apply_poll_retries default 60, sdn_apply_poll_delay default 2)
## are DELIBERATELY not exposed. Bridging them with `| default(omit)` would BREAK the role's defaults
## instead of preserving them - an include_role var set to default(omit) arrives DEFINED-but-empty, so
## the role's `| default(60)` never fires. Exposing them properly means duplicating the values in the
## bundle with default_where: bundle-inline. See ______TODO_bundle-parameters-declaration_v6.md
## section 11.
##

params:

  - name: BUNDLE_SDN_CHANGED_SOURCES
    type: list
    required: false
    default: []
    default_where: bundle-inline
    description: >-
      Up to 64 unique canonical IPv4 source CIDRs whose SNAT/MASQUERADE rules may be removed,
      reordered or replaced by pending configuration. The exact list is validated before apply
      and bound to its snapshot. Other existing sources and every non-NAT rule remain protected.
      For a CIDR change, list both the old and new CIDR. This does not scope the global apply.

  - name: proxmox_node
    type: string
    required: true
    from_vault: true
    default_where: none
    description: >-
      Proxmox node the apply request goes through, resolved from the scenario vault. The apply itself
      is cluster-wide - the node decides where the request lands, not what it reloads.
