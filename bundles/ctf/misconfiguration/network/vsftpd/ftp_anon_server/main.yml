---
# ============================================================================
# bundles/ctf/misconfiguration/network/vsftpd/ftp_anon_server/main.yml
# ============================================================================
# Deploys vsftpd anonymous FTP misconfiguration vulnerable container via docker-compose.
# Mirrors the catalog source tree exactly :
#   {{ env RANGE42_INVENTORY__DOCKER__CTF }}/misconfiguration/network/vsftpd/ftp_anon_server/
#
# Exposed port (default) : 21
#
# REQUIRED vars :
#   - global_vm_ssh_name : inventory hostname for the target VM
#
# OPTIONAL vars :
#   - OPERATOR_USER         : SSH user (default = default_admin_vm_ci_user from group_vars)
#   - REMOTE_PROJECT_DIR    : compose deploy dir (default = /tmp/deploy-ftp_anon_server)
#   - CLEAN_UP_DEPLOY_DIR   : YES/NO (default NO)
#   - SEND_POC_DIR          : YES/NO (default NO)
#
# TODO BUNDLE_PORTS_TCP : declared exposed ports for per-host firewall agregation
#   BUNDLE_PORTS_TCP: [21]
#
# Example call-site :
#
# - import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/ctf/misconfiguration/network/vsftpd/ftp_anon_server/main.yml"
#   vars:
#     global_vm_ssh_name: "r42.vuln-box-00"
# ============================================================================

- name: deploy CTF - vsftpd anonymous FTP misconfig - exposed_port:21
  hosts: "{{ global_vm_ssh_name }}"
  become: true
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"
  roles:
    - software.configure.docker-compose
  vars:
    LABEL_PROJECT_TYPE: "CTF"
    LABEL_PROJET_NAME: "ftp_anon_server"
    LOCAL__PROJECT_DIR: "{{ lookup('env', 'RANGE42_INVENTORY__DOCKER__CTF') }}/misconfiguration/network/vsftpd/ftp_anon_server/"
    REMOTE_PROJECT_DIR: "/tmp/deploy-ftp_anon_server"
    OPERATOR_USER: "{{ default_admin_vm_ci_user }}"
    CLEAN_UP_DEPLOY_DIR: "NO"
    SEND_POC_DIR: "NO"
