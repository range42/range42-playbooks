---
bundle: generic/systems.configure.windows_eval_activation

description: Activate Windows evaluation editions online (slmgr.vbs /ato with retries until licensed for more than one day, else fail with the error code)

optional: false

params:
  - name: TARGET_GROUP
    target: true
    type: string
    required: true
    default_where: none
    description: Ansible inventory group the play targets (used in hosts) - Windows hosts

  - name: WIN_EVAL_ACTIVATION_RETRIES
    type: int
    required: false
    default_where: role-defaults
    description: Activation attempts after the first one ; read directly by the role

  - name: WIN_EVAL_ACTIVATION_DELAY
    type: int
    required: false
    default_where: role-defaults
    description: Seconds between two activation attempts ; read directly by the role
