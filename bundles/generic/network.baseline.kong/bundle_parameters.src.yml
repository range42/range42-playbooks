---
bundle: generic/network.baseline.kong

description: Network baseline policy that opens 22/tcp plus Kong proxy ports 8000/tcp and 8443/tcp on the target group

optional: false

params:
  - name: target_group
    target: true
    type: string
    required: true
    default_where: none
    description: Inventory group the Kong firewall policy is applied to (VMs hosting the Kong API gateway proxy)
