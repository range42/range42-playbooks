---
bundle: generic/network.configure.ufw_rules
description: Apply a caller-provided list of UFW allow-rules on a target group (default-deny incoming).
optional: false

params:

  - name: target_group
    target: true
    type: string
    required: true
    default_where: none
    description: Ansible group or host(s) this bundle runs against (the play hosts value). Canonical name Phase 2 = TARGET_ANSIBLE_HOSTS.

  - name: UFW_RULES
    renamed_to: [firewall_rules]
    type: list
    items: "{ ip: string (CIDR or 'all'), port: int, protocol: string ('tcp'|'udp') }"
    required: true
    default_where: none
    description: >-
      Allow-rules to apply. The role resets rules and default-denies incoming, so the
      list MUST include SSH (port 22) or the group locks itself out.
