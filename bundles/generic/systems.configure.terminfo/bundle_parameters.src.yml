---
bundle: generic/systems.configure.terminfo

description: Install the alacritty terminfo entry and allow sshd to accept the client TERM value on a target group

optional: false

params:
  - name: terminfo_hosts
    target: true
    type: string
    required: true
    default_where: call-site
    description: Ansible inventory group the play targets (used in hosts) ; required, no fallback — an implicit all would touch the hypervisor and deployer
