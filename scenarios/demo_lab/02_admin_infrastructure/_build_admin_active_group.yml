##
## demo_lab - 02_admin_infrastructure - build r42_admin_active
##
## Builds the runtime-only r42_admin_active group from the INSTALL_<flag>
## values set at deploy time. Members are added via ansible.builtin.add_host,
## so the group is in-memory only ; the workspace inventory_default.yml is
## NOT modified.
##
## Used by _baseline_admin.yml as target_group, so the baseline only runs on
## admin VMs that stage_00 actually deployed (per INSTALL flags). The
## admin-wazuh.yml / deployer_*.yml wrappers continue to target their VM
## directly by name (hosts: r42.admin-*) and don't depend on this group.
##
## Membership map (mirrors stage_00 _r42_admin_group.yml gating) :
##
##   admin VM                             stage_00 gate                    add_host condition
##   ----------------------------------- -------------------------------- ----------------------
##   r42.admin-wazuh                      INSTALL_WAZUH (default YES)      INSTALL_WAZUH=YES
##   r42.admin-misp                       INSTALL_MISP (default NO)        INSTALL_MISP=YES
##   r42.admin-deployer-api-gateway       INSTALL_DEPLOYER_UI (default NO) INSTALL_DEPLOYER_UI=YES
##   r42.admin-deployer-api-backend       INSTALL_DEPLOYER_UI (default NO) INSTALL_DEPLOYER_UI=YES
##   r42.admin-deployer-ui                INSTALL_DEPLOYER_UI (default NO) INSTALL_DEPLOYER_UI=YES
##
## With INSTALL_WAZUH=NO (operator opts out of the SIEM), the baseline skips
## admin-wazuh cleanly. Same for INSTALL_MISP=NO and admin-misp. The 3
## deployer-* are gated behind INSTALL_DEPLOYER_UI (default NO) ; with it unset
## they are not bootstrapped in stage_00 and not added to this group.
##

- name: build r42_admin_active dynamic group from INSTALL flags
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: add r42.admin-wazuh to r42_admin_active when INSTALL_WAZUH=YES
      ansible.builtin.add_host:
        name: r42.admin-wazuh
        groups: r42_admin_active
      when: INSTALL_WAZUH | default("YES") | upper == "YES"
      changed_when: false

    - name: add r42.admin-misp to r42_admin_active when INSTALL_MISP=YES
      ansible.builtin.add_host:
        name: r42.admin-misp
        groups: r42_admin_active
      when: INSTALL_MISP | default("NO") | upper == "YES"
      changed_when: false

    - name: add r42.admin-gitea to r42_admin_active when INSTALL_GITEA=YES
      ansible.builtin.add_host:
        name: r42.admin-gitea
        groups: r42_admin_active
      when: INSTALL_GITEA | default("NO") | upper == "YES"
      changed_when: false

    - name: add r42.admin-mattermost to r42_admin_active when INSTALL_MATTERMOST=YES
      ansible.builtin.add_host:
        name: r42.admin-mattermost
        groups: r42_admin_active
      when: INSTALL_MATTERMOST | default("NO") | upper == "YES"
      changed_when: false

    - name: add r42.admin-nextcloud to r42_admin_active when INSTALL_NEXTCLOUD=YES
      ansible.builtin.add_host:
        name: r42.admin-nextcloud
        groups: r42_admin_active
      when: INSTALL_NEXTCLOUD | default("NO") | upper == "YES"
      changed_when: false

    - name: add r42.admin-rocketchat to r42_admin_active when INSTALL_ROCKETCHAT=YES
      ansible.builtin.add_host:
        name: r42.admin-rocketchat
        groups: r42_admin_active
      when: INSTALL_ROCKETCHAT | default("NO") | upper == "YES"
      changed_when: false

    - name: add r42.admin-deployer-api-gateway to r42_admin_active when INSTALL_DEPLOYER_UI=YES
      ansible.builtin.add_host:
        name: r42.admin-deployer-api-gateway
        groups: r42_admin_active
      when: INSTALL_DEPLOYER_UI | default("NO") | upper == "YES"
      changed_when: false

    - name: add r42.admin-deployer-api-backend to r42_admin_active when INSTALL_DEPLOYER_UI=YES
      ansible.builtin.add_host:
        name: r42.admin-deployer-api-backend
        groups: r42_admin_active
      when: INSTALL_DEPLOYER_UI | default("NO") | upper == "YES"
      changed_when: false

    - name: add r42.admin-deployer-ui to r42_admin_active when INSTALL_DEPLOYER_UI=YES
      ansible.builtin.add_host:
        name: r42.admin-deployer-ui
        groups: r42_admin_active
      when: INSTALL_DEPLOYER_UI | default("NO") | upper == "YES"
      changed_when: false
