---
##
## demo_lab - 02_admin_infrastructure - build r42_demo_lab_wazuh_clients_active
##
## Structure : runtime-only group built via add_host on localhost based on
## INSTALL_<flag> values at deploy time. Mirror of _build_admin_active_group.yml
## (Option A pattern, kungfu 198) applied to the wazuh-agent client list.
##
## Used by _finalize-baseline-admin_wazuh_client.yml as wazuh_clients_group.
## Per-host gating without inventory file modification ; the wazuh-agent
## install only targets VMs that exist at deploy time.
##
## Membership map :
##
##   client VM                              VM creation gate                 add_host condition
##   -------------------------------------- ------------------------------- ----------------------
##   r42.admin-misp                          INSTALL_MISP (default NO)       INSTALL_MISP=YES
##   r42.admin-deployer-api-gateway          (none, always created)          always added
##   r42.admin-deployer-api-backend          (none, always created)          always added
##   r42.admin-deployer-ui                   (none, always created)          always added
##   r42.vuln-box-00 .. vuln-box-04          (ctf tier, always created)      always added
##
## The wazuh server itself (r42.admin-wazuh) is EXCLUDED by design.
##
## NOTE : r42.student-box-01 (student tier) is NOT added today - the student
## tier import is commented out in main.yml. If the operator uncomments the
## student tier, add a matching `add_host` task here to enroll the student VM.
##
## With INSTALL_MISP=NO -> admin-misp NOT in the active group -> wazuh-agent
## install on it is silently skipped (no UNREACHABLE).
##

- name: build r42_demo_lab_wazuh_clients_active dynamic group from INSTALL flags
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: add r42.admin-misp to r42_demo_lab_wazuh_clients_active when INSTALL_MISP=YES
      ansible.builtin.add_host:
        name: r42.admin-misp
        groups: r42_demo_lab_wazuh_clients_active
      when: INSTALL_MISP | default("NO") | upper == "YES"
      changed_when: false

    - name: add r42.admin-gitea to r42_demo_lab_wazuh_clients_active when INSTALL_GITEA=YES
      ansible.builtin.add_host:
        name: r42.admin-gitea
        groups: r42_demo_lab_wazuh_clients_active
      when: INSTALL_GITEA | default("NO") | upper == "YES"
      changed_when: false

    - name: add r42.admin-mattermost to r42_demo_lab_wazuh_clients_active when INSTALL_MATTERMOST=YES
      ansible.builtin.add_host:
        name: r42.admin-mattermost
        groups: r42_demo_lab_wazuh_clients_active
      when: INSTALL_MATTERMOST | default("NO") | upper == "YES"
      changed_when: false

    - name: add r42.admin-nextcloud to r42_demo_lab_wazuh_clients_active when INSTALL_NEXTCLOUD=YES
      ansible.builtin.add_host:
        name: r42.admin-nextcloud
        groups: r42_demo_lab_wazuh_clients_active
      when: INSTALL_NEXTCLOUD | default("NO") | upper == "YES"
      changed_when: false

    - name: add r42.admin-rocketchat to r42_demo_lab_wazuh_clients_active when INSTALL_ROCKETCHAT=YES
      ansible.builtin.add_host:
        name: r42.admin-rocketchat
        groups: r42_demo_lab_wazuh_clients_active
      when: INSTALL_ROCKETCHAT | default("NO") | upper == "YES"
      changed_when: false

    - name: add r42.admin-deployer-api-gateway to r42_demo_lab_wazuh_clients_active (always created)
      ansible.builtin.add_host:
        name: r42.admin-deployer-api-gateway
        groups: r42_demo_lab_wazuh_clients_active
      changed_when: false

    - name: add r42.admin-deployer-api-backend to r42_demo_lab_wazuh_clients_active (always created)
      ansible.builtin.add_host:
        name: r42.admin-deployer-api-backend
        groups: r42_demo_lab_wazuh_clients_active
      changed_when: false

    - name: add r42.admin-deployer-ui to r42_demo_lab_wazuh_clients_active (always created)
      ansible.builtin.add_host:
        name: r42.admin-deployer-ui
        groups: r42_demo_lab_wazuh_clients_active
      changed_when: false

    - name: add r42.vuln-box-00 to r42_demo_lab_wazuh_clients_active (ctf tier, always created)
      ansible.builtin.add_host:
        name: r42.vuln-box-00
        groups: r42_demo_lab_wazuh_clients_active
      changed_when: false

    - name: add r42.vuln-box-01 to r42_demo_lab_wazuh_clients_active (ctf tier, always created)
      ansible.builtin.add_host:
        name: r42.vuln-box-01
        groups: r42_demo_lab_wazuh_clients_active
      changed_when: false

    - name: add r42.vuln-box-02 to r42_demo_lab_wazuh_clients_active (ctf tier, always created)
      ansible.builtin.add_host:
        name: r42.vuln-box-02
        groups: r42_demo_lab_wazuh_clients_active
      changed_when: false

    - name: add r42.vuln-box-03 to r42_demo_lab_wazuh_clients_active (ctf tier, always created)
      ansible.builtin.add_host:
        name: r42.vuln-box-03
        groups: r42_demo_lab_wazuh_clients_active
      changed_when: false

    - name: add r42.vuln-box-04 to r42_demo_lab_wazuh_clients_active (ctf tier, always created)
      ansible.builtin.add_host:
        name: r42.vuln-box-04
        groups: r42_demo_lab_wazuh_clients_active
      changed_when: false
