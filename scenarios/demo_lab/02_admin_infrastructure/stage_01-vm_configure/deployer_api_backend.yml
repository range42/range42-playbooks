##
## admin-deployer-api-backend - range42-backend-api (Docker, canonical method)
##
## Delegates to the shared bundle which provisions the FastAPI backend via
## the repo's canonical Docker path : multi-stage build (Python 3.13 +
## SQLAlchemy async + Alembic + ansible-runner), docker-compose up -d --build,
## SQLite DB on a bind-mounted workspace dir, vault password file bind-mounted
## from host, alembic upgrade head, /docs/openapi.json probe.
##
## Backend connection : CORS-based (POC). The deployer-ui calls this backend
## directly (Origin header matched against CORS_ORIGIN_REGEX in the bundle's
## .env). See the bundle README for the upgrade path (image-based deploys,
## TLS / reverse proxy, etc.).
##

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/admin/software.install.deployer_api_backend/main.yml"
  when: INSTALL_DEPLOYER_UI | default("NO") | upper == "YES"
  vars:
    global_vm_ssh_name: "r42.admin-deployer-api-backend"
    global_vm_ci_ip:    "192.168.142.102"
