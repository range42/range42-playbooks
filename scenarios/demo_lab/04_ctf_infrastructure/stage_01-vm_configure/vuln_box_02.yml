#### #### #### vuln-box-02 - per-host CTF imports + firewall agregation  #### #### ####
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#

- name: configure firewall - r42.vuln-box-02 (aggregated from imported CTF bundles)
  become: true
  hosts: r42.vuln-box-02
  roles:
    - software.configure.firewalls
  vars:
    # TODO derive from each bundle BUNDLE_PORTS_TCP once the contract is implemented
    firewall_rules:
      - { ip: "all", port: 22,   protocol: "tcp" }
      - { ip: "all", port: 21,   protocol: "tcp" }   # ftp_anon_server
      - { ip: "all", port: 4444, protocol: "tcp" }   # pdfjs CVE-2024-4367
      - { ip: "all", port: 8080, protocol: "tcp" }   # uwsgi-php CVE-2018-7490
      - { ip: "all", port: 8081, protocol: "tcp" }   # tomcat CVE-2025-24813
      - { ip: "all", port: 8888, protocol: "tcp" }   # apache CVE-2021-42013

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/ctf/misconfiguration/network/vsftpd/ftp_anon_server/main.yml"
  vars:
    global_vm_ssh_name: "r42.vuln-box-02"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/ctf/cve/web/apache/CVE-2021-42013/main.yml"
  vars:
    global_vm_ssh_name: "r42.vuln-box-02"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/ctf/cve/web/pdfjs/CVE-2024-4367/main.yml"
  vars:
    global_vm_ssh_name: "r42.vuln-box-02"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/ctf/cve/web/tomcat/CVE-2025-24813/main.yml"
  vars:
    global_vm_ssh_name: "r42.vuln-box-02"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/ctf/cve/web/uwsg_php/CVE-2018-7490/main.yml"
  vars:
    global_vm_ssh_name: "r42.vuln-box-02"
