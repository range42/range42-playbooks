#
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#### #### #### vuln-box-00 - per-host CTF imports + firewall agregation  #### #### ####
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#

- name: configure firewall - r42.vuln-box-00 (aggregated from imported CTF bundles)
  become: true
  hosts: r42.vuln-box-00
  roles:
    - software.configure.firewalls
  vars:
    # TODO derive from each bundle BUNDLE_PORTS_TCP once the contract is implemented
    firewall_rules:
      - { ip: "all", port: 22,   protocol: "tcp" }
      - { ip: "all", port: 21,   protocol: "tcp" }   # ftp_anon_server
      - { ip: "all", port: 8080, protocol: "tcp" }   # uwsgi-php CVE-2018-7490

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/ctf/misconfiguration/network/vsftpd/ftp_anon_server/main.yml"
  vars:
    global_vm_ssh_name: "r42.vuln-box-00"

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/ctf/cve/web/uwsg_php/CVE-2018-7490/main.yml"
  vars:
    global_vm_ssh_name: "r42.vuln-box-00"
