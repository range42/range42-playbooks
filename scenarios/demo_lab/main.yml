##
## demo_lab - main playbook
##
## Structure : multi-level _main + _main_stage_NN per tier - flexible global stage interleaving across tiers without rewriting per-tier plays.
##
## Global stage discipline (mirror of kunai_lab after the structural fix) :
##   1. 01_templates-bootstrap                          create the shared templates
##   2. ALL tiers stage_00 (vm_bootstrap)               create every VM first
##   3. ALL tiers stage_01 (vm_configure)               configure every VM after
##   4. cross-tier finalize (wazuh-agent on r42_admin_wazuh_clients) when INSTALL_WAZUH=YES
##
## This ordering guarantees that any cross-tier configure step (e.g. wazuh
## agent install on the deployer-* clients reaching the wazuh server) sees
## ALL target VMs created AND baselined before firing.
##
