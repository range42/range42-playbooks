#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#### #### #### vuln-box-04 - per-host CTF imports + firewall agregation  #### #### ####
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#
# Note : prior to extraction this host had a single active deploy (php
# CVE-2019-11043) with many other CVEs scaffolded but commented out. Only
# the php import is active here ; uncomment the others to extend.
#

- name: configure firewall - r42.vuln-box-04 (aggregated from imported CTF bundles)
  become: true
  hosts: r42.vuln-box-04
  roles:
    - software.configure.firewalls
  vars:
    # TODO derive from each bundle BUNDLE_PORTS_TCP once the contract is implemented
    firewall_rules:
      - { ip: "all", port: 22,   protocol: "tcp" }
      - { ip: "all", port: 8082, protocol: "tcp" }   # php CVE-2019-11043

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/ctf/cve/web/php/CVE-2019-11043/main.yml"
  vars:
    global_vm_ssh_name: "r42.vuln-box-04"

