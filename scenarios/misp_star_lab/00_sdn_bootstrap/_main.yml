---
##
## misp_star_lab - 00 SDN BOOTSTRAP
##
## RUNS BEFORE EVERYTHING ELSE, and the order is not a preference : net140 is the templating
## network, the template build runs `apt`, so without a live SNAT rule there the templates come
## out empty and out of date.
##
## CREATES, NEVER DELETES. The bundle looks each object up and writes only what is missing, so a
## second run is a no-op. A vnet name is GLOBAL TO THE CLUSTER - deleting one here would take away
## a network other scenarios attach to.
##
## The vnet list is declared ONCE below and passed to both bundles, so they cannot drift apart.
##
## Isolation between these subnets is NOT set up here : they reach each other, the host routes. The
## team isolation of the MISP star comes from the per-NIC rules of _firewall/, and only once armed.
##

- name: "misp_star_lab - 00 declare the networks, once"
  hosts: proxmox
  gather_facts: false
  tasks:
    ## A fact rather than a literal repeated at each import : the two bundles below must read the
    ## SAME list, or one could create a vnet the other does not free.
    - name: SDN BOOTSTRAP - THE NETWORKS THIS SCENARIO RUNS ON
      ansible.builtin.set_fact:
        _sdn_vnets:
          - { vnet: "net140", subnet: "192.168.140.0/24", gateway: "192.168.140.1", snat: true }   # templating, apt
          - { vnet: "net142", subnet: "192.168.142.0/24", gateway: "192.168.142.1", snat: true }   # admin, misp star hub
          ## One vnet per team. SNAT: each spoke builds its MISP image (apt, docker pulls).
          - { vnet: "net149", subnet: "192.168.149.0/24", gateway: "192.168.149.1", snat: true }   # misp star, team-01 spoke
          - { vnet: "net150", subnet: "192.168.150.0/24", gateway: "192.168.150.1", snat: true }   # misp star, team-02 spoke

## The zone is the infrastructure's, not the scenario's : the init declares it in the range42
## inventory (range42_sdn_zone, section NETWORK MODE) and the vault carries it to this workspace,
## which the bundle loads before reading it. The default covers a workspace whose vault predates
## that key - it is the value every infrastructure has used so far.
- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.bootstrap/main.yml"
  vars:
    BUNDLE_SDN_ZONE: "{{ range42_sdn_zone | default('r42zone') }}"
    BUNDLE_SDN_VNETS: "{{ _sdn_vnets }}"

#### AFTER the bootstrap, never before : the apply above runs `ifreload -a`, which would restore the
#### very addresses this frees. Runtime only - the durable counterpart is
#### legacy_bridge.cleaning.shadowed_subnet, which edits /etc/network/interfaces and is NOT called
#### from a scenario : a deployment should not rewrite the hypervisor's network config as a side
#### effect. Run it deliberately, once per host, when the legacy bridges are to go for good.
####
#### On a clean host this is a silent no-op.

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/legacy_bridge.workaround.shadowed_subnet/main.yml"
  vars:
    BUNDLE_SDN_VNETS: "{{ _sdn_vnets }}"
