##
## misp_star_lab - main playbook
##
## Structure : multi-level _main + _main_stage_NN per tier - flexible global stage interleaving across tiers without rewriting per-tier plays.
##
## Provisions the MISP star - one instructor hub + one spoke per team, one vnet per team - from
## the project standard medium template (VMID 9232 : 2cpu / 8gb / 64gb), deploys the misp-star
## stack on each VM and pairs the spokes to the hub, via the shared bundle
## bundles/admin/software.install.misp_star/.
##
## The star IS the workload of this scenario - always deployed (no INSTALL flag for it). The
## optional admin tier (admin-wazuh) is gated by INSTALL_WAZUH (default NO per
## manifest/feature_flags.yml).
##
## Lab topology :
##   - admin-misp-star-hub (192.168.142.195, VMID 1195, net142)  - instructor hub
##   - misp-star-spoke-01  (192.168.149.196, VMID 1196, net149)  - team-01 spoke
##   - misp-star-spoke-02  (192.168.150.197, VMID 1197, net150)  - team-02 spoke
##
## Optional admin tier (192.168.142.0/24 admin band) :
##   - admin-wazuh (192.168.142.198, VMID 1198, net142)          - SIEM server
##
## Global stage discipline (mirror of kunai_lab / demo_lab) :
##   1. 01_templates-bootstrap                                create the shared template (9232)
##   2. ALL tiers stage_00 (vm_bootstrap)                     create every VM first
##   3. ALL tiers stage_01 (vm_configure)                     configure every VM after
##   4. cross-tier finalize (wazuh-agent on the 3 star VMs)   when INSTALL_WAZUH=YES
##
