#
# Optional admin-wazuh VM gated by INSTALL_WAZUH (default NO per manifest/feature_flags.yml).
#
#   - admin-wazuh (1198, 192.168.142.198, net142) : Wazuh SIEM server
#     (gated INSTALL_WAZUH, default NO)
#
# No admin-misp here : the MISP star IS the workload, deployed on 1195-1197
# via tier 03_misp_star_lab_infrastructure/.
#

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/vm.bootstrap/main.yml"
  when: INSTALL_WAZUH | default("NO") | upper == "YES"
  vars:
    global_vm_name:        "admin-wazuh"
    global_vm_ssh_name:    "r42.admin-wazuh"
    global_vm_id:          1198
    global_vm_description: "misp_star_lab - Wazuh SIEM server (optional)"
    global_vm_tag_name:    "misp-star-lab"
    global_vm_ci_ip:       "192.168.142.198"
    global_template_vm_id: 9232
    global_template_name:  "03-template-vm-medium-02-8g-64g - 9232"
    global_vm_net_virtio_bridge:  "net142"
    global_vm_ci_ip_gw:           "192.168.142.1"

