##
## stage_01 — software install for lan2-debian-jump-00
## catalog roles are referenced BY NAME (resolved via ANSIBLE_ROLES_PATH at deploy);
## one play per attachment so each carries its own params (firewall_rules, docker …).
##

- name: "lan2-debian-jump-00 — software.configure.firewalls"
  hosts: r42.lan2-debian-jump-00
  become: true
  vars_files:
    - "../../secrets/default_vault.yml"
  vars:
    firewall_rules:
    - ip: all
      port: 22
      protocol: tcp
  roles:
    - software.configure.firewalls

- name: "lan2-debian-jump-00 — software.install.warmup.basic_packages"
  hosts: r42.lan2-debian-jump-00
  become: true
  vars_files:
    - "../../secrets/default_vault.yml"
  roles:
    - software.install.warmup.basic_packages
