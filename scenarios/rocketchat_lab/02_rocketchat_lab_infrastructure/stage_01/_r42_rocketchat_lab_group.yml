##
## rocketchat_lab stage_01 - software install and Rocket.Chat deployment on admin-rocketchat-standalone
##
## Same Docker baseline as misp_lab + zsh dotfiles + firewall.
## Firewall opens port 22 (SSH) and port 3000 (Rocket.Chat HTTP).
## Targets the r42_rocketchat_lab_group inventory group, currently containing
## a single host: r42.admin-rocketchat-standalone.
##
## Play 4 deploys the rocketchat docker-compose stack. Does NOT use the
## software.configure.docker-compose role because community.docker.docker_compose_v2
## is silent during the build. Uses ansible.builtin.shell so build output streams
## back to the operator in real time.
## Uses the existing RANGE42_INVENTORY env var (points to range42-catalog root).
##

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: install basics packages
  hosts: r42_rocketchat_lab_group
  become: true
  roles:
    - software.install.warmup.basic_packages

  #
  # variables will be overwritten by values in main.yml
  #
  vars:
    INSTALL_PACKAGES_BASICS: "YES"
    INSTALL_PACKAGES_FIREWALLS: "YES"
    #
    INSTALL_PACKAGES_DOCKER: "YES"
    INSTALL_PACKAGES_DOCKER_COMPOSE: "YES"
    #
    INSTALL_PACKAGES_UTILS_JSON: "YES"
    INSTALL_PACKAGES_UTILS_NETWORK: "YES"

    INSTALL_PACKAGES_NTP_AND_UPDATE_TIME: "YES"

    SPECIFIC_PACKAGES_CLEANING: "NO"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: install dot files
  hosts: r42_rocketchat_lab_group
  become: true
  roles:
    - software.install.warmup.dot_files

  vars:
    #
    # variables will be overwritten by values in main.yml
    #
    OPERATOR_USER: alice
    INSTALL_VIM_DOTFILES: "YES"
    INSTALL_ZSH_DOTFILES: "YES"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: configure firewall - all
  become: true
  hosts: r42_rocketchat_lab_group
  roles:
    - software.configure.firewalls

  vars:
    #
    # variables will be overwritten by values in main.yml
    #
    firewall_rules:
      - ip: "all"
        port: 22
        protocol: "tcp"
      - ip: "all"
        port: 3000
        protocol: "tcp"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: deploy rocketchat docker-compose stack
  hosts: r42_rocketchat_lab_group
  become: true

  vars:
    _rocketchat_local_dir: "{{ lookup('env', 'RANGE42_INVENTORY') }}/03_container_layer/docker/admin/rocketchat"
    _rocketchat_remote_dir: "/home/alice/rocketchat"

  tasks:

    - name: rocketchat - ensure remote directory exists
      ansible.builtin.file:
        path: "{{ _rocketchat_remote_dir }}"
        state: directory
        owner: alice
        group: alice
        mode: "0755"

    - name: rocketchat - rsync project from controller
      ansible.posix.synchronize:
        src: "{{ _rocketchat_local_dir }}/"
        dest: "{{ _rocketchat_remote_dir }}/"
        recursive: true
        rsync_opts:
          - "-e ssh --info=progress2"
      delegate_to: localhost
      become: false

    - name: rocketchat - docker compose build (streamed)
      ansible.builtin.shell: docker compose build 2>&1
      args:
        chdir: "{{ _rocketchat_remote_dir }}"
      register: _rocketchat_build
      changed_when: true

    - name: rocketchat - docker compose build output
      ansible.builtin.debug:
        msg: "{{ _rocketchat_build.stdout_lines }}"

    - name: rocketchat - docker compose up -d
      ansible.builtin.shell: docker compose up -d 2>&1
      args:
        chdir: "{{ _rocketchat_remote_dir }}"
      register: _rocketchat_up
      changed_when: true

    - name: rocketchat - docker compose up output
      ansible.builtin.debug:
        msg: "{{ _rocketchat_up.stdout_lines }}"

