##
## Baseline for r42_admin_active runtime group (mattermost_lab) :
##   - system-baseline-default     : packages + dotfiles
##   - network-baseline-ssh        : firewall opens port 22 (the mattermost
##                                   service port 8065 is opened by the
##                                   software.install.mattermost bundle itself)
##   - tailscale-on-group          : optional tailscale install (gated INSTALL_TAILSCALE,
##                                   default NO)
##
## Targets r42_admin_active (built by ../_build_admin_active_group.yml from the
## INSTALL_MATTERMOST value at deploy time). The baseline only runs on the admin
## VM that stage_00 actually created.
##

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/system-baseline-default/main.yml"
  vars:
    target_group: "r42_admin_active"

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/network-baseline-ssh/main.yml"
  vars:
    target_group: "r42_admin_active"

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/tailscale-on-group/main.yml"
  vars:
    target_group: "r42_admin_active"
    INSTALL_TAILSCALE: "NO"
    tailscale_hostnames:
      - "admin-mattermost-standalone"
