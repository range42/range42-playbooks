##
## dev_deployer_ui_lab stage_01 - software install on the 3 dev_deployer_ui_lab VMs
##
## Lifted from misp_lab/02_misp_lab_infrastructure/stage_01/_r42_misp_lab_group.yml.
## Same Docker baseline (DOCKER=YES + DOCKER_COMPOSE=YES) + zsh dotfiles + firewall.
## INSTALL_PACKAGES_UTILS_JSON is YES (jq is needed for the deployer-ui platform
## operator workflow inside each VM).
## Targets the r42_dev_deployer_ui_lab_group inventory group (defined in
## templates/ansible-inventory.j2), containing 3 hosts :
## r42.dev-deployer-ui, r42.dev-backend, r42.dev-kong.
##
## Each play targets the group - one pass fans out over all 3 hosts.
## Application ports (deployer-ui 3000, backend 8000, kong 8000/8001/8443/8444)
## are NOT pre-opened by this scenario - they are opened when the corresponding
## docker-compose stack is deployed on top.
##

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: install basics packages
  hosts: r42_dev_deployer_ui_lab_group
  become: true
  roles:
    - software.install.warmup.basic_packages

  #
  # variables will be overwritten by values in main.yml
  #
  vars:
    INSTALL_PACKAGES_BASICS: "YES"
    INSTALL_PACKAGES_FIREWALLS: "YES"
    #
    INSTALL_PACKAGES_DOCKER: "YES"
    INSTALL_PACKAGES_DOCKER_COMPOSE: "YES"
    #
    INSTALL_PACKAGES_UTILS_JSON: "YES"
    INSTALL_PACKAGES_UTILS_NETWORK: "YES"

    INSTALL_PACKAGES_NTP_AND_UPDATE_TIME: "YES"

    SPECIFIC_PACKAGES_CLEANING: "NO"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: install dot files
  hosts: r42_dev_deployer_ui_lab_group
  become: true
  roles:
    - software.install.warmup.dot_files

  vars:
    #
    # variables will be overwritten by values in main.yml
    #
    OPERATOR_USER: alice
    INSTALL_VIM_DOTFILES: "YES"
    INSTALL_ZSH_DOTFILES: "YES"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: configure firewall - all
  become: true
  hosts: r42_dev_deployer_ui_lab_group
  roles:
    - software.configure.firewalls

  vars:
    #
    # variables will be overwritten by values in main.yml
    #
    firewall_rules:
      - ip: "all"
        port: 22
        protocol: "tcp"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
