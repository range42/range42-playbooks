##
## dev-deployer-ui - range42-deployer-ui frontend (Docker, canonical method)
##
## Delegates to the shared bundle which provisions deployer-ui via the
## repo's canonical Docker path : multi-stage build (Node 24 + vite build
## -> nginx serve), docker-compose up -d --build, /health probe.
##
## Backend connection : CORS-based (POC). The backend (dev-backend) must
## allow the UI's origin ; the backend URL is configured at runtime via
## the in-app Settings modal. See the bundle README for upgrade paths
## (image-based deploys, external reverse proxy, etc.).
##
## Gated by INSTALL_DEPLOYER_UI (default YES per dev_deployer_ui_lab
## feature_flags.yml). With INSTALL_DEPLOYER_UI=NO, the dev-deployer-ui VM
## stays as a bare Docker host (baseline applied, no app stack).
##

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/admin/software.install.deployer_ui/main.yml"
  when: INSTALL_DEPLOYER_UI | default("YES") | upper == "YES"
  vars:
    global_vm_ssh_name: "r42.dev-deployer-ui"
    global_vm_ci_ip:    "192.168.142.190"
    # Pre-register this lab's backend (dev-backend, 192.168.142.191) in the SPA
    # so a fresh deploy is usable without the operator retyping the URL in the
    # Settings modal. Rendered to public/config.json before the Docker build ;
    # the operator can still add / switch / delete backends from the UI.
    BACKEND_API_URL: "http://192.168.142.191:8000"
