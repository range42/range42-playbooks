##
## dev-backend - range42-backend-api FastAPI (Docker, canonical method)
##
## Run from the selected range42-context workspace through the existing wrapper.
## The shared bundle requires an already prepared immutable BACKEND_IMAGE and
## explicit managed state/runtime settings. It does not build or pull source.
## Systemd adoption additionally requires BACKEND_INSTALL_ACTION=adopt-systemd
## and a reviewed private target-host BACKEND_SYSTEMD_ADOPTION_FILE.
##
## Backend connection: exact CORS origins below cover this lab's default UI port
## and the current shared UI. Override BACKEND_CORS_ORIGINS with a reviewed list
## for another listener. This does not change backend authentication policy.
##
## Gated by INSTALL_DEPLOYER_API_BACKEND (default YES per feature_flags.yml).
## With INSTALL_DEPLOYER_API_BACKEND=NO, the dev-backend VM stays as a bare
## Docker host (baseline applied, no app stack).
##

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/admin/software.install.deployer_api_backend/main.yml"
  when: INSTALL_DEPLOYER_API_BACKEND | default("YES") | upper == "YES"
  vars:
    global_vm_ssh_name: "r42.dev-backend"
    global_vm_ci_ip:    "192.168.142.191"
    BACKEND_CORS_ORIGINS:
      - http://r42.dev-deployer-ui:3000
      - http://192.168.142.190:3000
      - http://100.64.0.14:3002
