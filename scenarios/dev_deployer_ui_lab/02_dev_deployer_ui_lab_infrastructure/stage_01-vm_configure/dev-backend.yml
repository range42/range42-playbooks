# The normal context deployment builds the selected API checkout automatically.
- name: Allow the lab UI to reach the backend API
  hosts: r42.dev-backend
  gather_facts: false
  become: true
  tasks:
    - name: Allow the backend API port without resetting existing firewall rules
      community.general.ufw:
        rule: allow
        port: "{{ API_PORT | default(8000) }}"
        proto: tcp
      when: INSTALL_DEPLOYER_API_BACKEND | default("YES") | upper == "YES"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/admin/software.install.deployer_api_backend/main.yml"
  when: INSTALL_DEPLOYER_API_BACKEND | default("YES") | upper == "YES"
  vars:
    global_vm_ssh_name: "r42.dev-backend"
    global_vm_ci_ip: "192.168.142.191"
    BACKEND_LISTEN_ADDRESS: "0.0.0.0"
    BACKEND_CORS_ORIGINS:
      - "http://192.168.142.190:{{ UI_PORT | default(3000) }}"
      - "http://r42.dev-deployer-ui:{{ UI_PORT | default(3000) }}"
