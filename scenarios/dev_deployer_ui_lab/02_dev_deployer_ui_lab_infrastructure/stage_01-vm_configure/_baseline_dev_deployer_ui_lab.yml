##
## Baseline for r42_dev_deployer_ui_lab_group (static, 3 VMs always-on) :
##   - systems.baseline.docker_host : packages + dotfiles + Docker + docker compose
##   - network.baseline.ssh       : firewall opens port 22 (app ports opened
##                                   by their respective bundles in stage_01)
##   - network.configure.tailscale_client         : optional tailscale install (gated by INSTALL_TAILSCALE,
##                                   default NO)
##
## Targets the static r42_dev_deployer_ui_lab_group from templates/ansible-inventory.j2
## (no _build_active_group needed - the 3 dev VMs are unconditional).
##

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/generic/systems.baseline.docker_host/main.yml"
  vars:
    target_group: "r42_dev_deployer_ui_lab_group"

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/generic/network.baseline.ssh/main.yml"
  vars:
    target_group: "r42_dev_deployer_ui_lab_group"

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/generic/network.configure.tailscale_client/main.yml"
  vars:
    target_group: "r42_dev_deployer_ui_lab_group"
    INSTALL_TAILSCALE: "NO"
    tailscale_hostnames:
      - "dev-deployer-ui"
      - "dev-backend"
      - "dev-kong"
