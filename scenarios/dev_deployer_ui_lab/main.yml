##
## dev_deployer_ui_lab - main playbook
##
## Structure : multi-level _main + _main_stage_NN per tier - flexible global stage interleaving across tiers without rewriting per-tier plays.
##
## Provisions 3 dev VMs on net142 from the project standard medium template
## (VMID 9232 : 2cpu / 8gb / 64gb) hosting the deployer-ui platform stack via
## bundles : dev-deployer-ui (frontend), dev-backend (api backend), dev-kong
## (api gateway). Each VM application stack is gated by an INSTALL flag
## (default YES) so the operator can opt out per-component for dev iteration.
##
## Optional admin VMs gated by feature flags :
##   - admin-wazuh (INSTALL_WAZUH, default NO)
##   - admin-misp  (INSTALL_MISP,  default NO)
##
## Topology (single in-VM user alice on every VM, project convention) :
##   - dev-deployer-ui (192.168.142.190, VMID 1190)  always-on, INSTALL_DEPLOYER_UI gates the app
##   - dev-backend     (192.168.142.191, VMID 1191)  always-on, INSTALL_DEPLOYER_API_BACKEND gates the app
##   - dev-kong        (192.168.142.192, VMID 1192)  always-on, INSTALL_KONG gates the app
##   - admin-wazuh     (192.168.142.193, VMID 1193)  gated by INSTALL_WAZUH
##   - admin-misp      (192.168.142.194, VMID 1194)  gated by INSTALL_MISP
##
## Global stage discipline (mirror of kunai_lab / demo_lab) :
##   1. 01_templates-bootstrap                          create the shared template
##   2. ALL tiers stage_00 (vm_bootstrap)               create every VM first
##   3. ALL tiers stage_01 (vm_configure)               configure every VM after
##   4. cross-tier finalize (wazuh-agent on lab clients) when INSTALL_WAZUH=YES
##
## This ordering guarantees that any cross-tier configure step (e.g. wazuh
## agent install on dev tier clients reaching the wazuh server on tier 02)
## sees ALL target VMs created AND baselined before firing.
##
