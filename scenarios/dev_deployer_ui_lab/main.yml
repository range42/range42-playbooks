    global_vm_ssh_name: "r42.dev-kong"
    global_vm_id: 1192
    global_vm_description: "dev_deployer_ui_lab - Ubuntu LTS host for Kong API gateway"
    global_vm_tag_name: "dev-deployer-ui-lab"
    global_vm_ci_ip: "192.168.142.192"
    #
