---
##
## dev_deployer_ui_lab - main playbook
##
## Provisions 3 Ubuntu LTS VMs on vmbr142 from the project standard medium
## template (VMID 9232 : 2cpu / 8gb / 64gb). Each VM is delivered with the
## Docker baseline pre-installed (docker, docker compose, zsh dotfiles, basic
## utilities, firewall opening port 22 only).
##
## The 3 VMs are intended to host, in a later step, the deployer-ui stack :
##   - dev-deployer-ui  (192.168.142.190, VMID 1190)   - frontend
##   - dev-backend      (192.168.142.191, VMID 1191)   - backend API
##   - dev-kong         (192.168.142.192, VMID 1192)   - Kong API gateway
##
## The application stacks themselves are intentionally NOT installed by this
## scenario - the goal here is to deliver 3 ready-to-use Docker hosts. The
## actual deployer-ui / backend / kong docker-compose stacks are deployed in
## a follow-up step (range42-catalog elements or operator manual docker compose).
##
## Mirrors the misp_lab single-VM pattern, extended for 3 VMs :
##   01_init_proxmox                              : download cloud-init image + create template 9232 (idempotent skip if already present)
##   02_dev_deployer_ui_lab_infrastructure/stage_00 : 3 VM clones + cloud-init + start + wait-for-SSH (one file per VM)
##   02_dev_deployer_ui_lab_infrastructure/stage_01 : Docker baseline applied to the group in one pass
##

#### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#### #### #### #### 01_init_proxmox - template creation #### #### #### ####
#### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- import_playbook: ./01_init_proxmox/templates/_main_download_cloudinit_files.yml
- import_playbook: ./01_init_proxmox/templates/ubuntu_noble/_main_ubuntu_noble.yml

#### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#### #### #### 02_dev_deployer_ui_lab_infrastructure - STAGE 00 #### #### ##
