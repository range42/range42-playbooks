- import_playbook: ./02_dev_deployer_ui_lab_infrastructure/stage_00/dev_deployer_ui_vm.yml

  vars:
    global_vm_name: "dev-deployer-ui"
    global_vm_ssh_name: "r42.dev-deployer-ui"
    global_vm_id: 1190
    global_vm_description: "dev_deployer_ui_lab - Ubuntu LTS host for deployer-ui frontend"
    global_vm_tag_name: "dev-deployer-ui-lab"
    global_vm_ci_ip: "192.168.142.190"
    #
    global_template_vm_id: 9232
    global_template_name: "template-vm-medium-02-8g-64g - id : 9232"

# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

