---
##
## dev_deployer_ui_lab - main_vms_only playbook
##
## Skips the 01_init_proxmox template creation stage (template 9232 assumed
## already present from a prior dev_deployer_ui_lab.setup.sh run, or from
## another scenario that builds the same medium template - misp_lab,
## blank_scenario_2_subnets, demo_lab).
## Used by `range42-context deploy-vms`.
##

#### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#### #### #### 02_dev_deployer_ui_lab_infrastructure - STAGE 00 #### #### ##
