---
##
## gitea_registry_lab - stage 00 : clone VM from template 9232
##
## Expected vars (passed via import_playbook vars: in main.yml):
##   global_vm_name, global_vm_ssh_name, global_vm_id, global_vm_description,
##   global_vm_tag_name, global_vm_ci_ip, global_template_vm_id, global_template_name
##

- name: "gitea_registry_lab | stage_00 | clone VM {{ global_vm_name | default('admin-gitea-registry-standalone') }}"
  hosts: proxmox_pve01
  gather_facts: false
  vars:
    vm_name: "{{ global_vm_name | default('admin-gitea-registry-standalone') }}"
    vm_ssh_name: "{{ global_vm_ssh_name | default('r42.admin-gitea-registry-standalone') }}"
    vm_id: "{{ global_vm_id | default(1184) }}"
    vm_description: "{{ global_vm_description | default('gitea_registry_lab - Ubuntu LTS host for Gitea with OCI registry via docker-compose') }}"
    vm_tag_name: "{{ global_vm_tag_name | default('gitea-registry-lab') }}"
    vm_ci_ip: "{{ global_vm_ci_ip | default('192.168.142.184') }}"
    template_vm_id: "{{ global_template_vm_id | default(9232) }}"
    template_name: "{{ global_template_name | default('template-vm-medium-02-8g-64g - id : 9232') }}"
    vm_ci_bridge: "vmbr142"
    vm_ci_gw: "192.168.142.1"
    vm_ci_dns: "192.168.142.1"
    vm_ci_user: "{{ default_admin_vm_ci_user | default('alice') }}"
    vm_ci_password: "{{ default_admin_vm_ci_password }}"
    vm_ci_ssh_key: "{{ default_admin_vm_ci_ssh_key }}"

  pre_tasks:
    - name: "pin deployer_cli_user_ssh_known_hosts"
      ansible.builtin.set_fact:
        deployer_cli_user_ssh_known_hosts: "{{ deployer_cli_user_ssh_known_hosts }}"

  roles:
    - role: proxmox_vm_clone
      vars:
        proxmox_vm_clone__src_vm_id: "{{ template_vm_id }}"
        proxmox_vm_clone__dst_vm_id: "{{ vm_id }}"
        proxmox_vm_clone__dst_vm_name: "{{ vm_name }}"
        proxmox_vm_clone__dst_vm_description: "{{ vm_description }}"
        proxmox_vm_clone__dst_vm_tags: "{{ vm_tag_name }}"

    - role: proxmox_vm_cloudinit_configure
      vars:
        proxmox_vm_cloudinit_configure__vm_id: "{{ vm_id }}"
        proxmox_vm_cloudinit_configure__vm_ci_ip: "{{ vm_ci_ip }}/24"
        proxmox_vm_cloudinit_configure__vm_ci_gw: "{{ vm_ci_gw }}"
        proxmox_vm_cloudinit_configure__vm_ci_dns: "{{ vm_ci_dns }}"
        proxmox_vm_cloudinit_configure__vm_ci_bridge: "{{ vm_ci_bridge }}"
        proxmox_vm_cloudinit_configure__vm_ci_user: "{{ vm_ci_user }}"
        proxmox_vm_cloudinit_configure__vm_ci_password: "{{ vm_ci_password }}"
        proxmox_vm_cloudinit_configure__vm_ci_ssh_key: "{{ vm_ci_ssh_key }}"

    - role: proxmox_vm_start
      vars:
        proxmox_vm_start__vm_id: "{{ vm_id }}"

    - role: proxmox_vm_wait
      vars:
        proxmox_vm_wait__vm_ssh_name: "{{ vm_ssh_name }}"
        proxmox_vm_wait__requested_tasks:
          - "wait/openssh_server/is_reachable.yml"
          - "wait/cloudinit/is_boot_finished.yml"
