---
##
## gitea_registry_lab - full deploy entrypoint
## Usage: ./gitea_registry_lab.setup.sh   (or range42-context deploy)
##

- import_playbook: ./01_init_proxmox/templates/_main_download_cloudinit_files.yml

- import_playbook: ./01_init_proxmox/templates/ubuntu_noble/_main_ubuntu_noble.yml

- import_playbook: ./02_gitea_registry_lab_infrastructure/stage_00/gitea_registry_lab_vm.yml
  vars:
    global_vm_name: "admin-gitea-registry-standalone"
    global_vm_ssh_name: "r42.admin-gitea-registry-standalone"
    global_vm_id: 1184
    global_vm_description: "gitea_registry_lab - Ubuntu LTS host for Gitea with OCI registry via docker-compose"
    global_vm_tag_name: "gitea-registry-lab"
    global_vm_ci_ip: "192.168.142.184"
    global_template_vm_id: 9232
    global_template_name: "template-vm-medium-02-8g-64g - id : 9232"

- import_playbook: ./02_gitea_registry_lab_infrastructure/stage_01/_r42_gitea_registry_lab_group.yml
  vars:
    OPERATOR_USER: alice

    INSTALL_VIM_DOTFILES: "YES"
    INSTALL_ZSH_DOTFILES: "YES"

    INSTALL_PACKAGES_BASICS: "YES"
    INSTALL_PACKAGES_FIREWALLS: "YES"
    #
    INSTALL_PACKAGES_DOCKER: "YES"
    INSTALL_PACKAGES_DOCKER_COMPOSE: "YES"
    #
    INSTALL_PACKAGES_UTILS_JSON: "YES"
    INSTALL_PACKAGES_UTILS_NETWORK: "YES"

    INSTALL_PACKAGES_NTP_AND_UPDATE_TIME: "YES"

    INSTALL_TAILSCALE: "NO"

    firewall_rules:
      - ip: "all"
        port: 22
        protocol: "tcp"
      - ip: "all"
        port: 3000
        protocol: "tcp"
      - ip: "all"
        port: 2222
        protocol: "tcp"
