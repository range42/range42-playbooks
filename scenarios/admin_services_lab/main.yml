---
##
## admin_services_lab - full deploy entrypoint
## Usage: ./admin_services_lab.setup.sh   (or range42-context deploy)
##

- import_playbook: ./01_init_proxmox/templates/_main_download_cloudinit_files.yml

- import_playbook: ./01_init_proxmox/templates/ubuntu_noble/_main_ubuntu_noble.yml

- import_playbook: ./02_admin_services_lab_infrastructure/stage_00/admin_services_lab_vm.yml
  vars:
    global_vm_name: "admin-all-services-lab"
    global_vm_ssh_name: "r42.admin-all-services-lab"
    global_vm_id: 1187
    global_vm_description: "admin_services_lab - Ubuntu LTS host for Gitea/Mattermost/Rocket.Chat/Nextcloud via docker-compose"
    global_vm_tag_name: "admin-services-lab"
    global_vm_ci_ip: "192.168.142.187"
    global_template_vm_id: 9232
    global_template_name: "template-vm-medium-02-8g-64g - id : 9232"

- import_playbook: ./02_admin_services_lab_infrastructure/stage_01/_r42_admin_services_lab_group.yml
  vars:
    OPERATOR_USER: alice

    INSTALL_VIM_DOTFILES: "YES"
    INSTALL_ZSH_DOTFILES: "YES"

    INSTALL_PACKAGES_BASICS: "YES"
    INSTALL_PACKAGES_FIREWALLS: "YES"
    #
    INSTALL_PACKAGES_DOCKER: "YES"
    INSTALL_PACKAGES_DOCKER_COMPOSE: "YES"
    #
    INSTALL_PACKAGES_UTILS_JSON: "YES"
    INSTALL_PACKAGES_UTILS_NETWORK: "YES"

    INSTALL_PACKAGES_NTP_AND_UPDATE_TIME: "YES"

    INSTALL_TAILSCALE: "NO"

    firewall_rules:
      - ip: "all"
        port: 22
        protocol: "tcp"
      - ip: "all"
        port: 2222
        protocol: "tcp"
      - ip: "all"
        port: 3000
        protocol: "tcp"
      - ip: "all"
        port: 3500
        protocol: "tcp"
      - ip: "all"
        port: 8065
        protocol: "tcp"
      - ip: "all"
        port: 8080
        protocol: "tcp"

- import_playbook: ./02_admin_services_lab_infrastructure/stage_02/_r42_admin_services_lab_stacks.yml

- import_playbook: ./03_student_infrastructure/_main.yml
