---
################################################################################
# range42 - scenario-specific variables (admin_services_lab)
#
# Single-VM scenario: Ubuntu LTS host running Gitea, Mattermost, Rocket.Chat,
# and Nextcloud via docker-compose. Gitea acts as the OAuth2/OIDC provider for
# the other three services.
#
# For shared variables -> group_vars/all/vars.yml
# For secrets -> vault.yml (see vault-example.yml)
#
################################################################################


#### SCENARIO IDENTIFICATION ####

INFRASTRUCTURE_SCENARIO: "admin_services_lab"


#### CREDENTIAL GENERATION ####

# auto-generate ssh keys and passwords (YES/NO)
context_auto_generate_ssh_keys: "YES"
context_auto_generate_vm_passwords: "YES"

# no student extras (single-VM admin scenario)
student_additionnal_keys_count: 0


#### CLOUD-INIT USERNAMES ####

# admin vm user (not secret - password and ssh key are in vault)
default_admin_vm_ci_user: "alice"


#### GITEA ####

gitea_server_ip: "192.168.142.187"
gitea_protocol: "https"
gitea_port: 3000
gitea_ssh_port: 2222
gitea_target_user: "team-blue-user-01"
