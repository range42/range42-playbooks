##
## admin_services_lab stage_01 - human user `student` on r42_student_gitea_client_group
##
## Same model as kunai_lab : alice stays the DEPLOY user (ansible connection,
## admin key) ; `student` is the human account, with a per-VM unique key
## (bob_N, selected by the inventory hostvar student_key_index) and sudo NOPASSWD.
## The student key is never granted on alice, and never on an admin VM.
##

- name: admin_services_lab - compute student creds (per-VM key, derived password)
  hosts: r42_student_gitea_client_group
  gather_facts: false
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"
  tasks:
    - name: assert the per-VM student key is available in the vault
      ansible.builtin.assert:
        that:
          - student_key_index is defined
          - vars['ssh_key_student_user_extra_' ~ student_key_index ~ '_pub_key'] is defined
          - (vars['ssh_key_student_user_extra_' ~ student_key_index ~ '_pub_key']) | length > 0
          - default_trainee_vm_ci_password is defined
          - default_trainee_vm_ci_password | length > 0
        fail_msg: "missing vault var (per-VM student key or default_trainee_vm_ci_password) - ensure student_additional_keys_count >= number of student VMs and student_key_index is set in the inventory"

    - name: set per-host student creds
      ansible.builtin.set_fact:
        _student_pubkey: "{{ vars['ssh_key_student_user_extra_' ~ student_key_index ~ '_pub_key'] }}"
        _student_password: "{{ STUDENT_PASSWORD | default((vars['ssh_key_student_user_extra_' ~ student_key_index ~ '_pub_key'] ~ default_trainee_vm_ci_password) | hash('sha256'), true) }}"
      no_log: true

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/generic/systems.configure.add_user/main.yml"
  vars:
    TARGET_GROUP: "r42_student_gitea_client_group"
    TARGET_USER: "student"
    TARGET_PASSWORD: "{{ _student_password }}"
    TARGET_SHELL_PATH: "/usr/bin/zsh"
    TARGET_UPDATE_PASSWORD: "always"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/generic/systems.configure.authorized_keys/main.yml"
  vars:
    TARGET_GROUP: "r42_student_gitea_client_group"
    TARGET_USER: "student"
    AUTHORIZED_KEY: "{{ _student_pubkey }}"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/generic/systems.configure.sudo/main.yml"
  vars:
    TARGET_GROUP: "r42_student_gitea_client_group"
    TARGET_USER: "student"
    SUDO_NOPASSWD: true

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/generic/systems.configure.dotfiles/main.yml"
  vars:
    TARGET_GROUP: "r42_student_gitea_client_group"
    TARGET_USER: "student"
    WARMUP_INSTALL_VIM_DOTFILES: "YES"
