##
## admin_services_lab stage_02 - register OAuth2 apps in Gitea and deploy service stacks
##
## Three plays in ONE file so that set_fact values set in Play 1 (OAuth2 credentials)
## persist into Play 2 and Play 3. Splitting across import_playbook would lose facts.
##
## Play 1 (become: false):
##   - Register Mattermost, Rocket.Chat, Nextcloud OAuth2 apps in Gitea
##   - Capture per-service client_id/secret as host facts immediately after each call
##
## Play 2 (become: true):
##   - Deploy Mattermost, Rocket.Chat, Nextcloud docker-compose stacks
##   - Re-write Mattermost and Rocket.Chat .env files AFTER rsync (rsync overwrites
##     any pre-written .env with the catalog default, which lacks OAuth2 settings)
##   - Force-recreate the service containers to pick up the new .env values
##
## Play 3 (become: false):
##   - Wait for Nextcloud to be reachable on port 8443 (nginx HTTPS)
##   - Configure Nextcloud OIDC provider via occ (tasks use become: true per-task)
##

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: register OAuth2 apps in Gitea and write service env files
  hosts: r42_admin_services_lab_group
  become: false
  vars_files:
    - "../../secrets/default_vault.yml"

  vars:
    gitea_oauth2_base_url:   "{{ gitea_protocol | default('https') }}://localhost:{{ gitea_port | default(3000) }}"
    gitea_oauth2_admin_user: "{{ GITEA_ADMIN_USER | default('admin') }}"
    gitea_oauth2_admin_pass: "{{ GITEA_ADMIN_PASS | default('Admin1234!') }}"

  tasks:
    - name: wait for Gitea HTTP API to be reachable
      ansible.builtin.wait_for:
        host: localhost
        port: 3000
        delay: 15
        timeout: 300

    #### #### Mattermost #### ####

    - name: register Mattermost OAuth2 app in Gitea
      ansible.builtin.include_role:
        name: service.configure.gitea_oauth2_app
      vars:
        gitea_oauth2_app_name:     "Mattermost"
        gitea_oauth2_redirect_uri: "http://{{ ansible_default_ipv4.address }}:8065/signup/gitlab/complete"

    - name: capture Mattermost OAuth2 credentials
      ansible.builtin.set_fact:
        mm_oauth2_client_id:     "{{ gitea_oauth2_client_id }}"
        mm_oauth2_client_secret: "{{ gitea_oauth2_client_secret }}"
      no_log: true

    #### #### Rocket.Chat #### ####

    - name: register Rocket.Chat OAuth2 app in Gitea
      ansible.builtin.include_role:
        name: service.configure.gitea_oauth2_app
      vars:
        gitea_oauth2_app_name:     "Rocket.Chat"
        gitea_oauth2_redirect_uri: "http://{{ ansible_default_ipv4.address }}:3500/_oauth/Gitea"

    - name: capture Rocket.Chat OAuth2 credentials
      ansible.builtin.set_fact:
        rc_oauth2_client_id:     "{{ gitea_oauth2_client_id }}"
        rc_oauth2_client_secret: "{{ gitea_oauth2_client_secret }}"
      no_log: true

    #### #### Nextcloud #### ####

    - name: register Nextcloud OAuth2 app in Gitea
      ansible.builtin.include_role:
        name: service.configure.gitea_oauth2_app
      vars:
        gitea_oauth2_app_name:     "Nextcloud"
        gitea_oauth2_redirect_uri: "https://{{ ansible_default_ipv4.address }}:8443/apps/user_oidc/code"

    - name: capture Nextcloud OAuth2 credentials
      ansible.builtin.set_fact:
        nc_oauth2_client_id:     "{{ gitea_oauth2_client_id }}"
        nc_oauth2_client_secret: "{{ gitea_oauth2_client_secret }}"
      no_log: true

    - name: assert all OAuth2 secrets are non-empty
      ansible.builtin.assert:
        that:
          - mm_oauth2_client_secret | length > 0
          - rc_oauth2_client_secret | length > 0
          - nc_oauth2_client_secret | length > 0
        fail_msg: >-
          One or more OAuth2 client_secrets are empty — the app already existed in Gitea
          and the secret is not recoverable via the API. Delete the apps in Gitea
          (Admin > Applications) and re-run stage_02, or run reset.setup.sh to rebuild.


#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: deploy Mattermost, Rocket.Chat, Nextcloud docker-compose stacks
  hosts: r42_admin_services_lab_group
  become: true
  vars_files:
    - "../../secrets/default_vault.yml"

  tasks:
    - name: check if Mattermost compose.yml exists (for volume cleanup)
      ansible.builtin.stat:
        path: /home/alice/mattermost/compose.yml
      register: mm_compose_stat

    - name: tear down Mattermost stack and wipe Postgres volume (clean deploy)
      ansible.builtin.command:
        cmd: docker compose down --volumes --remove-orphans
        chdir: /home/alice/mattermost
      changed_when: true
      when: mm_compose_stat.stat.exists

    - name: deploy Mattermost stack
      ansible.builtin.include_role:
        name: software.configure.docker-compose
      vars:
        LABEL_PROJECT_TYPE:  "admin"
        LABEL_PROJET_NAME:   "mattermost"
        LOCAL__PROJECT_DIR:  "{{ lookup('env', 'RANGE42_INVENTORY') }}/03_container_layer/docker/admin/mattermost"
        REMOTE_PROJECT_DIR:  "/home/alice/mattermost"
        OPERATOR_USER:       alice
        CLEAN_UP_DEPLOY_DIR: "NO"
        SEND_POC_DIR:        "NO"
        FORCE_RECREATE:      "YES"

    - name: write Mattermost .env with OAuth2 settings (overwrites catalog default rsynced above)
      ansible.builtin.include_role:
        name: service.configure.mattermost_gitea_oauth2
      vars:
        mattermost_gitea_base_url:      "https://{{ ansible_default_ipv4.address }}:3000"
        mattermost_gitea_client_id:     "{{ mm_oauth2_client_id }}"
        mattermost_gitea_client_secret: "{{ mm_oauth2_client_secret }}"

    - name: reload Mattermost container to apply OAuth2 .env settings
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate mattermost
        chdir: /home/alice/mattermost
      changed_when: true

    - name: wait for Mattermost provisioner to finish
      ansible.builtin.command:
        cmd: docker wait mattermost-provisioner
      become: true
      changed_when: false
      register: _prov_exit
      failed_when: _prov_exit.rc != 0 or _prov_exit.stdout | trim != '0'

    - name: link Mattermost admin account to Gitea GitLab-SSO
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - mattermost-db
          - psql
          - -U
          - "{{ mattermost_postgres_user }}"
          - -d
          - "{{ mattermost_postgres_db }}"
          - -c
          - "UPDATE users SET authservice='gitlab', authdata='1' WHERE email='{{ mattermost_admin_email }}';"
      become: true
      changed_when: true

    - name: ensure shared certs directory exists on host
      ansible.builtin.file:
        path: /home/alice/certs
        state: directory
        mode: '0755'

    - name: extract Gitea TLS certificate from container (bind-mounted into RC via compose)
      ansible.builtin.command:
        cmd: docker exec gitea cat /certs/server.crt
      register: _gitea_cert_pem
      changed_when: false

    - name: write Gitea cert to host (bind-mounted into RC container as /certs/gitea.crt)
      ansible.builtin.copy:
        content: "{{ _gitea_cert_pem.stdout }}"
        dest: /home/alice/certs/gitea.crt
        mode: '0644'

    - name: check if Rocket.Chat compose.yml exists (for volume cleanup)
      ansible.builtin.stat:
        path: /home/alice/rocketchat/compose.yml
      register: rc_compose_stat

    - name: tear down Rocket.Chat stack and wipe MongoDB volume (clean deploy)
      ansible.builtin.command:
        cmd: docker compose down --volumes --remove-orphans
        chdir: /home/alice/rocketchat
      changed_when: true
      when: rc_compose_stat.stat.exists

    - name: deploy Rocket.Chat stack
      ansible.builtin.include_role:
        name: software.configure.docker-compose
      vars:
        LABEL_PROJECT_TYPE:  "admin"
        LABEL_PROJET_NAME:   "rocketchat"
        LOCAL__PROJECT_DIR:  "{{ lookup('env', 'RANGE42_INVENTORY') }}/03_container_layer/docker/admin/rocketchat"
        REMOTE_PROJECT_DIR:  "/home/alice/rocketchat"
        OPERATOR_USER:       alice
        CLEAN_UP_DEPLOY_DIR: "NO"
        SEND_POC_DIR:        "NO"
        FORCE_RECREATE:      "YES"

    - name: write Rocket.Chat .env with OAuth2 settings (overwrites catalog default rsynced above)
      ansible.builtin.include_role:
        name: service.configure.rocketchat_gitea_oauth2
      vars:
        rocketchat_gitea_base_url:      "https://{{ ansible_default_ipv4.address }}:3000"
        rocketchat_gitea_client_id:     "{{ rc_oauth2_client_id }}"
        rocketchat_gitea_client_secret: "{{ rc_oauth2_client_secret }}"
        rocketchat_http_port:           "3500"

    - name: reload Rocket.Chat container to apply OAuth2 .env settings
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate rocketchat
        chdir: /home/alice/rocketchat
      changed_when: true

    - name: wait for Rocket.Chat API to be reachable
      ansible.builtin.uri:
        url: "http://localhost:3500/health"
        status_code: 200
        return_content: false
      register: _rc_api_check
      retries: 30
      delay: 10
      until: _rc_api_check.status == 200

    - name: authenticate to Rocket.Chat REST API
      ansible.builtin.uri:
        url: "http://localhost:3500/api/v1/login"
        method: POST
        body_format: json
        body:
          username: "{{ rocketchat_admin_user | default('admin') }}"
          password: "{{ rocketchat_admin_pass | default('Admin1234!') }}"
      register: _rc_login
      no_log: true

    - name: create Gitea custom OAuth provider in Rocket.Chat
      ansible.builtin.uri:
        url: "http://localhost:3500/api/v1/settings.addCustomOAuth"
        method: POST
        body_format: json
        body:
          name: "Gitea"
        headers:
          X-Auth-Token: "{{ _rc_login.json.data.authToken }}"
          X-User-Id:    "{{ _rc_login.json.data.userId }}"
        status_code: [200, 400]

    - name: enable Rocket.Chat Gitea OAuth boolean settings
      ansible.builtin.uri:
        url: "http://localhost:3500/api/v1/settings/{{ item }}"
        method: POST
        body_format: json
        body:
          value: true
        headers:
          X-Auth-Token: "{{ _rc_login.json.data.authToken }}"
          X-User-Id:    "{{ _rc_login.json.data.userId }}"
      loop:
        - "Accounts_OAuth_Custom-Gitea"
        - "Accounts_OAuth_Custom-Gitea-merge_users"
        - "Accounts_OAuth_Custom-Gitea-show_button"

    - name: configure Rocket.Chat Gitea OAuth string settings
      ansible.builtin.uri:
        url: "http://localhost:3500/api/v1/settings/{{ item.id }}"
        method: POST
        body_format: json
        body:
          value: "{{ item.value }}"
        headers:
          X-Auth-Token: "{{ _rc_login.json.data.authToken }}"
          X-User-Id:    "{{ _rc_login.json.data.userId }}"
      loop:
        - { id: "Accounts_OAuth_Custom-Gitea-url",            value: "https://{{ ansible_default_ipv4.address }}:3000" }
        - { id: "Accounts_OAuth_Custom-Gitea-id",             value: "{{ rc_oauth2_client_id }}" }
        - { id: "Accounts_OAuth_Custom-Gitea-secret",         value: "{{ rc_oauth2_client_secret }}" }
        - { id: "Accounts_OAuth_Custom-Gitea-token_path",     value: "/login/oauth/access_token" }
        - { id: "Accounts_OAuth_Custom-Gitea-token_sent_via", value: "header" }
        - { id: "Accounts_OAuth_Custom-Gitea-identity_path",  value: "/api/v1/user" }
        - { id: "Accounts_OAuth_Custom-Gitea-authorize_path", value: "/login/oauth/authorize" }
        - { id: "Accounts_OAuth_Custom-Gitea-scope",          value: "openid" }
        - { id: "Accounts_OAuth_Custom-Gitea-login_style",    value: "redirect" }
        - { id: "Accounts_OAuth_Custom-Gitea-username_field", value: "login" }
        - { id: "Accounts_OAuth_Custom-Gitea-name_field",     value: "full_name" }
        - { id: "Accounts_OAuth_Custom-Gitea-email_field",    value: "email" }
      no_log: true

    - name: check if Nextcloud compose.yml exists (for volume cleanup)
      ansible.builtin.stat:
        path: /home/alice/nextcloud/compose.yml
      register: nc_compose_stat

    - name: tear down Nextcloud stack and wipe volumes (clean deploy)
      ansible.builtin.command:
        cmd: docker compose down --volumes --remove-orphans
        chdir: /home/alice/nextcloud
      changed_when: true
      when: nc_compose_stat.stat.exists

    - name: deploy Nextcloud stack
      ansible.builtin.include_role:
        name: software.configure.docker-compose
      vars:
        LABEL_PROJECT_TYPE:  "admin"
        LABEL_PROJET_NAME:   "nextcloud"
        LOCAL__PROJECT_DIR:  "{{ lookup('env', 'RANGE42_INVENTORY') }}/03_container_layer/docker/admin/nextcloud"
        REMOTE_PROJECT_DIR:  "/home/alice/nextcloud"
        OPERATOR_USER:       alice
        CLEAN_UP_DEPLOY_DIR: "NO"
        SEND_POC_DIR:        "NO"
        FORCE_RECREATE:      "YES"

    - name: configure Nextcloud .env — HTTPS port
      ansible.builtin.lineinfile:
        path: /home/alice/nextcloud/.env
        regexp: '^HTTP_PORT='
        line: "HTTP_PORT=8443"

    - name: configure Nextcloud .env — TLS mode
      ansible.builtin.lineinfile:
        path: /home/alice/nextcloud/.env
        regexp: '^NC_TLS_MODE='
        line: "NC_TLS_MODE=self-signed"

    - name: configure Nextcloud .env — host IP for TLS certificate SAN
      ansible.builtin.lineinfile:
        path: /home/alice/nextcloud/.env
        regexp: '^NC_HOST_IP='
        line: "NC_HOST_IP={{ ansible_default_ipv4.address }}"

    - name: configure Nextcloud .env — public base URL (drives OVERWRITECLIURL for OIDC redirect URIs)
      ansible.builtin.lineinfile:
        path: /home/alice/nextcloud/.env
        regexp: '^NC_BASE_URL='
        line: "NC_BASE_URL=https://{{ ansible_default_ipv4.address }}:8443"

    - name: regenerate TLS certificate for VM IP (re-run cert-gen with updated .env)
      ansible.builtin.command:
        cmd: docker compose up --force-recreate --no-deps cert-gen
        chdir: /home/alice/nextcloud
      changed_when: true

    - name: reload nginx with regenerated TLS certificate
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate --no-deps nginx
        chdir: /home/alice/nextcloud
      changed_when: true

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: configure Nextcloud OIDC provider (Gitea)
  hosts: r42_admin_services_lab_group
  become: false
  vars_files:
    - "../../secrets/default_vault.yml"

  tasks:
    - name: wait for Nextcloud HTTPS port to be reachable
      ansible.builtin.wait_for:
        host: localhost
        port: 8443
        delay: 30
        timeout: 600

    - name: restart Nextcloud container to apply updated .env (picks up NC_BASE_URL → OVERWRITECLIURL)
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate --no-deps nextcloud
        chdir: /home/alice/nextcloud
      become: true
      changed_when: true

    - name: wait for Nextcloud to respond after restart
      ansible.builtin.uri:
        url: "https://localhost:8443/status.php"
        validate_certs: false
        status_code: [200, 302, 503]
        return_content: false
      register: _nc_health
      retries: 30
      delay: 10
      failed_when: false
      until: _nc_health.status is defined and _nc_health.status == 200

    - name: configure Nextcloud OIDC with Gitea as identity provider
      ansible.builtin.include_role:
        name: service.configure.nextcloud_gitea_oauth2
      vars:
        nextcloud_gitea_base_url:      "https://{{ ansible_default_ipv4.address }}:3000"
        nextcloud_gitea_client_id:     "{{ nc_oauth2_client_id }}"
        nextcloud_gitea_client_secret: "{{ nc_oauth2_client_secret }}"
        nextcloud_public_ip:           "{{ ansible_default_ipv4.address }}"

