##
## admin_services_lab stage_01 - software install and Gitea deployment on admin-all-services-lab
##
## Docker baseline + zsh dotfiles + firewall.
## Firewall opens port 22 (SSH), port 2222 (Gitea SSH), port 3000 (Gitea HTTP),
## port 3500 (Rocket.Chat), port 8065 (Mattermost), port 8080 (Nextcloud).
## Targets the r42_admin_services_lab_group inventory group (defined in
## templates/ansible-inventory.j2), currently containing a single host:
## r42.admin-all-services-lab.
##
## Play 4 deploys the Gitea docker-compose stack via the
## software.configure.docker-compose role (installs rsync, syncs files, runs
## docker_compose_v2).
## Mattermost, Rocket.Chat, and Nextcloud stacks are deployed in stage_02 after
## OAuth2 apps have been registered in Gitea.
## Uses the existing RANGE42_INVENTORY env var (points to range42-catalog root).
##

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: install basics packages
  hosts: r42_admin_services_lab_group
  become: true
  roles:
    - software.install.warmup.basic_packages

  #
  # variables will be overwritten by values in main.yml
  #
  vars:
    INSTALL_PACKAGES_BASICS: "YES"
    INSTALL_PACKAGES_FIREWALLS: "YES"
    #
    INSTALL_PACKAGES_DOCKER: "YES"
    INSTALL_PACKAGES_DOCKER_COMPOSE: "YES"
    #
    INSTALL_PACKAGES_UTILS_JSON: "YES"
    INSTALL_PACKAGES_UTILS_NETWORK: "YES"

    INSTALL_PACKAGES_NTP_AND_UPDATE_TIME: "YES"

    SPECIFIC_PACKAGES_CLEANING: "NO"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: install dot files
  hosts: r42_admin_services_lab_group
  become: true
  roles:
    - software.install.warmup.dot_files

  vars:
    #
    # variables will be overwritten by values in main.yml
    #
    OPERATOR_USER: alice
    INSTALL_VIM_DOTFILES: "YES"
    INSTALL_ZSH_DOTFILES: "YES"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: configure firewall - all
  become: true
  hosts: r42_admin_services_lab_group
  roles:
    - software.configure.firewalls

  vars:
    #
    # variables will be overwritten by values in main.yml
    #
    firewall_rules:
      - ip: "all"
        port: 22
        protocol: "tcp"
      - ip: "all"
        port: 2222
        protocol: "tcp"
      - ip: "all"
        port: 3000
        protocol: "tcp"
      - ip: "all"
        port: 3001
        protocol: "tcp"
      - ip: "all"
        port: 3223
        protocol: "tcp"
      - ip: "all"
        port: 3500
        protocol: "tcp"
      - ip: "all"
        port: 8065
        protocol: "tcp"
      - ip: "all"
        port: 8443
        protocol: "tcp"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: deploy gitea docker-compose stack
  hosts: r42_admin_services_lab_group
  become: true
  roles:
    - software.configure.docker-compose

  vars:
    LABEL_PROJECT_TYPE: "admin"
    LABEL_PROJET_NAME: "gitea"
    #
    LOCAL__PROJECT_DIR: "{{ lookup('env', 'RANGE42_INVENTORY') }}/03_container_layer/docker/admin/gitea"
    REMOTE_PROJECT_DIR: "/home/alice/gitea"
    #
    OPERATOR_USER: alice
    #
    CLEAN_UP_DEPLOY_DIR: "NO"
    SEND_POC_DIR: "NO"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: patch Gitea .env with VM IP and regenerate TLS certificate
  hosts: r42_admin_services_lab_group
  become: true
  ##
  ## The catalog .env ships GITEA_DOMAIN=localhost / GITEA_BASE_URL=https://localhost:3000.
  ## After rsync+first-start those defaults are active, meaning:
  ##   - ROOT_URL in app.ini is "https://localhost:3000" (wrong OIDC issuer/endpoints)
  ##   - The TLS cert has no IP SAN, so external HTTPS connections to the VM IP
  ##     fail hostname verification in Go (Mattermost), Node.js (Rocket.Chat),
  ##     and PHP/Guzzle (Nextcloud user_oidc).
  ## This play fixes both by updating .env and force-recreating cert-gen + gitea.
  ##

  tasks:
    - name: configure Gitea .env — domain (VM IP for HTTPS cert SAN)
      ansible.builtin.lineinfile:
        path: /home/alice/gitea/.env
        regexp: '^GITEA_DOMAIN='
        line: "GITEA_DOMAIN={{ ansible_default_ipv4.address }}"

    - name: configure Gitea .env — base URL (VM IP for OIDC discovery endpoints)
      ansible.builtin.lineinfile:
        path: /home/alice/gitea/.env
        regexp: '^GITEA_BASE_URL='
        line: "GITEA_BASE_URL=https://{{ ansible_default_ipv4.address }}:3000"

    - name: regenerate Gitea TLS certificate with VM IP SAN (re-run cert-gen)
      ansible.builtin.command:
        cmd: docker compose up --force-recreate --no-deps cert-gen
        chdir: /home/alice/gitea
      changed_when: true

    - name: reload Gitea to apply updated ROOT_URL and new TLS certificate
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate --no-deps gitea
        chdir: /home/alice/gitea
      changed_when: true

    - name: wait for Gitea to be reachable after restart
      ansible.builtin.wait_for:
        host: localhost
        port: 3000
        delay: 10
        timeout: 120

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: deploy gitea-registry docker-compose stack
  hosts: r42_admin_services_lab_group
  become: true
  roles:
    - software.configure.docker-compose

  vars:
    LABEL_PROJECT_TYPE: "admin"
    LABEL_PROJET_NAME: "gitea-registry"
    #
    LOCAL__PROJECT_DIR: "{{ lookup('env', 'RANGE42_INVENTORY') }}/03_container_layer/docker/admin/gitea-registry"
    REMOTE_PROJECT_DIR: "/home/alice/gitea-registry"
    #
    OPERATOR_USER: alice
    #
    CLEAN_UP_DEPLOY_DIR: "NO"
    SEND_POC_DIR: "NO"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: patch gitea-registry .env with VM IP, TLS and ports
  hosts: r42_admin_services_lab_group
  become: true
  ##
  ## The catalog .env ships GITEA_DOMAIN=localhost / GITEA_BASE_URL=https://localhost:3001
  ## with GITEA_TLS_MODE=self-signed already set. After rsync+first-start those defaults
  ## are active but the TLS cert has no IP SAN, so external HTTPS connections fail.
  ## This play updates domain+URL to the VM IP and force-recreates cert-gen + gitea.
  ##

  tasks:
    - name: configure gitea-registry .env — domain (VM IP for HTTPS cert SAN)
      ansible.builtin.lineinfile:
        path: /home/alice/gitea-registry/.env
        regexp: '^GITEA_DOMAIN='
        line: "GITEA_DOMAIN={{ ansible_default_ipv4.address }}"

    - name: configure gitea-registry .env — base URL (HTTPS with VM IP)
      ansible.builtin.lineinfile:
        path: /home/alice/gitea-registry/.env
        regexp: '^GITEA_BASE_URL='
        line: "GITEA_BASE_URL=https://{{ ansible_default_ipv4.address }}:3001"

    - name: configure gitea-registry .env — TLS mode
      ansible.builtin.lineinfile:
        path: /home/alice/gitea-registry/.env
        regexp: '^GITEA_TLS_MODE='
        line: "GITEA_TLS_MODE=self-signed"

    - name: configure gitea-registry .env — protocol
      ansible.builtin.lineinfile:
        path: /home/alice/gitea-registry/.env
        regexp: '^GITEA_PROTOCOL='
        line: "GITEA_PROTOCOL=https"

    - name: configure gitea-registry .env — HTTP port
      ansible.builtin.lineinfile:
        path: /home/alice/gitea-registry/.env
        regexp: '^HTTP_PORT='
        line: "HTTP_PORT=3001"

    - name: configure gitea-registry .env — SSH port
      ansible.builtin.lineinfile:
        path: /home/alice/gitea-registry/.env
        regexp: '^SSH_PORT='
        line: "SSH_PORT=3223"

    - name: regenerate gitea-registry TLS certificate with VM IP SAN (re-run cert-gen)
      ansible.builtin.command:
        cmd: docker compose up --force-recreate --no-deps cert-gen
        chdir: /home/alice/gitea-registry
      changed_when: true

    - name: reload gitea-registry to apply updated ROOT_URL and new TLS certificate
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate --no-deps gitea
        chdir: /home/alice/gitea-registry
      changed_when: true

    - name: wait for gitea-registry to be reachable after restart
      ansible.builtin.wait_for:
        host: localhost
        port: 3001
        delay: 10
        timeout: 120

