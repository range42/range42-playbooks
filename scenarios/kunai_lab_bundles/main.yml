##
## kunai_lab - main playbook
##
## Provisions 6 Ubuntu LTS VMs on vmbr142 from the project standard medium
## template (VMID 9232 : 2cpu / 8gb / 64gb). Each VM is delivered with the
## Docker baseline pre-installed + kunai-project ecosystem repositories
## pre-cloned in the operator home.
##
## Topology (single in-VM user alice on every VM, project convention) :
##   - admin-trainer-kunai (192.168.142.104, VMID 1104)  - trainer
##   - student-kunai-01    (192.168.142.105, VMID 1105)  - student
##   - student-kunai-02    (192.168.142.106, VMID 1106)  - student
##   - student-kunai-03    (192.168.142.107, VMID 1107)  - student
##   - student-kunai-04    (192.168.142.108, VMID 1108)  - student
##   - student-kunai-05    (192.168.142.109, VMID 1109)  - student
##
## Infras (mirrors demo_lab_bundles arborescence) :
##   01_templates-bootstrap                : download cloud-init image + create template 9232
##   02_admin_infrastructure (scaffold)    : reserved for future Wazuh / MISP VMs (gated, off by default)
##   03_trainer_infrastructure             : trainer VM (1 host, admin role)
##   04_student_infrastructure             : student VMs (5 hosts)
##

- import_playbook: ./01_templates-bootstrap/_main.yml

####

# Optional admin VMs (Wazuh now ; MISP planned). Gated per-VM via
# manifest/feature_flags.yml ; all entries skip silently when their
# INSTALL_<NAME> flag is NO.
- import_playbook: ./02_admin_infrastructure/_main.yml

- import_playbook: ./03_trainer_infrastructure/_main.yml

- import_playbook: ./04_student_infrastructure/_main.yml
