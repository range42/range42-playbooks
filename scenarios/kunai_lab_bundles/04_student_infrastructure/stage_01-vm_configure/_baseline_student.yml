##
## Baseline for r42_kunai_lab_students_group :
##   - system-baseline-docker-host : packages + dotfiles + Docker + docker-compose
##                                   (kunai needs UTILS_JSON + UTILS_NETWORK on top of the
##                                   docker-host profile defaults, hence the 2 overrides)
##   - network-baseline-ssh        : firewall opens port 22
##   - tailscale-on-group          : optional tailscale install (gated by INSTALL_TAILSCALE,
##                                   default NO for kunai_lab per manifest/feature_flags.yml)
##
## Student-specific (no bundle - kept inline) :
##   - clone kunai-project repositories into /home/alice/kunai-project/
##

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/system-baseline-docker-host/main.yml"
  vars:
    target_group: "r42_kunai_lab_students_group"
    BASELINE_INSTALL_UTILS_JSON: "YES"
    BASELINE_INSTALL_UTILS_NETWORK: "YES"

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/network-baseline-ssh/main.yml"
  vars:
    target_group: "r42_kunai_lab_students_group"

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/tailscale-on-group/main.yml"
  vars:
    target_group: "r42_kunai_lab_students_group"
    INSTALL_TAILSCALE: "NO"
    tailscale_hostnames:
      - "student-kunai-01"
      - "student-kunai-02"
      - "student-kunai-03"
      - "student-kunai-04"
      - "student-kunai-05"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: clone kunai-project repos - students (alice)
  hosts: r42_kunai_lab_students_group
  become: true
  gather_facts: false

  vars:
    OPERATOR_USER: alice
    kunai_repos_dir: "/home/{{ OPERATOR_USER }}/kunai-project"
    kunai_repos:
      - { name: "workshops",          repo: "https://github.com/kunai-project/workshops.git" }
      - { name: "kunai-doc",          repo: "https://github.com/kunai-project/kunai-doc.git" }
      - { name: "kunai-build-docker", repo: "https://github.com/kunai-project/kunai-build-docker.git" }
      - { name: "community-rules",    repo: "https://github.com/kunai-project/community-rules.git" }
      - { name: "pykunai",            repo: "https://github.com/kunai-project/pykunai.git" }

  tasks:
    - name: ensure kunai-project parent directory exists ({{ kunai_repos_dir }})
      ansible.builtin.file:
        path: "{{ kunai_repos_dir }}"
        state: directory
        owner: "{{ OPERATOR_USER }}"
        group: "{{ OPERATOR_USER }}"
        mode: "0755"

    - name: clone kunai-project repositories ({{ OPERATOR_USER }})
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "{{ kunai_repos_dir }}/{{ item.name }}"
        depth: 1
        update: true
        accept_hostkey: true
      become_user: "{{ OPERATOR_USER }}"
      loop: "{{ kunai_repos }}"
      loop_control:
        label: "{{ item.name }}"
