##
## admin-misp - MISP threat intel stack on r42.admin-misp
##
## Delegates to the shared bundle which provides the full pipeline (Docker
## install + docker-compose deploy of misp-standalone : MariaDB + Redis +
## misp-modules + misp + provisioner). The bundle auto-cps .env.example
## -> .env on the local catalog if .env is absent. Populate the catalog .env
## BEFORE the deploy to use strong secrets (see the bundle's README.md).
##
## Gated by INSTALL_MISP (default NO per kunai_lab_bundles feature_flags.yml).
##

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/admin/software.install.misp-standalone/main.yml"
  when: INSTALL_MISP | default("NO") | upper == "YES"
  vars:
    global_vm_ssh_name: "r42.admin-misp"
    global_vm_ci_ip:    "192.168.142.111"
