##
## _finalize-baseline-admin_wazuh_client - group-level post-setup action
##
## Installs the wazuh agent on the kunai_lab wazuh clients group (trainer +
## 5 students). Must run AFTER the wazuh server (admin-wazuh.yml) has been
## deployed so the agents can enroll with the manager.
##
## Group-level scope : targets r42_kunai_lab_wazuh_clients (6 hosts ; trainer
## + 5 students - excludes the wazuh server itself).
##
## Gated by INSTALL_WAZUH (default NO).
##

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/admin/software.install.wazuh-agent/main.yml"
  when: INSTALL_WAZUH | default("NO") | upper == "YES"
  vars:
    wazuh_clients_group: "r42_kunai_lab_wazuh_clients"
    global_vm_ci_ip:     "192.168.142.110"
