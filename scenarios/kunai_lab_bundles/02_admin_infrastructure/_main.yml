##
## 02 - admin infrastructure
##
## Hosts the optional admin platform VMs for the kunai_lab scenario :
##   - admin-wazuh (VMID 1110, IP 192.168.142.110) : Wazuh SIEM server + agent
##     install on the trainer + students VMs (group r42_kunai_lab_wazuh_clients).
##     Gated by INSTALL_WAZUH (default NO per manifest/feature_flags.yml).
##
## All entries below are wired but conditionally executed. With INSTALL_WAZUH=NO
## (default), stage_00 skips the VM bootstrap, stage_01 baseline skips (empty
## r42_admin group), wazuh server + finalize agent install both skip via their
## own when: clauses. Net effect : zero plays executed when all flags off.
##

