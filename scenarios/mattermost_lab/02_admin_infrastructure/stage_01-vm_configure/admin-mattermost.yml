##
## admin-mattermost - Mattermost docker-compose stack on r42.admin-mattermost-standalone
##
## Delegates to the shared bundle which provides the full pipeline (catalog .env
## seed + Docker baseline + firewall 22/8065 + docker compose up of the
## mattermost stack from range42-catalog).
##
## Gated by INSTALL_MATTERMOST (default YES per mattermost_lab feature_flags.yml -
## this is the Mattermost showcase scenario ; general scenarios that wire this
## wrapper default NO).
##

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/admin/software.install.mattermost/main.yml"
  when: INSTALL_MATTERMOST | default("YES") | upper == "YES"
  vars:
    global_vm_ssh_name: "r42.admin-mattermost-standalone"
    global_vm_ci_ip:    "192.168.142.182"
