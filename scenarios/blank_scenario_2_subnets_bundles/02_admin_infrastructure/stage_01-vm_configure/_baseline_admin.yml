##
## Baseline for r42_admin_active runtime group (blank_scenario_2_subnets) :
##   - system-baseline-default     : packages + dotfiles
##   - network-baseline-ssh        : firewall opens port 22 (wazuh / misp service
##                                   ports opened by their respective bundles)
##   - tailscale-on-group          : optional tailscale install (gated INSTALL_TAILSCALE,
##                                   default NO)
##
## Targets r42_admin_active (built by ../_build_admin_active_group.yml from the
## INSTALL_<flag> values at deploy time + always-on admin VMs). Each baseline
## play only runs on admin VMs that stage_00 actually created. The 3 always-on
## deployer VMs always get the baseline ; the optional admin-wazuh / admin-misp
## get it only when their flag is YES.
##

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/system-baseline-default/main.yml"
  vars:
    target_group: "r42_admin_active"

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/network-baseline-ssh/main.yml"
  vars:
    target_group: "r42_admin_active"

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/tailscale-on-group/main.yml"
  vars:
    target_group: "r42_admin_active"
    INSTALL_TAILSCALE: "NO"
    tailscale_hostnames:
      - "bs2-admin-wazuh"
      - "bs2-admin-misp"
      - "bs2-admin-deployer-api-gateway"
      - "bs2-admin-deployer-api-backend"
      - "bs2-admin-deployer-ui"
