---
################################################################################
# range42 - vault secrets (vaultwarden_lab)
#
# This file contains ALL secret values for this CODENAME-SCENARIO.
# vaultwarden_lab brings up a single Ubuntu LTS host. The operator SSH key and
# password get auto-generated by the wizard at workspace setup ; the Proxmox
# secrets must be provided.
#
# Usage:
#   1. Copy this file: cp vault.yml.example vault.yml
#   2. Fill in real values
#   3. Encrypt: ansible-vault encrypt vault.yml
#   4. Never commit the unencrypted version
#
# Password format: use only a-z A-Z 0-9 - _ (20+ characters recommended)
#
################################################################################


#### PROXMOX API SECRET ####

# api token secret - generated by proxmox.api-token or imported from existing
proxmox_api_token_secret: "REPLACE_ME"


#### JUMP HOST ####

# jump user password (initial password, used for user creation)
jump_password: "REPLACE_ME"


#### CLOUD-INIT PASSWORDS ####

# admin vm (alice) password
default_admin_vm_ci_password: "REPLACE_ME"

# admin vm (alice) ssh public key - populated by credentials.generate
default_admin_vm_ci_ssh_key: "ssh-ed25519 AAAA... alice CODENAME-SCENARIO"


#### DEPLOYER-CLI KNOWN HOSTS ####

# operator-side known_hosts snapshot used by the wait-for-SSH task
deployer_cli_user_ssh_known_hosts: "REPLACE_ME"


#### VAULTWARDEN ####

# vault_vw_admin_token is required by INSTALL_VAULTWARDEN (default YES) - the
# container refuses to start without it. Everything below it is only needed for
# the opt-in credential sync (INSTALL_VAULTWARDEN_SYNC / ./vaultwarden_lab.poc.sh)
# and comes from the one-time account bootstrap : see the README "Vaultwarden
# credential sync" section and bundles/admin/credentials.sync.vaultwarden/README.md.

# admin panel token - argon2 hash from the catalog element's `make hash`
# (quote it, it contains '$' segments)
vault_vw_admin_token: "REPLACE_ME_argon2_hash"

# service-account personal API key (Account Settings > Security > Keys)
vault_vw_client_id: "user.REPLACE_ME"
vault_vw_client_secret: "REPLACE_ME"

# service-account master password (to unlock the vault via bw)
vault_vw_master_password: "REPLACE_ME"

# optional org scoping (leave empty for personal-vault items)
vault_vw_org_id: ""
vault_vw_collection_id: ""

# demo secret pushed then pulled back by the sync round-trip
vw_demo_secret: "REPLACE_ME_demo_value"
