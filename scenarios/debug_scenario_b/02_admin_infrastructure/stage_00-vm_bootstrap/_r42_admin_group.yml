#
# Optional admin VM(s) gated by feature flags. Default NO per
# manifest/feature_flags.yml (minimal debug scenario, monitoring opt-in).
#
#   - admin-wazuh (8550, 192.168.142.155, vmbr142) : Wazuh SIEM server
#     (gated INSTALL_WAZUH, default NO)
#   - admin-misp  (8551, 192.168.142.156, vmbr142) : MISP threat intel stack
#     (gated INSTALL_MISP,  default NO)
#

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/vm.bootstrap/main.yml"
  when: INSTALL_WAZUH | default("NO") | upper == "YES"
  vars:
    global_vm_name:        "admin-wazuh"
    global_vm_ssh_name:    "r42.admin-wazuh"
    global_vm_id:          8550
    global_vm_description: "debug_scenario_b - Wazuh SIEM server (optional)"
    global_vm_tag_name:    "debug-scenario-b"
    global_vm_ci_ip:       "192.168.142.155"
    global_template_vm_id: 9232
    global_template_name:  "03-template-vm-medium-02-8g-64g - 9232"
    global_vm_net_virtio_bridge:  "vmbr142"
    global_vm_ci_ip_gw:           "192.168.142.1"

