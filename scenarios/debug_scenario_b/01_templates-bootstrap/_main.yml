---
##
## 01 - template bootstrap
##
## Idempotent template provisioning :
##   1. Download the cloud-init source files (Ubuntu + Debian + Alpine images).
##   2. Build alpine-nano template (VMID 9903) - always - used by dsb-vm-01.
##   3. Build ubuntu_noble medium-02 template (VMID 9232) ONLY when admin tier
##      is requested (admin-wazuh / admin-misp use template 9232).
##

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/cloud_init_image.download.all/main.yml"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/template.build.alpine/main.yml"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/template.build.ubuntu_noble/main.yml"
  when: (INSTALL_WAZUH | default("NO") | upper == "YES") or (INSTALL_MISP | default("NO") | upper == "YES")
  vars:
    manifest_path:       "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/scenarios/debug_scenario_b/manifest/scenario_vms.json"
    template_bundle_dir: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/template.build.ubuntu_noble"
    templates_whitelist: ["medium-02"]
