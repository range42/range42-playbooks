##
## debug_scenario_b - main playbook
##
## Structure : multi-level _main + _main_stage_NN per tier - flexible global stage interleaving across tiers without rewriting per-tier plays.
##
## Provisions 1 lab VM on vmbr148 (Alpine nano - fast debug iteration).
## Optional admin tier (gated by feature flags, default NO per
## manifest/feature_flags.yml) :
##   - admin-wazuh (INSTALL_WAZUH, default NO) - Wazuh SIEM server
##   - admin-misp  (INSTALL_MISP,  default NO) - MISP threat intel stack
##
## Lab topology :
##   - dsb-vm-01 (192.168.148.250, VMID 8501, vmbr148) - Alpine debug VM
##
## Optional admin tier (192.168.142.0/24 admin band) :
##   - admin-wazuh (192.168.142.155, VMID 8550, vmbr142)
##   - admin-misp  (192.168.142.156, VMID 8551, vmbr142)
##
## Global stage discipline (mirror of kunai_lab / demo_lab) :
##   1. 01_templates-bootstrap                          create the shared templates
##      (medium 9232 only when INSTALL_WAZUH=YES or INSTALL_MISP=YES)
##   2. ALL tiers stage_00 (vm_bootstrap)               create every VM first
##   3. ALL tiers stage_01 (vm_configure)               configure every VM after
##   4. cross-tier finalize (wazuh-agent on dsb-vm-01)  when INSTALL_WAZUH=YES
##
## This ordering guarantees that any cross-tier configure step (e.g. wazuh
## agent install on tier 03 client reaching the wazuh server on tier 02)
## sees ALL target VMs created AND baselined before firing.
##

#### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
