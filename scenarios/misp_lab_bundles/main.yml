##
## misp_lab - main playbook
##
## Structure : multi-level _main + _main_stage_NN per tier - flexible global stage interleaving across tiers without rewriting per-tier plays.
##
## Provisions a single Ubuntu LTS VM (admin-misp-standalone) on vmbr142 from
## the project standard medium template (VMID 9232 : 2cpu / 8gb / 64gb) and
## deploys the misp-standalone docker-compose stack on it via the shared
## bundle bundles/admin/software.install.misp-standalone/.
##
## MISP IS the workload of this scenario - always deployed (no INSTALL_MISP
## flag). The optional admin tier (admin-wazuh) is gated by INSTALL_WAZUH
## (default NO per manifest/feature_flags.yml).
##
## Lab topology :
##   - admin-misp-standalone (192.168.142.180, VMID 1180, vmbr142)  - MISP host
##
## Optional admin tier (192.168.142.0/24 admin band) :
##   - admin-wazuh (192.168.142.182, VMID 1182, vmbr142)            - SIEM server
##
## Global stage discipline (mirror of kunai_lab_bundles / demo_lab_bundles) :
##   1. 01_templates-bootstrap                                create the shared template (9232)
##   2. ALL tiers stage_00 (vm_bootstrap)                     create every VM first
##   3. ALL tiers stage_01 (vm_configure)                     configure every VM after
##   4. cross-tier finalize (wazuh-agent on admin-misp-standalone)  when INSTALL_WAZUH=YES
##

