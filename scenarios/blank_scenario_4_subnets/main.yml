##
## blank_scenario_4_subnets - main playbook
##
## Structure : multi-level _main + _main_stage_NN per tier - flexible global stage interleaving across tiers without rewriting per-tier plays.
##
## Provisions 16 team lab VMs on 4 subnets (net143-146, 4 VMs per subnet) plus
## an admin platform (3 always-on deployer VMs + 2 optional admin VMs).
##
## Admin tier (192.168.142.0/24 admin band) :
##   - bs4-admin-deployer-api-gateway (192.168.142.131, VMID 4131, always created)
##   - bs4-admin-deployer-api-backend (192.168.142.132, VMID 4132, always created)
##   - bs4-admin-deployer-ui          (192.168.142.133, VMID 4133, always created)
##   - bs4-admin-wazuh                (192.168.142.130, VMID 4130, gated INSTALL_WAZUH)
##   - bs4-admin-misp                 (192.168.142.134, VMID 4134, gated INSTALL_MISP)
##
## Global stage discipline (mirror of bs2 / kunai / demo / misp_lab bundles).
##

