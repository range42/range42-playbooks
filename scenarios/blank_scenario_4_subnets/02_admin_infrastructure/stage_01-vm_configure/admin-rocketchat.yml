##
## admin-rocketchat - Rocket.Chat docker-compose stack on r42.bs4-admin-rocketchat
##
## Delegates to the shared bundle (catalog .env seed + Docker baseline +
## firewall 22/3000 + docker-compose deploy of rocketchat : mongodb +
## mongo-init-replica + rocketchat + provisioner). blank_scenario_4_subnets
## offers Rocket.Chat as an optional admin service.
##
## NOTE : the MongoDB replica-set cold-start takes ~90-180s on first deploy.
##
## Gated by INSTALL_ROCKETCHAT (default NO per feature_flags.yml).
##

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/admin/software.install.rocketchat/main.yml"
  when: INSTALL_ROCKETCHAT | default("NO") | upper == "YES"
  vars:
    global_vm_ssh_name: "r42.bs4-admin-rocketchat"
    global_vm_ci_ip:    "192.168.142.138"
