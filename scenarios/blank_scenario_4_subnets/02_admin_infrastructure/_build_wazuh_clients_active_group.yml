---
##
## blank_scenario_4_subnets - 02_admin_infrastructure - build r42_blank_scenario_4_subnets_wazuh_clients_active
##
## Structure : runtime-only group built via add_host on the proxmox host based
## on deploy-time state. Mirror of _build_admin_active_group.yml (Option A
## pattern) applied to the wazuh-agent client list.
##
## Used by _finalize-baseline-admin_wazuh_client.yml as wazuh_clients_group.
##
## Membership map :
##
##   client VM                              VM creation gate                add_host condition
##   ------------------------------------- ------------------------------- ----------------------
##   r42.bs4-admin-misp                    INSTALL_MISP (default NO)       INSTALL_MISP=YES
##   r42.bs4-admin-deployer-api-gateway    INSTALL_DEPLOYER_UI (default NO) INSTALL_DEPLOYER_UI=YES
##   r42.bs4-admin-deployer-api-backend    INSTALL_DEPLOYER_UI (default NO) INSTALL_DEPLOYER_UI=YES
##   r42.bs4-admin-deployer-ui             INSTALL_DEPLOYER_UI (default NO) INSTALL_DEPLOYER_UI=YES
##   r42.bs4-team-143-01..04               (always created)                always added
##   r42.bs4-team-144-01..04               (always created)                always added
##   r42.bs4-team-145-01..04               (always created)                always added
##   r42.bs4-team-146-01..04               (always created)                always added
##
## The wazuh server itself (r42.bs4-admin-wazuh) is EXCLUDED by design.
##

- name: build r42_blank_scenario_4_subnets_wazuh_clients_active dynamic group from INSTALL flags
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: add r42.bs4-admin-misp to r42_blank_scenario_4_subnets_wazuh_clients_active when INSTALL_MISP=YES
      ansible.builtin.add_host:
        name: r42.bs4-admin-misp
        groups: r42_blank_scenario_4_subnets_wazuh_clients_active
      when: INSTALL_MISP | default("NO") | upper == "YES"
      changed_when: false

    - name: add r42.bs4-admin-gitea to r42_blank_scenario_4_subnets_wazuh_clients_active when INSTALL_GITEA=YES
      ansible.builtin.add_host:
        name: r42.bs4-admin-gitea
        groups: r42_blank_scenario_4_subnets_wazuh_clients_active
      when: INSTALL_GITEA | default("NO") | upper == "YES"
      changed_when: false

    - name: add r42.bs4-admin-mattermost to r42_blank_scenario_4_subnets_wazuh_clients_active when INSTALL_MATTERMOST=YES
      ansible.builtin.add_host:
        name: r42.bs4-admin-mattermost
        groups: r42_blank_scenario_4_subnets_wazuh_clients_active
      when: INSTALL_MATTERMOST | default("NO") | upper == "YES"
      changed_when: false

    - name: add r42.bs4-admin-nextcloud to r42_blank_scenario_4_subnets_wazuh_clients_active when INSTALL_NEXTCLOUD=YES
      ansible.builtin.add_host:
        name: r42.bs4-admin-nextcloud
        groups: r42_blank_scenario_4_subnets_wazuh_clients_active
      when: INSTALL_NEXTCLOUD | default("NO") | upper == "YES"
      changed_when: false

    - name: add r42.bs4-admin-rocketchat to r42_blank_scenario_4_subnets_wazuh_clients_active when INSTALL_ROCKETCHAT=YES
      ansible.builtin.add_host:
        name: r42.bs4-admin-rocketchat
        groups: r42_blank_scenario_4_subnets_wazuh_clients_active
      when: INSTALL_ROCKETCHAT | default("NO") | upper == "YES"
      changed_when: false

    - name: add admin deployer trio to r42_blank_scenario_4_subnets_wazuh_clients_active when INSTALL_DEPLOYER_UI=YES
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: r42_blank_scenario_4_subnets_wazuh_clients_active
      loop:
        - r42.bs4-admin-deployer-api-gateway
        - r42.bs4-admin-deployer-api-backend
        - r42.bs4-admin-deployer-ui
      when: INSTALL_DEPLOYER_UI | default("NO") | upper == "YES"
      changed_when: false

    - name: add team VMs to r42_blank_scenario_4_subnets_wazuh_clients_active (always)
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: r42_blank_scenario_4_subnets_wazuh_clients_active
      loop:
        - r42.bs4-team-143-01
        - r42.bs4-team-143-02
        - r42.bs4-team-143-03
        - r42.bs4-team-143-04
        - r42.bs4-team-144-01
        - r42.bs4-team-144-02
        - r42.bs4-team-144-03
        - r42.bs4-team-144-04
        - r42.bs4-team-145-01
        - r42.bs4-team-145-02
        - r42.bs4-team-145-03
        - r42.bs4-team-145-04
        - r42.bs4-team-146-01
        - r42.bs4-team-146-02
        - r42.bs4-team-146-03
        - r42.bs4-team-146-04
      changed_when: false
