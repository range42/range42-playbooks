##
## 03 - team infrastructure - stage_00 (vm_bootstrap)
##
## Structure : stage_00 unit imported by top-level main.yml ; split kept so global stage ordering (all stage_00 before all stage_01) stays editable.
##
## Provisions 16 team lab VMs across 4 subnets (4 VMs per subnet) :
##   - vmbr143 : bs4-team-143-01..04 (VMID 4001-4004, IP 192.168.143.210-213)
##   - vmbr144 : bs4-team-144-01..04 (VMID 4005-4008, IP 192.168.144.210-213)
##   - vmbr145 : bs4-team-145-01..04 (VMID 4009-4012, IP 192.168.145.210-213)
##   - vmbr146 : bs4-team-146-01..04 (VMID 4013-4016, IP 192.168.146.210-213)
##

# --- subnet 143 (vmbr143) - VM 01 ---

- import_playbook: ./stage_00-vm_bootstrap/bs4_team_143_01.yml
  vars:
    global_vm_name: "bs4-team-143-01"
    global_vm_ssh_name: "r42.bs4-team-143-01"
    global_vm_id: 4001
    global_vm_description: "blank bs4 - team 143 - box 01"
    global_vm_tag_name: "blank"
    global_vm_ci_ip: "192.168.143.210"
    global_vm_ci_ip_gw: "192.168.143.1"
    global_vm_net_bridge: "vmbr143"
    #
    global_template_vm_id: 9221
    global_template_name: "template-vm-small-01-4g-32g - id : 9221"

