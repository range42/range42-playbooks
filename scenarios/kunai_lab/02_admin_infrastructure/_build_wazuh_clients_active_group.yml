---
##
## kunai_lab_bundles - 02_admin_infrastructure - build r42_kunai_lab_wazuh_clients_active
##
## Structure : runtime-only group built via add_host on localhost based on
## INSTALL_<flag> values at deploy time. Mirror of _build_admin_active_group.yml
## (Option A pattern, kungfu 198) applied to the wazuh-agent client list.
##
## Used by _finalize-baseline-admin_wazuh_client.yml as wazuh_clients_group.
## Per-host gating without inventory file modification ; the wazuh-agent
## install only targets VMs that exist at deploy time.
##
## Membership map :
##
##   client VM                       VM creation gate                 add_host condition
##   ------------------------------ -------------------------------- ----------------------
##   r42.admin-misp                  INSTALL_MISP (default NO)        INSTALL_MISP=YES
##   r42.admin-trainer-kunai         (none, lab tier always created)  always added
##   r42.student-kunai-01..05        (none, lab tier always created)  always added
##
## The wazuh server itself (r42.admin-wazuh) is EXCLUDED by design (a server
## does not run its own agent).
##
## With INSTALL_MISP=NO -> admin-misp NOT in the active group -> wazuh-agent
## install on it is silently skipped (no UNREACHABLE).
##

- name: build r42_kunai_lab_wazuh_clients_active dynamic group from INSTALL flags
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: add r42.admin-misp to r42_kunai_lab_wazuh_clients_active when INSTALL_MISP=YES
      ansible.builtin.add_host:
        name: r42.admin-misp
        groups: r42_kunai_lab_wazuh_clients_active
      when: INSTALL_MISP | default("NO") | upper == "YES"
      changed_when: false

    - name: add r42.admin-trainer-kunai to r42_kunai_lab_wazuh_clients_active (lab tier, always created)
      ansible.builtin.add_host:
        name: r42.admin-trainer-kunai
        groups: r42_kunai_lab_wazuh_clients_active
      changed_when: false

    - name: add r42.student-kunai-01 to r42_kunai_lab_wazuh_clients_active (lab tier, always created)
      ansible.builtin.add_host:
        name: r42.student-kunai-01
        groups: r42_kunai_lab_wazuh_clients_active
      changed_when: false

    - name: add r42.student-kunai-02 to r42_kunai_lab_wazuh_clients_active (lab tier, always created)
      ansible.builtin.add_host:
        name: r42.student-kunai-02
        groups: r42_kunai_lab_wazuh_clients_active
      changed_when: false

    - name: add r42.student-kunai-03 to r42_kunai_lab_wazuh_clients_active (lab tier, always created)
      ansible.builtin.add_host:
        name: r42.student-kunai-03
        groups: r42_kunai_lab_wazuh_clients_active
      changed_when: false

    - name: add r42.student-kunai-04 to r42_kunai_lab_wazuh_clients_active (lab tier, always created)
      ansible.builtin.add_host:
        name: r42.student-kunai-04
        groups: r42_kunai_lab_wazuh_clients_active
      changed_when: false

    - name: add r42.student-kunai-05 to r42_kunai_lab_wazuh_clients_active (lab tier, always created)
      ansible.builtin.add_host:
        name: r42.student-kunai-05
        groups: r42_kunai_lab_wazuh_clients_active
      changed_when: false
