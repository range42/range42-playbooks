##
## kunai_lab - main playbook
##
## Structure : multi-level _main + _main_stage_NN per tier - flexible global stage interleaving across tiers without rewriting per-tier plays.
##
## Provisions 6 lab VMs on vmbr142 from the project standard medium template
## (VMID 9232 : 2cpu / 8gb / 64gb). Each VM is delivered with the Docker
## baseline pre-installed + kunai-project ecosystem repositories pre-cloned.
##
## Optional admin VMs gated by feature flags :
##   - admin-wazuh (INSTALL_WAZUH, default NO)
##   - admin-misp  (INSTALL_MISP,  default NO)
##
## Lab topology (single in-VM user alice on every VM, project convention) :
##   - admin-trainer-kunai (192.168.142.104, VMID 1104)  - trainer
##   - student-kunai-01    (192.168.142.105, VMID 1105)  - student
##   - student-kunai-02    (192.168.142.106, VMID 1106)  - student
##   - student-kunai-03    (192.168.142.107, VMID 1107)  - student
##   - student-kunai-04    (192.168.142.108, VMID 1108)  - student
##   - student-kunai-05    (192.168.142.109, VMID 1109)  - student
##
## Global stage discipline (restored from legacy kunai_lab/main.yml shape) :
##   1. 01_templates-bootstrap                          create the shared template
##   2. ALL tiers stage_00 (vm_bootstrap)               create every VM first
##   3. ALL tiers stage_01 (vm_configure)               configure every VM after
##   4. cross-tier finalize (wazuh-agent on lab clients) when INSTALL_WAZUH=YES
##
## This ordering guarantees that any cross-tier configure step (e.g. wazuh
## agent install on tier 03+04 clients reaching the wazuh server on tier 02)
## sees ALL target VMs created AND baselined before firing.
##

