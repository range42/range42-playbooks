---
##
## kunai_lab - main playbook
##
## Provisions 6 Ubuntu LTS VMs on vmbr142 from the project standard medium
## template (VMID 9232 : 2cpu / 8gb / 64gb). Each VM is delivered with the
## Docker baseline pre-installed (docker, docker compose, zsh dotfiles, basic
## utilities, firewall opening port 22 only) plus the kunai-project ecosystem
## repositories pre-cloned in the operator home.
##
## Topology :
##   - admin-trainer-kunai (192.168.142.104, VMID 1104, user alice)  - trainer
##   - student-kunai-01    (192.168.142.105, VMID 1105, user bob)    - student
##   - student-kunai-02    (192.168.142.106, VMID 1106, user bob)    - student
##   - student-kunai-03    (192.168.142.107, VMID 1107, user bob)    - student
##   - student-kunai-04    (192.168.142.108, VMID 1108, user bob)    - student
##   - student-kunai-05    (192.168.142.109, VMID 1109, user bob)    - student
##
## Stages :
##   01_init_proxmox                            : download cloud-init image + create template 9232 (idempotent skip if already present)
##   02_kunai_lab_infrastructure/stage_00       : 6 VM clones + cloud-init + start + wait-for-SSH (one file per VM)
##   02_kunai_lab_infrastructure/stage_01       : Docker baseline applied to both groups + kunai-project repos cloned per role
##

