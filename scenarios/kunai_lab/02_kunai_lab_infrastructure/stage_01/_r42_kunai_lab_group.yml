      - { name: "kunai-doc",          repo: "https://github.com/kunai-project/kunai-doc.git" }
      - { name: "kunai-build-docker", repo: "https://github.com/kunai-project/kunai-build-docker.git" }
      - { name: "community-rules",    repo: "https://github.com/kunai-project/community-rules.git" }
      - { name: "pykunai",            repo: "https://github.com/kunai-project/pykunai.git" }

  tasks:
    - name: ensure kunai-project parent directory exists ({{ kunai_repos_dir }})
      ansible.builtin.file:
        path: "{{ kunai_repos_dir }}"
        state: directory
        owner: "{{ OPERATOR_USER }}"
        group: "{{ OPERATOR_USER }}"
        mode: "0755"

    - name: clone kunai-project repositories ({{ OPERATOR_USER }})
      ansible.builtin.git:
