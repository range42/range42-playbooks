---
##
## WORKAROUND - free the vnet subnets from the legacy `vmbrXXX` bridges
##
## THE PROBLEM, measured on px-testing 2026-08-19. The legacy NAT hack leaves a `vmbrNNN` bridge
## holding the SAME `.1` as the SDN vnet meant to replace it :
##
##     vmbr143  192.168.143.1/24        net143  192.168.143.1/24
##
## Two interfaces, one subnet. The route lookup picks `vmbr143`, where no VM is attached, so the
## host ARPs into the void : a VM on net143 is unreachable and its return traffic is lost. The plan
## calls this H1 - the cutover cannot be gradual, the two cannot coexist.
##
## WHAT THIS DOES. For each vnet this scenario declares, if the matching legacy bridge carries the
## same address, remove THAT ADDRESS ONLY. Not the bridge, not its config. Nothing is written to
## disk, so `ifreload -a` or a reboot puts it back.
##
## SCOPE IS DELIBERATELY NARROW : only the bridges that collide with a declared vnet. Stripping
## vmbr145 while no net145 exists would strand its VMs with no replacement.
##
## IT MUST RUN AFTER THE SDN TIER, and that is not a preference : the SDN apply runs `ifreload -a`,
## which re-reads /etc/network/interfaces and RESTORES what this removes. Any later apply undoes it
## too - re-run this file then.
##
## THIS IS A WORKAROUND, NOT THE FIX. The fix is dropping the hack that creates those bridges.
## Disable with  -e sdn_free_legacy_subnets=false  once that is done.
##

- name: "blank_scenario_2_sdn - WORKAROUND free the vnet subnets from the legacy bridges"
  hosts: proxmox
  gather_facts: false
  vars:
    #### derived from the vnets the SDN tier declares : netNNN <-> vmbrNNN, same third octet
    _wa_pairs:
      - { vnet: "net140", legacy: "vmbr140", cidr: "192.168.140.1/24" }
      - { vnet: "net142", legacy: "vmbr142", cidr: "192.168.142.1/24" }
      - { vnet: "net143", legacy: "vmbr143", cidr: "192.168.143.1/24" }
      - { vnet: "net144", legacy: "vmbr144", cidr: "192.168.144.1/24" }
    _wa_on: "{{ sdn_free_legacy_subnets | default(true) | bool }}"

  tasks:
    - name: WORKAROUND - SKIPPED ON DEMAND
      ansible.builtin.debug:
        msg: "sdn_free_legacy_subnets is false - the legacy bridges keep their addresses"
      when: not _wa_on

    - name: WORKAROUND - THE HYPERVISOR MUST BE REACHABLE OVER SSH
      ansible.builtin.assert:
        that:
          - (groups['proxmox_cli'] | default([]) | length) > 0
        fail_msg: >-
          this reads and edits addresses ON THE HYPERVISOR through the proxmox_cli group. Without it
          the commands would run on the deployer, report success, and change nothing there.
        success_msg: "will run on {{ groups['proxmox_cli'] | first }}"
      when: _wa_on

    #### #### ####
    #
    # 1. WHAT IS ACTUALLY IN CONFLICT. Read, never assume : a bridge may be absent, or already
    #    stripped by an earlier run. Both are fine and neither is a failure.
    #
    - name: WORKAROUND - READ WHAT THE LEGACY BRIDGES CARRY
      ansible.builtin.shell: |
        set -u
        for b in {{ _wa_pairs | map(attribute='legacy') | join(' ') }} ; do
          if ip link show "$b" >/dev/null 2>&1 ; then
            printf '%s %s\n' "$b" "$(ip -4 -o addr show dev "$b" | awk '{print $4}' | paste -sd, )"
          else
            printf '%s ABSENT\n' "$b"
          fi
        done
      args:
        executable: /bin/bash
      environment:
        PATH: "/usr/sbin:/sbin:/usr/bin:/bin"
      register: _wa_state
      changed_when: false
      delegate_to: "{{ groups['proxmox_cli'] | first }}"
      when: _wa_on

    - name: WORKAROUND - WHAT THE HYPERVISOR REPORTS
      ansible.builtin.debug:
        var: _wa_state.stdout_lines
      when: _wa_on

    #### #### ####
    #
    # 2. THE GUARD THAT MATTERS. A RUNNING VM attached to one of these bridges loses its gateway the
    #    moment the address goes. If that VM is the deployer, this play dies with it and the operator
    #    loses access mid-run. So : refuse, and name exactly what is attached.
    #
    - name: WORKAROUND - IS A LIVE VM ATTACHED TO A BRIDGE WE WOULD STRIP
      ansible.builtin.shell: |
        set -u
        hits=""
        for b in {{ _wa_pairs | map(attribute='legacy') | join(' ') }} ; do
          ip -4 -o addr show dev "$b" 2>/dev/null | grep -q . || continue
          for tap in $(ip -br link show master "$b" 2>/dev/null | awk '{print $1}') ; do
            case "$tap" in tap*) hits="${hits} ${b}:${tap}" ;; esac
          done
        done
        printf '%s\n' "${hits# }"
      args:
        executable: /bin/bash
      environment:
        PATH: "/usr/sbin:/sbin:/usr/bin:/bin"
      register: _wa_attached
      changed_when: false
      delegate_to: "{{ groups['proxmox_cli'] | first }}"
      when: _wa_on

    - name: WORKAROUND - REFUSE RATHER THAN CUT A LIVE VM OFF
      ansible.builtin.assert:
        that:
          - (_wa_attached.stdout | trim | length) == 0
        fail_msg: >-
          these bridges still carry a running VM's interface : {{ _wa_attached.stdout | trim }}.
          Taking their address away would cut that VM off - and if it is the deployer, this play with
          it. Move or stop those VMs first, or pass -e sdn_free_legacy_subnets=false.
        success_msg: "no running VM is attached to the bridges to strip"
      when: _wa_on

    #### #### ####
    #
    # 3. FREE THE SUBNET, one bridge at a time, and only where the address is really there. An
    #    absent bridge or an already-free one is reported and skipped, not treated as an error.
    #
    - name: WORKAROUND - FREE THE SUBNET FROM THE LEGACY BRIDGE
      ansible.builtin.shell: |
        set -u
        b='{{ item.legacy }}'
        a='{{ item.cidr }}'
        ip link show "$b" >/dev/null 2>&1 || { echo "absent:$b" ; exit 0 ; }
        ip -4 -o addr show dev "$b" | grep -q " $a " || { echo "already-free:$b" ; exit 0 ; }
        ip addr del "$a" dev "$b" || { echo "refused:$b" ; exit 1 ; }
        echo "freed:$b"
      args:
        executable: /bin/bash
      environment:
        PATH: "/usr/sbin:/sbin:/usr/bin:/bin"
      register: _wa_done
      changed_when: "'freed:' in _wa_done.stdout"
      delegate_to: "{{ groups['proxmox_cli'] | first }}"
      loop: "{{ _wa_pairs }}"
      loop_control:
        label: "{{ item.legacy }} {{ item.cidr }}"
      when: _wa_on

    #### #### ####
    #
    # 4. PROVE IT. Each subnet must now leave through its vnet and not through the bridge that was
    #    shadowing it. This is the check the whole file exists for - the rest is preparation.
    #
    - name: WORKAROUND - WHICH DEVICE EACH SUBNET NOW LEAVES THROUGH
      ansible.builtin.shell: |
        set -u
        for p in {{ _wa_pairs | map(attribute='vnet') | join(' ') }} ; do
          n="${p#net}"
          dev=$(ip route get "192.168.${n}.2" 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="dev") print $(i+1)}')
          printf '192.168.%s.0/24 -> %s\n' "$n" "${dev:-NONE}"
        done
      args:
        executable: /bin/bash
      environment:
        PATH: "/usr/sbin:/sbin:/usr/bin:/bin"
      register: _wa_routes
      changed_when: false
      delegate_to: "{{ groups['proxmox_cli'] | first }}"
      when: _wa_on

    - name: WORKAROUND - EVERY SUBNET NOW LEAVES THROUGH ITS VNET
      ansible.builtin.assert:
        that:
          - (_wa_routes.stdout_lines | select('search', 'vmbr') | list | length) == 0
          - (_wa_routes.stdout_lines | select('search', 'NONE') | list | length) == 0
        fail_msg: >-
          a subnet still leaves through a legacy bridge, or through nothing at all :
          {{ _wa_routes.stdout_lines }}
        success_msg: "{{ _wa_routes.stdout_lines }}"
      when: _wa_on
