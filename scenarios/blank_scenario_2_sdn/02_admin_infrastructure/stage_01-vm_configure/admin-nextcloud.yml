##
## admin-nextcloud - Nextcloud docker-compose stack on r42.bs2-admin-nextcloud
##
## Delegates to the shared bundle (catalog .env seed + Docker baseline +
## firewall 22/8080 + docker-compose deploy of nextcloud : postgres + redis +
## nextcloud + provisioner). blank_scenario_2_sdn offers Nextcloud as an
## optional admin service (the nextcloud_lab vitrine is the dedicated showcase).
##
## NOTE : align NC_DOMAIN in the catalog .env to include this VM IP
## (192.168.142.127) before deploy, else Nextcloud rejects access (untrusted
## domain). See the bundle README.
##
## Gated by INSTALL_NEXTCLOUD (default NO per blank_scenario_2_sdn feature_flags.yml).
##

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/admin/software.install.nextcloud/main.yml"
  when: INSTALL_NEXTCLOUD | default("NO") | upper == "YES"
  vars:
    global_vm_ssh_name: "r42.bs2-admin-nextcloud"
    global_vm_ci_ip:    "192.168.142.127"
