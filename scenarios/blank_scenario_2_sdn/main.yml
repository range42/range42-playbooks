##
## blank_scenario_2_sdn - main playbook
##
## Structure : multi-level _main + _main_stage_NN per tier - flexible global stage interleaving across tiers without rewriting per-tier plays.
##
## Provisions 4 team lab VMs on 2 subnets (net143 + net144) plus an admin
## platform (3 always-on deployer VMs + 2 optional admin VMs).
##
## Lab topology :
##   - bs2-team-143-01 (192.168.143.200, VMID 2001, net143)
##   - bs2-team-143-02 (192.168.143.201, VMID 2002, net143)
##   - bs2-team-144-01 (192.168.144.200, VMID 2003, net144)
##   - bs2-team-144-02 (192.168.144.201, VMID 2004, net144)
##
## Admin tier (192.168.142.0/24 admin band) :
##   - bs2-admin-deployer-api-gateway (192.168.142.121, VMID 2121, always created)
##   - bs2-admin-deployer-api-backend (192.168.142.122, VMID 2122, always created)
##   - bs2-admin-deployer-ui          (192.168.142.123, VMID 2123, always created)
##   - bs2-admin-wazuh                (192.168.142.120, VMID 2120, gated INSTALL_WAZUH)
##   - bs2-admin-misp                 (192.168.142.124, VMID 2124, gated INSTALL_MISP)
##
## Global stage discipline (mirror of demo_lab / kunai_lab) :
##   1. 01_templates-bootstrap                                create the shared templates
##   2. ALL tiers stage_00 (vm_bootstrap)                     create every VM first
##   3. ALL tiers stage_01 (vm_configure)                     configure every VM after
##   4. cross-tier finalize (wazuh-agent on team + admin VMs) when INSTALL_WAZUH=YES
##
## This ordering guarantees that any cross-tier configure step sees ALL target
## VMs created AND baselined before firing.
##

