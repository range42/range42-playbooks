---
# Feature flags for blank_scenario_6_subnets - optional components that
# can be toggled on/off at deploy time via `-e INSTALL_<NAME>=YES|NO`.
#
# Convention :
#   - `id` is UPPERCASE (matches the variable name : `id: WAZUH` -> `INSTALL_WAZUH`)
#   - `default: true|false` is the checkbox initial state in the TUI
#   - the playbook `default("YES"|"NO")` fallback should align with this
#   - `| upper` makes the check case-insensitive : YES / yes / Yes all match

features:
  - id: WAZUH
    label: "Wazuh stack - SIEM + agents services"
    description: "Deploys an admin-wazuh VM (vm_id 6140, IP 192.168.142.140) under 02_admin_infrastructure/ + agent install on the 3 deployer-* VMs + 24 team VMs. Off by default for blank_scenario_6_subnets (minimal lab scenario, monitoring opt-in)."
    default: false

  - id: MISP
    label: "MISP - threat intel services"
    description: "Deploys an admin-misp VM (vm_id 6144, IP 192.168.142.144) and runs the misp-standalone docker-compose stack from range42-catalog/03_container_layer/docker/admin/misp-standalone/. Operator must populate the catalog's .env file with secrets BEFORE deploying with INSTALL_MISP=YES."
    default: false

  - id: DEPLOYER_UI
    label: "Deployer platform - range42 management UI + API + Kong gateway"
    description: "Deploys the 3 deployer admin VMs (vm_ids 6141/6142/6143: api-gateway/Kong, api-backend, ui) and installs the deployer platform via the shared bundles. Off by default for blank_scenario_6_subnets (opt-in management stack)."
    default: false

  - id: GITEA
    label: "Gitea - code services"
    description: "Deploys an admin-gitea VM (vm_id 6145, IP 192.168.142.145) and runs the gitea docker-compose stack (postgres + gitea + provisioner) via the shared admin bundle. Optional, off by default."
    default: false

  - id: MATTERMOST
    label: "Mattermost - chat services"
    description: "Deploys an admin-mattermost VM (vm_id 6146, IP 192.168.142.146) and runs the mattermost docker-compose stack (postgres + mattermost + provisioner) via the shared admin bundle. Optional, off by default."
    default: false

  - id: NEXTCLOUD
    label: "Nextcloud - files storage services"
    description: "Deploys an admin-nextcloud VM (vm_id 6147, IP 192.168.142.147) and runs the nextcloud docker-compose stack (postgres + redis + nextcloud + provisioner) via the shared admin bundle. Align NC_DOMAIN in the catalog .env to the VM IP before deploy. Optional, off by default."
    default: false

  - id: ROCKETCHAT
    label: "RocketChat - chat services"
    description: "Deploys an admin-rocketchat VM (vm_id 6148, IP 192.168.142.148) and runs the rocketchat docker-compose stack (mongodb + rocketchat + provisioner) via the shared admin bundle. MongoDB replica-set cold-start takes ~90-180s. Optional, off by default."
    default: false

  - id: TAILSCALE
    label: "Tailscale VPN client"
    description: "Per-group install. Off by default."
    default: false
