##
## admin-gitea - Gitea docker-compose stack on r42.bs6-admin-gitea
##
## Delegates to the shared bundle (catalog .env seed + Docker baseline +
## firewall 22/3000/2222 + docker-compose deploy of gitea : postgres + gitea +
## provisioner). Server-only optional admin service.
##
## Gated by INSTALL_GITEA (default NO).
##

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/admin/software.install.gitea/main.yml"
  when: INSTALL_GITEA | default("NO") | upper == "YES"
  vars:
    global_vm_ssh_name: "r42.bs6-admin-gitea"
    global_vm_ci_ip:    "192.168.142.145"
