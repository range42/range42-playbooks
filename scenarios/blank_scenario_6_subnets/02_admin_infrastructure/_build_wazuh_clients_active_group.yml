---
##
## blank_scenario_6_subnets_bundles - 02_admin_infrastructure - build r42_blank_scenario_6_subnets_wazuh_clients_active
##
## Structure : runtime-only group built via add_host on the proxmox host based
## on deploy-time state. Mirror of _build_admin_active_group.yml (Option A
## pattern) applied to the wazuh-agent client list.
##
## Used by _finalize-baseline-admin_wazuh_client.yml as wazuh_clients_group.
##
## Membership map :
##
##   client VM                              VM creation gate                add_host condition
##   ------------------------------------- ------------------------------- ----------------------
##   r42.bs6-admin-misp                    INSTALL_MISP (default NO)       INSTALL_MISP=YES
##   r42.bs6-admin-deployer-api-gateway    (always created)                always added
##   r42.bs6-admin-deployer-api-backend    (always created)                always added
##   r42.bs6-admin-deployer-ui             (always created)                always added
##   r42.bs6-team-143-01..04               (always created)                always added
##   r42.bs6-team-144-01..04               (always created)                always added
##   r42.bs6-team-145-01..04               (always created)                always added
##   r42.bs6-team-146-01..04               (always created)                always added
##   r42.bs6-team-147-01..04               (always created)                always added
##   r42.bs6-team-148-01..04               (always created)                always added
##
## The wazuh server itself (r42.bs6-admin-wazuh) is EXCLUDED by design.
##

- name: build r42_blank_scenario_6_subnets_wazuh_clients_active dynamic group from INSTALL flags
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: add r42.bs6-admin-misp to r42_blank_scenario_6_subnets_wazuh_clients_active when INSTALL_MISP=YES
      ansible.builtin.add_host:
        name: r42.bs6-admin-misp
        groups: r42_blank_scenario_6_subnets_wazuh_clients_active
      when: INSTALL_MISP | default("NO") | upper == "YES"
      changed_when: false

    - name: add admin deployer trio + 24 team VMs to r42_blank_scenario_6_subnets_wazuh_clients_active (always)
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: r42_blank_scenario_6_subnets_wazuh_clients_active
      loop:
        - r42.bs6-admin-deployer-api-gateway
        - r42.bs6-admin-deployer-api-backend
        - r42.bs6-admin-deployer-ui
        - r42.bs6-team-143-01
        - r42.bs6-team-143-02
        - r42.bs6-team-143-03
        - r42.bs6-team-143-04
        - r42.bs6-team-144-01
        - r42.bs6-team-144-02
        - r42.bs6-team-144-03
        - r42.bs6-team-144-04
        - r42.bs6-team-145-01
        - r42.bs6-team-145-02
        - r42.bs6-team-145-03
        - r42.bs6-team-145-04
        - r42.bs6-team-146-01
        - r42.bs6-team-146-02
        - r42.bs6-team-146-03
        - r42.bs6-team-146-04
        - r42.bs6-team-147-01
        - r42.bs6-team-147-02
        - r42.bs6-team-147-03
        - r42.bs6-team-147-04
        - r42.bs6-team-148-01
        - r42.bs6-team-148-02
        - r42.bs6-team-148-03
        - r42.bs6-team-148-04
      changed_when: false
