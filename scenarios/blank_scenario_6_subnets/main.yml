##
## blank_scenario_6_subnets - main playbook
##
## Structure : multi-level _main + _main_stage_NN per tier - flexible global stage interleaving across tiers without rewriting per-tier plays.
##
## Provisions 16 team lab VMs on 6 subnets (net143-148, 4 VMs per subnet) plus
## an admin platform (3 always-on deployer VMs + 2 optional admin VMs).
##
## Admin tier (192.168.142.0/24 admin band) :
##   - bs6-admin-deployer-api-gateway (192.168.142.141, VMID 6141, always created)
##   - bs6-admin-deployer-api-backend (192.168.142.142, VMID 6142, always created)
##   - bs6-admin-deployer-ui          (192.168.142.143, VMID 6143, always created)
##   - bs6-admin-wazuh                (192.168.142.140, VMID 6140, gated INSTALL_WAZUH)
##   - bs6-admin-misp                 (192.168.142.144, VMID 6144, gated INSTALL_MISP)
##
## Global stage discipline (mirror of bs2 / kunai / demo / misp_lab bundles).
##

