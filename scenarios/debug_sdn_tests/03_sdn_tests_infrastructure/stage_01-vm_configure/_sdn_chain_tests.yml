---
##
## debug_sdn_tests - the SDN chain, replayed through the BUNDLES
##
## WHAT THIS IS
## A faithful duplication of the devkit test `_tests/07.sdn_network_chain_tests.sh`, driving the
## bundles instead of the devkits. Same six sections, same assertions, same order.
##
## WHY IT EXISTS
## Everything about the 22 sdn_network.* / vm.* bundles has been validated STATICALLY - the parameter
## contracts against their schema, the playbooks against `--syntax-check`, the Jinja against fixtures,
## and every task against the PXC role's real required vars. None of it had ever touched a Proxmox.
## This scenario is what closes that gap.
##
## It also gives those bundles their FIRST REAL CALL-SITE. Until now they were "true orphans" to
## check-callsites.py, which reads the call-site `vars:` block : declared but never exercised. Every
## import below fills that block, so the contracts become verified rather than merely asserted.
##
## WHAT IT DOES NOT DO YET
## It REUSES an existing VM rather than creating one, so it has no templates/, no manifest/ and no
## workspace of its own - it runs inside whatever workspace is already active. Creating its own VM is
## the next step.
##
## SAFETY - READ BEFORE RUNNING
##   - it TEARS DOWN the test zone at the start and at the end. Point it at a zone you own.
##   - section 5 MOVES A NETWORK CARD of the VM, twice. The card is deleted and recreated, so ITS MAC
##     CHANGES. Never point it at a VM you reach THROUGH that card.
##   - the default range is 192.168.199.0/24, deliberately away from the production vmbr14x bands.
##
## USAGE
##   ansible-playbook scenarios/debug_sdn_tests/main.yml
##   ansible-playbook scenarios/debug_sdn_tests/main.yml -e sdn_test_vm_id=104
##
## Every parameter below is overridable with -e :
##   sdn_test_zone          r42test              the zone this scenario owns and wipes
##   sdn_test_vnet          net199
##   sdn_test_subnet        192.168.199.0/24
##   sdn_test_gateway       192.168.199.1
##   sdn_test_vm_id         102                  the VM whose card is moved
##   sdn_test_vm_netid      0                    which card - netN - is moved
##   sdn_test_vm_bridge     vmbr0                where the card comes back to
##   sdn_test_pause         15                   seconds held at each observable state change
##
## SECTION 7 uses a SECOND, throwaway network so it cannot disturb what sections 1-6 asserted :
##   sdn_test_vnet2         net200
##   sdn_test_subnet2       192.168.200.0/24
##   sdn_test_gateway2      192.168.200.1        the gateway the raw create sets
##   sdn_test_gateway2_new  192.168.200.254      the gateway the raw update moves it to
##   sdn_test_vm_netid2     1                    the second card slot, attached then detached
##
## THE PAUSES ARE THE POINT OF THIS SCENARIO AS A DEBUG TOOL
## The chain runs faster than a human can follow in the Proxmox UI, so it STOPS at each of the six
## moments where the state visibly changes, and prints WHERE to look :
##
##   1. the three SDN objects exist and are applied     Datacenter -> SDN
##   2. outgoing NAT is OFF                             the subnet's SNAT box, unticked
##   3. outgoing NAT is back ON                         the same box, ticked
##   4. the VM card is on the vnet                      VM -> Hardware -> Network Device
##   5. the card is back on its original bridge         the same, and the MAC changed again
##   6. everything is gone                              Datacenter -> SDN, empty
##   7. the throwaway network is up                     built by the RAW bundles, one call at a time
##   8. the VM has TWO cards                            attach is additive - the first was left alone
##   9. the throwaway network is gone                   removed one call at a time
##
## `-e sdn_test_pause=0` runs it flat out - which is what a CI would do. A bigger number holds longer.
##
## HOW THE ASSERTIONS SEE THE STATE
## Each check re-READS through the list bundles rather than trusting the facts left by the write : a
## bundle's own reads happened BEFORE it wrote. And the live iptables rules are counted by calling
## reconcile.snat_rules with want=99 - nothing is ever in excess of 99, so nothing is deleted and the
## action becomes a pure counter reporting snat_before.
##

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#### SECTION 0 - PREFLIGHT
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: "debug_sdn_tests - 0 preflight"
  hosts: proxmox
  gather_facts: false
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"
  tasks:
    - name: PREFLIGHT - WHAT THIS RUN WILL DRIVE
      ansible.builtin.debug:
        msg:
          - "proxmox node   : {{ proxmox_node }}"
          - "zone           : {{ sdn_test_zone    | default('r42test') }}"
          - "vnet           : {{ sdn_test_vnet    | default('net199') }}"
          - "subnet         : {{ sdn_test_subnet  | default('192.168.199.0/24') }}"
          - "gateway        : {{ sdn_test_gateway | default('192.168.199.1') }}"
          - "vm             : {{ sdn_test_vm_id   | default(102) }} card net{{ sdn_test_vm_netid | default(0) }}"
          - "card returns to: {{ sdn_test_vm_bridge | default('vmbr0') }}"

    ## The reconciliation step of several bundles is delegated by the role to this group. Asserting it
    ## here turns a late, confusing failure into an immediate and explicit one.
    - name: PREFLIGHT - THE proxmox_cli GROUP MUST EXIST
      ansible.builtin.assert:
        that:
          - (groups['proxmox_cli'] | default([]) | length) > 0
        fail_msg: >-
          the inventory has no proxmox_cli group. The SNAT reconciliation runs iptables ON THE
          HYPERVISOR through it - without it the shell would run on the deployer and report zero rules.
        success_msg: "iptables work will run on {{ groups['proxmox_cli'] | first }}"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#### SECTION 1 - A TEARDOWN FROM AN UNKNOWN STATE MUST SUCCEED
####
#### The chain starts with a teardown, so the scenario is only replayable if removing what is absent
#### is a no-op rather than a failure. This is the check that makes every later run possible.
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.delete.all/main.yml"
  vars:
    BUNDLE_SDN_ZONE: "{{ sdn_test_zone | default('r42test') }}"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.list.sdn_zones/main.yml"

- name: "debug_sdn_tests - 1 check"
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: CHECK 1 - NOTHING IS LEFT IN THE ZONE LIST
      ansible.builtin.assert:
        that:
          - ((network_list_sdn_zones | default([]))
             | selectattr('zone', 'equalto', (sdn_test_zone | default('r42test')))
             | list | length) == 0
        fail_msg: "the zone survived a teardown from an unknown state"
        success_msg: "PASS - a teardown from an unknown state left no zone"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#### SECTION 2 - CREATE BUILDS THE THREE OBJECTS AND APPLIES THEM
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.bootstrap.sdn_vnet/main.yml"
  vars:
    BUNDLE_SDN_ZONE: "{{ sdn_test_zone | default('r42test') }}"
    BUNDLE_SDN_VNET: "{{ sdn_test_vnet | default('net199') }}"
    BUNDLE_SDN_SUBNET_CIDR: "{{ sdn_test_subnet | default('192.168.199.0/24') }}"
    BUNDLE_SDN_SUBNET_GATEWAY: "{{ sdn_test_gateway | default('192.168.199.1') }}"
    BUNDLE_SDN_SUBNET_SNAT: 1

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.list.sdn_zones/main.yml"
- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.list.sdn_vnets/main.yml"
- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.list.sdn_subnets/main.yml"

## want=99 is a pure counter : nothing is ever in excess of 99, so nothing is deleted and the action
## still reports snat_before. Same trick as the devkit test.
- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.reconcile.snat_rules/main.yml"
  vars:
    BUNDLE_SDN_SUBNET_CIDR: "{{ sdn_test_subnet | default('192.168.199.0/24') }}"
    BUNDLE_SDN_SNAT_WANT: 99

- name: "debug_sdn_tests - 2 check"
  hosts: proxmox
  gather_facts: false
  vars:
    _z: "{{ sdn_test_zone   | default('r42test') }}"
    _v: "{{ sdn_test_vnet   | default('net199') }}"
    _c: "{{ sdn_test_subnet | default('192.168.199.0/24') }}"
  tasks:
    - name: CHECK 2 - THE THREE OBJECTS ARE THERE, SNAT ON, EXACTLY ONE LIVE RULE
      ansible.builtin.assert:
        that:
          - ((network_list_sdn_zones   | default([])) | selectattr('zone', 'equalto', _z) | list | length) == 1
          - ((network_list_sdn_vnets   | default([])) | selectattr('vnet', 'equalto', _v) | list | length) == 1
          - ((network_list_sdn_subnets | default([])) | selectattr('subnet_cidr', 'defined')
             | selectattr('subnet_cidr', 'equalto', _c) | list | length) == 1
          - (((network_list_sdn_subnets | selectattr('subnet_cidr', 'defined')
              | selectattr('subnet_cidr', 'equalto', _c) | list | first).subnet_snat | default(0) | int)) == 1
          - (network_delete_extra_snat_rules.snat_before | int) == 1
        fail_msg: >-
          expected zone+vnet+subnet present, snat declared 1, and exactly ONE live rule. Live rules
          counted : {{ network_delete_extra_snat_rules.snat_before | default('?') }}
        success_msg: >-
          PASS - zone, vnet and subnet are up, snat declared on, and
          {{ network_delete_extra_snat_rules.snat_before }} live SNAT rule

- name: "debug_sdn_tests - PAUSE the three SDN objects EXIST and are applied"
  hosts: proxmox
  gather_facts: false
  tasks:
    ## Observation window. The chain runs faster than a human can follow in the Proxmox UI, so it stops
    ## here on purpose. Set -e sdn_test_pause=0 to run it flat out, or a bigger number to look longer.
    - name: "PAUSE - the three SDN objects EXIST and are applied"
      ansible.builtin.debug:
        msg:
          - "==== debug - intentional sleep time - manual check : the three SDN objects EXIST and are applied ===="
          - "Datacenter -> SDN : zone {{ sdn_test_zone | default('r42test') }}"
          - "                     vnet {{ sdn_test_vnet | default('net199') }}, subnet {{ sdn_test_subnet | default('192.168.199.0/24') }}"
          - "no pending marker : the apply already ran"
          - "pausing {{ sdn_test_pause | default(15) }}s - override with -e sdn_test_pause=0"

    - name: "PAUSE - hold"
      ansible.builtin.pause:
        seconds: "{{ sdn_test_pause | default(15) }}"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#### SECTION 3 - CREATE AGAIN IS A CLEAN NO-OP
####
#### Not idempotence in the ansible sense : the writes are skipped by LOOKUP, and the apply is skipped
#### because nothing was written. What matters is that it neither fails nor duplicates.
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.bootstrap.sdn_vnet/main.yml"
  vars:
    BUNDLE_SDN_ZONE: "{{ sdn_test_zone | default('r42test') }}"
    BUNDLE_SDN_VNET: "{{ sdn_test_vnet | default('net199') }}"
    BUNDLE_SDN_SUBNET_CIDR: "{{ sdn_test_subnet | default('192.168.199.0/24') }}"
    BUNDLE_SDN_SUBNET_GATEWAY: "{{ sdn_test_gateway | default('192.168.199.1') }}"
    BUNDLE_SDN_SUBNET_SNAT: 1

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.reconcile.snat_rules/main.yml"
  vars:
    BUNDLE_SDN_SUBNET_CIDR: "{{ sdn_test_subnet | default('192.168.199.0/24') }}"
    BUNDLE_SDN_SNAT_WANT: 99

- name: "debug_sdn_tests - 3 check"
  hosts: proxmox
  gather_facts: false
  tasks:
    ## The bundle's own diff facts are the evidence : all three empty means it recognised everything as
    ## already present and wrote nothing.
    - name: CHECK 3 - THE THREE WRITES WERE SKIPPED, AND STILL ONE LIVE RULE
      ansible.builtin.assert:
        that:
          - (_sdn1_zone_absent   | length) == 0
          - (_sdn1_vnet_absent   | length) == 0
          - (_sdn1_subnet_absent | length) == 0
          - (network_delete_extra_snat_rules.snat_before | int) == 1
        fail_msg: >-
          a second create was not a no-op. zone={{ _sdn1_zone_absent | default('?') }}
          vnet={{ _sdn1_vnet_absent | default('?') }} subnet={{ _sdn1_subnet_absent | default('?') }}
          live rules={{ network_delete_extra_snat_rules.snat_before | default('?') }}
        success_msg: "PASS - the three writes were skipped, and the rule count did not climb"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#### SECTION 4 - THE OUTGOING NAT SWITCH, OFF THEN ON THEN TOGGLED TWICE
####
#### This is the path that ORPHANS a rule if the reconciliation is skipped : snat=0 removes the
#### post-down hook BEFORE that hook ever runs. So it is the live COUNT that proves the cut, never the
#### declaration - which is why every check below reads both.
####
#### The subnet id is read back from the cluster rather than derived : a zone name may contain dashes,
#### and this is exactly the value the internet_* bundles address.
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.list.sdn_subnets/main.yml"

- name: "debug_sdn_tests - 4 resolve the subnet id"
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: SECTION 4 - READ THE REAL SUBNET ID BACK
      ansible.builtin.set_fact:
        _t_subnet_id: >-
          {%- set m = (network_list_sdn_subnets | default([]))
                      | selectattr('subnet_cidr', 'defined')
                      | selectattr('subnet_cidr', 'equalto', (sdn_test_subnet | default('192.168.199.0/24')))
                      | list -%}
          {{ (m | first).subnet if (m | length) > 0 else '' }}

    - name: SECTION 4 - REFUSE TO CONTINUE WITHOUT IT
      ansible.builtin.assert:
        that: ["(_t_subnet_id | length) > 0"]
        fail_msg: "no subnet matching {{ sdn_test_subnet | default('192.168.199.0/24') }} on the cluster"
        success_msg: "subnet id = {{ _t_subnet_id }}"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.internet_off/main.yml"
  vars:
    BUNDLE_SDN_SUBNET_ID: "{{ _t_subnet_id }}"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.list.sdn_subnets/main.yml"
- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.reconcile.snat_rules/main.yml"
  vars:
    BUNDLE_SDN_SUBNET_CIDR: "{{ sdn_test_subnet | default('192.168.199.0/24') }}"
    BUNDLE_SDN_SNAT_WANT: 99

- name: "debug_sdn_tests - 4a check internet OFF"
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: CHECK 4a - DECLARATION SAYS OFF, AND NO LIVE RULE SURVIVES
      ansible.builtin.assert:
        that:
          - (((network_list_sdn_subnets | selectattr('subnet', 'equalto', _t_subnet_id)
              | list | first).subnet_snat | default(0) | int)) == 0
          - (network_delete_extra_snat_rules.snat_before | int) == 0
        fail_msg: >-
          internet_off left snat={{ (network_list_sdn_subnets | selectattr('subnet','equalto',_t_subnet_id)
          | list | first).subnet_snat | default('unset') }} and
          {{ network_delete_extra_snat_rules.snat_before }} live rule(s) - an orphaned rule is exactly
          what the reconciliation exists to prevent
        success_msg: "PASS - snat declared off, zero live rule"

- name: "debug_sdn_tests - PAUSE outgoing NAT is OFF"
  hosts: proxmox
  gather_facts: false
  tasks:
    ## Observation window. The chain runs faster than a human can follow in the Proxmox UI, so it stops
    ## here on purpose. Set -e sdn_test_pause=0 to run it flat out, or a bigger number to look longer.
    - name: "PAUSE - outgoing NAT is OFF"
      ansible.builtin.debug:
        msg:
          - "==== debug - intentional sleep time - manual check : outgoing NAT is OFF ===="
          - "Datacenter -> SDN -> VNets -> {{ sdn_test_vnet | default('net199') }} -> subnet : SNAT is now unticked"
          - "and ZERO live iptables rule - the direction that orphans a rule when nobody reconciles"
          - "pausing {{ sdn_test_pause | default(15) }}s - override with -e sdn_test_pause=0"

    - name: "PAUSE - hold"
      ansible.builtin.pause:
        seconds: "{{ sdn_test_pause | default(15) }}"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.internet_on/main.yml"
  vars:
    BUNDLE_SDN_SUBNET_ID: "{{ _t_subnet_id }}"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.list.sdn_subnets/main.yml"
- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.reconcile.snat_rules/main.yml"
  vars:
    BUNDLE_SDN_SUBNET_CIDR: "{{ sdn_test_subnet | default('192.168.199.0/24') }}"
    BUNDLE_SDN_SNAT_WANT: 99

- name: "debug_sdn_tests - 4b check internet ON"
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: CHECK 4b - DECLARATION SAYS ON, AND EXACTLY ONE LIVE RULE
      ansible.builtin.assert:
        that:
          - (((network_list_sdn_subnets | selectattr('subnet', 'equalto', _t_subnet_id)
              | list | first).subnet_snat | default(0) | int)) == 1
          - (network_delete_extra_snat_rules.snat_before | int) == 1
        fail_msg: "internet_on left {{ network_delete_extra_snat_rules.snat_before }} live rule(s), expected 1"
        success_msg: "PASS - snat declared on, exactly one live rule"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.internet_toggle/main.yml"
  vars:
    BUNDLE_SDN_SUBNET_ID: "{{ _t_subnet_id }}"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.list.sdn_subnets/main.yml"
- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.reconcile.snat_rules/main.yml"
  vars:
    BUNDLE_SDN_SUBNET_CIDR: "{{ sdn_test_subnet | default('192.168.199.0/24') }}"
    BUNDLE_SDN_SNAT_WANT: 99

- name: "debug_sdn_tests - 4c check toggle flipped it OFF"
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: CHECK 4c - THE TOGGLE READ 1 AND WROTE 0, AND THE LIVE RULE FOLLOWED
      ansible.builtin.assert:
        that:
          - (((network_list_sdn_subnets | selectattr('subnet', 'equalto', _t_subnet_id)
              | list | first).subnet_snat | default(0) | int)) == 0
          - (network_delete_extra_snat_rules.snat_before | int) == 0
        fail_msg: "the toggle did not flip 1 -> 0, or the live rule did not follow"
        success_msg: "PASS - toggle flipped it off, and the live rule followed"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.internet_toggle/main.yml"
  vars:
    BUNDLE_SDN_SUBNET_ID: "{{ _t_subnet_id }}"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.list.sdn_subnets/main.yml"
- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.reconcile.snat_rules/main.yml"
  vars:
    BUNDLE_SDN_SUBNET_CIDR: "{{ sdn_test_subnet | default('192.168.199.0/24') }}"
    BUNDLE_SDN_SNAT_WANT: 99

- name: "debug_sdn_tests - 4d check toggle flipped it back ON"
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: CHECK 4d - THE TOGGLE READ 0 AND WROTE 1, AND THE LIVE RULE FOLLOWED
      ansible.builtin.assert:
        that:
          - (((network_list_sdn_subnets | selectattr('subnet', 'equalto', _t_subnet_id)
              | list | first).subnet_snat | default(0) | int)) == 1
          - (network_delete_extra_snat_rules.snat_before | int) == 1
        fail_msg: "the toggle did not flip 0 -> 1, or the live rule did not follow"
        success_msg: "PASS - toggle flipped it back on, and the live rule followed"

- name: "debug_sdn_tests - PAUSE outgoing NAT is back ON"
  hosts: proxmox
  gather_facts: false
  tasks:
    ## Observation window. The chain runs faster than a human can follow in the Proxmox UI, so it stops
    ## here on purpose. Set -e sdn_test_pause=0 to run it flat out, or a bigger number to look longer.
    - name: "PAUSE - outgoing NAT is back ON"
      ansible.builtin.debug:
        msg:
          - "==== debug - intentional sleep time - manual check : outgoing NAT is back ON ===="
          - "Datacenter -> SDN -> VNets -> {{ sdn_test_vnet | default('net199') }} -> subnet : SNAT is ticked again"
          - "and exactly ONE live iptables rule - never two, which is what the reconciliation guarantees"
          - "pausing {{ sdn_test_pause | default(15) }}s - override with -e sdn_test_pause=0"

    - name: "PAUSE - hold"
      ansible.builtin.pause:
        seconds: "{{ sdn_test_pause | default(15) }}"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#### SECTION 5 - MOVE A VM CARD ONTO THE VNET, AND BACK
####
#### THE ONLY DESTRUCTIVE SECTION ON THE VM. The card is deleted and recreated by the role, so ITS MAC
#### CHANGES - twice over the round trip. Never point this scenario at a VM you reach THROUGH that card.
####
#### The round trip is not politeness : Proxmox REFUSES to delete a vnet that still carries a VM card,
#### so only a returned card lets section 6 assert a complete teardown.
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/vm.list.interfaces/main.yml"
  vars:
    BUNDLE_VM_ID: "{{ sdn_test_vm_id | default(102) }}"

- name: "debug_sdn_tests - 5 preflight on the VM"
  hosts: proxmox
  gather_facts: false
  tasks:
    ## vm_vmnet_id is the id a delete or a replace ADDRESSES. Its absence from this output was a real
    ## defect (PXC #124/#125), so asserting it here is what stops it coming back.
    - name: CHECK 5 - THE CARD EXISTS AND THE LIST CARRIES ITS ID
      ansible.builtin.assert:
        that:
