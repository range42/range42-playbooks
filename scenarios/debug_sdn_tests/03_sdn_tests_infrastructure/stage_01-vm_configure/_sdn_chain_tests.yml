#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#### SECTION 7 - THE ELEVEN BUNDLES THE SIX SECTIONS ABOVE NEVER EXECUTE
####
#### Sections 1 to 6 exercise 11 of the 22 bundles directly. The other 11 have their PXC ACTIONS
#### exercised through the composites, but their own main.yml never runs - so their parameter bridging,
#### their guards and their refusals are never proven. `vm.attach` and `vm.detach` are not even reached
#### indirectly.
####
#### This section closes that, on a SECOND throwaway vnet (default net200 / 192.168.200.0/24) so it
#### cannot disturb anything the earlier sections asserted. It starts from nothing : section 6 tore the
#### zone down.
####
#### It also proves two things the READMEs CLAIM and nothing verified :
####   - a raw create is NOT idempotent - a second one answers 500 "already defined". Asserted through
####     a block/rescue, so the expected failure is caught rather than fatal.
####   - what a raw action writes stays PENDING until apply. Asserted by reading BEFORE the apply.
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: "debug_sdn_tests - 7 preflight"
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: SECTION 7 - WHAT THE RAW BUNDLES WILL BUILD
      ansible.builtin.debug:
        msg:
          - "throwaway vnet   : {{ sdn_test_vnet2   | default('net200') }}"
          - "throwaway subnet : {{ sdn_test_subnet2 | default('192.168.200.0/24') }}"
          - "second card slot : net{{ sdn_test_vm_netid2 | default(1) }} on vm {{ sdn_test_vm_id | default(102) }}"
          - "this section exercises the 11 bundles sections 1-6 never run"

#### 7a - the three RAW creates, in the order Proxmox imposes

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.create.sdn_zone/main.yml"
  vars:
    BUNDLE_SDN_ZONE: "{{ sdn_test_zone | default('r42test') }}"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.create.sdn_vnet/main.yml"
  vars:
    BUNDLE_SDN_ZONE: "{{ sdn_test_zone  | default('r42test') }}"
    BUNDLE_SDN_VNET: "{{ sdn_test_vnet2 | default('net200') }}"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.create.sdn_subnet/main.yml"
  vars:
    BUNDLE_SDN_VNET: "{{ sdn_test_vnet2 | default('net200') }}"
    BUNDLE_SDN_SUBNET_CIDR: "{{ sdn_test_subnet2 | default('192.168.200.0/24') }}"
    BUNDLE_SDN_SUBNET_GATEWAY: "{{ sdn_test_gateway2 | default('192.168.200.1') }}"
    BUNDLE_SDN_SUBNET_SNAT: 1

#### 7b - BEFORE any apply : the objects must exist AND be marked pending

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.list.sdn_subnets/main.yml"

- name: "debug_sdn_tests - 7b check the write is PENDING, not live"
  hosts: proxmox
  gather_facts: false
  vars:
    _c2: "{{ sdn_test_subnet2 | default('192.168.200.0/24') }}"
  tasks:
    ## The claim every raw bundle's README makes : what it writes stays pending until apply. This is the
    ## only place it is checked. `subnet_pending` is ABSENT when the API does not return it - hence the
    ## default() rather than a bare comparison.
    - name: CHECK 7b - THE SUBNET EXISTS AND CARRIES A PENDING MARKER
      ansible.builtin.assert:
        that:
          - ((network_list_sdn_subnets | default([])) | selectattr('subnet_cidr', 'defined')
             | selectattr('subnet_cidr', 'equalto', _c2) | list | length) == 1
          - ((network_list_sdn_subnets | selectattr('subnet_cidr', 'defined')
             | selectattr('subnet_cidr', 'equalto', _c2) | list | first).subnet_pending | default('')) != ''
        fail_msg: >-
          the subnet is not there, or it carries no pending marker - which would mean a raw create
          reaches the running config on its own, contradicting what every raw bundle documents. Entry
          read back :
          {{ (network_list_sdn_subnets | selectattr('subnet_cidr','defined')
              | selectattr('subnet_cidr','equalto',_c2) | list | first) | default('<absent>') }}
        success_msg: "PASS - written and PENDING, exactly as the raw bundles claim"

#### 7c - a second RAW create must FAIL. The README says 500 "already defined" ; nothing proved it.

- name: "debug_sdn_tests - 7c check a raw create is NOT idempotent"
  hosts: proxmox
  gather_facts: false
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"
  tasks:
    - name: CHECK 7c - REPLAYING A RAW ZONE CREATE
      block:
        - name: CHECK 7c - the create that must be refused
          include_role:
            name: range42-ansible_roles-proxmox_controller
          vars:
            proxmox_vm_action: "network_add_sdn_zone"
            sdn_zone: "{{ sdn_test_zone | default('r42test') }}"

        - name: CHECK 7c - IT DID NOT FAIL, WHICH CONTRADICTS THE DOCUMENTATION
          ansible.builtin.fail:
            msg: >-
              a second raw create SUCCEEDED. Every raw bundle's README states it answers
              500 "already defined" and tells the caller to look the object up first or use a composite.
              Either Proxmox changed, or that documentation is now wrong.
      rescue:
        - name: CHECK 7c - REFUSED, AS DOCUMENTED
          ansible.builtin.debug:
            msg: "PASS - a second raw create is refused, so the composites' lookup is not optional"

#### 7d - RAW apply, then the objects must no longer be pending

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.apply/main.yml"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.list.sdn_subnets/main.yml"

- name: "debug_sdn_tests - 7d check the apply cleared the pending state"
  hosts: proxmox
  gather_facts: false
  vars:
    _c2: "{{ sdn_test_subnet2 | default('192.168.200.0/24') }}"
  tasks:
    - name: CHECK 7d - NO PENDING MARKER LEFT
      ansible.builtin.assert:
        that:
          - ((network_list_sdn_subnets | selectattr('subnet_cidr', 'defined')
             | selectattr('subnet_cidr', 'equalto', _c2) | list | first).subnet_pending | default('')) == ''
        fail_msg: "the apply ran but the subnet is still pending - the UPID poll returned too early"
        success_msg: "PASS - the raw apply cleared the pending state"

- name: "debug_sdn_tests - PAUSE the throwaway network is up, built by the RAW bundles"
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: "PAUSE - the throwaway network is up, built by the RAW bundles"
      ansible.builtin.debug:
        msg:
          - "==== debug - intentional sleep time - manual check : the throwaway network is up ===="
          - "Datacenter -> SDN : vnet {{ sdn_test_vnet2 | default('net200') }} and its subnet, alongside the main one"
          - "built one API call at a time, then applied once - no composite involved"
          - "pausing {{ sdn_test_pause | default(15) }}s - override with -e sdn_test_pause=0"
    - name: "PAUSE - hold"
      ansible.builtin.pause:
        seconds: "{{ sdn_test_pause | default(15) }}"

#### 7e - RAW update on the throwaway subnet : the gateway, which the internet_* bundles never touch

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.list.sdn_subnets/main.yml"

- name: "debug_sdn_tests - 7e resolve the throwaway subnet id"
  hosts: proxmox
  gather_facts: false
  tasks:
    ## Read back rather than derived. The derivation would work here, but a write addressed by a computed
    ## value is exactly what this family avoids - and the chain should not model what the bundles refuse.
    - name: SECTION 7e - READ THE THROWAWAY SUBNET ID
      ansible.builtin.set_fact:
        _t2_subnet_id: >-
          {%- set m = (network_list_sdn_subnets | default([]))
                      | selectattr('subnet_cidr', 'defined')
                      | selectattr('subnet_cidr', 'equalto', (sdn_test_subnet2 | default('192.168.200.0/24')))
                      | list -%}
          {{ (m | first).subnet if (m | length) > 0 else '' }}

    - name: SECTION 7e - REFUSE TO CONTINUE WITHOUT IT
      ansible.builtin.assert:
        that: ["(_t2_subnet_id | length) > 0"]
        fail_msg: "no subnet matching {{ sdn_test_subnet2 | default('192.168.200.0/24') }} - 7a did not land"
        success_msg: "throwaway subnet id = {{ _t2_subnet_id }}"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.update.sdn_subnet/main.yml"
  vars:
    BUNDLE_SDN_VNET: "{{ sdn_test_vnet2 | default('net200') }}"
    BUNDLE_SDN_SUBNET_ID: "{{ _t2_subnet_id }}"
    BUNDLE_SDN_SUBNET_GATEWAY: "{{ sdn_test_gateway2_new | default('192.168.200.254') }}"
    BUNDLE_SDN_SUBNET_SNAT: 1

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.apply/main.yml"
- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.list.sdn_subnets/main.yml"

- name: "debug_sdn_tests - 7e check the gateway changed"
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: CHECK 7e - THE RAW UPDATE MOVED THE GATEWAY, AND LEFT SNAT ALONE
      ansible.builtin.assert:
        that:
          - ((network_list_sdn_subnets | selectattr('subnet', 'equalto', _t2_subnet_id)
             | list | first).subnet_gateway | default('')) == (sdn_test_gateway2_new | default('192.168.200.254'))
          - (((network_list_sdn_subnets | selectattr('subnet', 'equalto', _t2_subnet_id)
             | list | first).subnet_snat | default(0) | int)) == 1
        fail_msg: >-
          the gateway did not move, or the update collaterally changed snat. Read back :
          {{ (network_list_sdn_subnets | selectattr('subnet','equalto',_t2_subnet_id) | list | first) }}
        success_msg: >-
          PASS - gateway is now
          {{ (network_list_sdn_subnets | selectattr('subnet','equalto',_t2_subnet_id) | list | first).subnet_gateway }},
          and snat is untouched - which is why internet_on/off do not resend the gateway

#### 7f - sdn_network.bootstrap, on a ONE-ENTRY list. It must recognise what the RAW bundles built and
####      write NOTHING. That is its diff-by-lookup, proven against a state a composite did not create.
####      Its input is the data model of T-15, but a one-entry list needs no data model to exist.

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.bootstrap/main.yml"
  vars:
    BUNDLE_SDN_ZONE: "{{ sdn_test_zone | default('r42test') }}"
    BUNDLE_SDN_VNETS:
      - vnet: "{{ sdn_test_vnet2 | default('net200') }}"
        subnet: "{{ sdn_test_subnet2 | default('192.168.200.0/24') }}"
        gateway: "{{ sdn_test_gateway2_new | default('192.168.200.254') }}"
        snat: true

- name: "debug_sdn_tests - 7f check bootstrap recognised everything"
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: CHECK 7f - THE FOUR DIFF LISTS ARE EMPTY
      ansible.builtin.assert:
        that:
          - (_sdn_zones_absent    | length) == 0
          - (_sdn_vnets_absent    | length) == 0
          - (_sdn_subnets_absent  | length) == 0
          - (_sdn_subnets_drifted | length) == 0
        fail_msg: >-
          bootstrap wanted to write something on a state that already matches. zone={{ _sdn_zones_absent }}
          vnets={{ _sdn_vnets_absent | map(attribute='vnet') | list }}
          subnets={{ _sdn_subnets_absent | map(attribute='subnet') | list }}
          drifted={{ _sdn_subnets_drifted | map(attribute='subnet_id') | list }}
        success_msg: >-
          PASS - bootstrap recognised the objects the RAW bundles built, wrote nothing, and skipped its
          apply. Its diff works against a state no composite created.

#### 7g - vm.attach on a SECOND slot. The only two bundles sections 1-6 never reach, even indirectly.

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/vm.attach.sdn_vnet/main.yml"
  vars:
    BUNDLE_VM_ID: "{{ sdn_test_vm_id | default(102) }}"
    BUNDLE_VM_VMNET_ID: "{{ sdn_test_vm_netid2 | default(1) }}"
    BUNDLE_VM_IFACE_BRIDGE: "{{ sdn_test_vnet2 | default('net200') }}"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/vm.list.interfaces/main.yml"
  vars:
    BUNDLE_VM_ID: "{{ sdn_test_vm_id | default(102) }}"

- name: "debug_sdn_tests - 7g check the second card exists, and the first is untouched"
  hosts: proxmox
  gather_facts: false
  vars:
    _n1: "{{ sdn_test_vm_netid  | default(0) | int }}"
    _n2: "{{ sdn_test_vm_netid2 | default(1) | int }}"
  tasks:
    ## attach is ADDITIVE - that is its whole contract versus replace. So the first card must still be on
    ## the bridge section 5 returned it to.
    - name: CHECK 7g - TWO CARDS, THE NEW ONE ON THE THROWAWAY VNET
      ansible.builtin.assert:
        that:
          - ((network_list_interfaces_vm | selectattr('vm_vmnet_id','equalto',_n2) | list | first).vm_network_bridge)
            == (sdn_test_vnet2 | default('net200'))
          - ((network_list_interfaces_vm | selectattr('vm_vmnet_id','equalto',_n1) | list | first).vm_network_bridge)
            == (sdn_test_vm_bridge | default('vmbr0'))
        fail_msg: >-
          attach did not add net{{ _n2 }} on {{ sdn_test_vnet2 | default('net200') }}, or it disturbed
          net{{ _n1 }} - which would break its additive contract. Cards :
          {{ network_list_interfaces_vm | map(attribute='vm_network_device') | list }}
        success_msg: >-
          PASS - net{{ _n2 }} added on {{ sdn_test_vnet2 | default('net200') }}, and net{{ _n1 }} is
          untouched on {{ sdn_test_vm_bridge | default('vmbr0') }} - attach is additive, as documented

- name: "debug_sdn_tests - PAUSE the VM now has TWO cards"
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: "PAUSE - the VM now has TWO cards"
      ansible.builtin.debug:
        msg:
          - "==== debug - intentional sleep time - manual check : the VM has TWO cards ===="
          - "VM {{ sdn_test_vm_id | default(102) }} -> Hardware :"
          - "   net{{ sdn_test_vm_netid  | default(0) }} on {{ sdn_test_vm_bridge | default('vmbr0') }}"
          - "   net{{ sdn_test_vm_netid2 | default(1) }} on {{ sdn_test_vnet2 | default('net200') }}"
          - "the first card was NOT touched - that is what makes attach different from replace"
          - "pausing {{ sdn_test_pause | default(15) }}s - override with -e sdn_test_pause=0"
    - name: "PAUSE - hold"
      ansible.builtin.pause:
        seconds: "{{ sdn_test_pause | default(15) }}"

#### 7h - vm.detach that second slot. Also what FREES the vnet for the teardown below.

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/vm.detach.sdn_vnet/main.yml"
  vars:
    BUNDLE_VM_ID: "{{ sdn_test_vm_id | default(102) }}"
    BUNDLE_VM_VMNET_ID: "{{ sdn_test_vm_netid2 | default(1) }}"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/vm.list.interfaces/main.yml"
  vars:
    BUNDLE_VM_ID: "{{ sdn_test_vm_id | default(102) }}"

- name: "debug_sdn_tests - 7h check the second card is gone"
  hosts: proxmox
  gather_facts: false
  vars:
    _n1: "{{ sdn_test_vm_netid  | default(0) | int }}"
    _n2: "{{ sdn_test_vm_netid2 | default(1) | int }}"
  tasks:
    - name: CHECK 7h - THE SECOND CARD IS GONE, THE FIRST STILL THERE
      ansible.builtin.assert:
        that:
          - ((network_list_interfaces_vm | default([])) | selectattr('vm_vmnet_id','equalto',_n2) | list | length) == 0
          - ((network_list_interfaces_vm | default([])) | selectattr('vm_vmnet_id','equalto',_n1) | list | length) == 1
        fail_msg: >-
          detach left net{{ _n2 }} behind, or removed the wrong card. Cards :
          {{ network_list_interfaces_vm | map(attribute='vm_network_device') | list }}
        success_msg: "PASS - net{{ _n2 }} removed, net{{ _n1 }} untouched - the vnet is free for the teardown"

#### 7i - the three RAW deletes, in the order Proxmox imposes : subnet, then vnet, then zone.
####      A vnet still holding a subnet cannot go, nor a zone still holding a vnet - so if the order were
####      wrong this section would fail on the second delete, not on the first.

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.delete.sdn_subnet/main.yml"
  vars:
    BUNDLE_SDN_VNET: "{{ sdn_test_vnet2 | default('net200') }}"
    BUNDLE_SDN_SUBNET_ID: "{{ _t2_subnet_id }}"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.delete.sdn_vnet/main.yml"
  vars:
    BUNDLE_SDN_VNET: "{{ sdn_test_vnet2 | default('net200') }}"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.delete.sdn_zone/main.yml"
  vars:
    BUNDLE_SDN_ZONE: "{{ sdn_test_zone | default('r42test') }}"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.apply/main.yml"

#### 7j - and the live rule, which the deletes cannot remove by themselves. Deleting a subnet takes its
####      post-down hook away BEFORE that hook ever runs, so its MASQUERADE rule outlives it. want=0.

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.reconcile.snat_rules/main.yml"
  vars:
    BUNDLE_SDN_SUBNET_CIDR: "{{ sdn_test_subnet2 | default('192.168.200.0/24') }}"
    BUNDLE_SDN_SNAT_WANT: 0

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.list.sdn_zones/main.yml"
- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.list.sdn_vnets/main.yml"
- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.list.sdn_subnets/main.yml"
- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.reconcile.snat_rules/main.yml"
  vars:
    BUNDLE_SDN_SUBNET_CIDR: "{{ sdn_test_subnet2 | default('192.168.200.0/24') }}"
    BUNDLE_SDN_SNAT_WANT: 99

- name: "debug_sdn_tests - 7j check the raw deletes left nothing"
  hosts: proxmox
  gather_facts: false
  vars:
    _z:  "{{ sdn_test_zone     | default('r42test') }}"
    _v2: "{{ sdn_test_vnet2    | default('net200') }}"
    _c2: "{{ sdn_test_subnet2  | default('192.168.200.0/24') }}"
  tasks:
    - name: CHECK 7j - ZONE, VNET AND SUBNET GONE, AND NO RULE OUTLIVED THEM
      ansible.builtin.assert:
        that:
          - ((network_list_sdn_zones   | default([])) | selectattr('zone', 'equalto', _z)  | list | length) == 0
          - ((network_list_sdn_vnets   | default([])) | selectattr('vnet', 'equalto', _v2) | list | length) == 0
          - ((network_list_sdn_subnets | default([])) | selectattr('subnet_cidr', 'defined')
             | selectattr('subnet_cidr', 'equalto', _c2) | list | length) == 0
          - (network_delete_extra_snat_rules.snat_before | int) == 0
        fail_msg: >-
          the raw deletes left something behind, or a rule survived. Live rules still matching
          {{ _c2 }} : {{ network_delete_extra_snat_rules.snat_before }}
        success_msg: "PASS - the raw deletes left nothing, and no rule outlived its declaration"

- name: "debug_sdn_tests - PAUSE the throwaway network is GONE, removed one call at a time"
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: "PAUSE - the throwaway network is GONE"
      ansible.builtin.debug:
        msg:
          - "==== debug - intentional sleep time - manual check : the throwaway network is GONE ===="
          - "Datacenter -> SDN : nothing left - not the vnet, not the subnet, not the zone"
          - "removed one API call at a time, in the order Proxmox imposes, then applied"
          - "pausing {{ sdn_test_pause | default(15) }}s - override with -e sdn_test_pause=0"
    - name: "PAUSE - hold"
      ansible.builtin.pause:
        seconds: "{{ sdn_test_pause | default(15) }}"

- name: "debug_sdn_tests - all 22 bundles exercised"
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: EVERY BUNDLE OF THE FAMILY HAS NOW RUN
      ansible.builtin.debug:
        msg:
          - "sections 1-6 : the chain of the devkit test 07, through the composites"
          - "section 7    : the 11 bundles that chain never executes - the three raw creates, the raw"
          - "               update, the three raw deletes, the raw apply, bootstrap on a one-entry list,"
          - "               and vm.attach / vm.detach, which sections 1-6 never reach even indirectly"
          - ""
          - "and three claims the READMEs make, proven rather than asserted :"
          - "  a raw write stays PENDING until apply"
          - "  a second raw create is REFUSED - so the composites' lookup is not optional"
          - "  attach is ADDITIVE - it left the first card alone"
          - ""
          - "vm {{ sdn_test_vm_id | default(102) }} is back to one card on {{ sdn_test_vm_bridge | default('vmbr0') }}"
          - "NOTE its MAC changed twice - a DHCP reservation or a firewall alias keyed on the old one will not follow"
