#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#### SECTION 6 - TEARDOWN LEAVES NOTHING, AND REPLAYS CLEANLY
####
#### Deleting a subnet removes its post-down hook BEFORE that hook ever runs, so the live rule outlives
#### the object that declared it. want=0 is what closes that, and it is the count - not the empty
#### object list - that proves it.
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/sdn_network.delete.all/main.yml"
