##
## stage_01 — software install for lan1-apt-cache-00
## catalog roles are referenced BY NAME (resolved via ANSIBLE_ROLES_PATH at deploy);
## one play per attachment so each carries its own params (firewall_rules, docker …).
##

- name: "lan1-apt-cache-00 — software.configure.firewalls"
  hosts: r42.lan1-apt-cache-00
  become: true
  vars_files:
    - "../../secrets/default_vault.yml"
  vars:
    firewall_rules:
    - ip: all
      port: 22
      protocol: tcp
    - ip: all
      port: 3142
      protocol: tcp
  roles:
    - software.configure.firewalls

- name: "lan1-apt-cache-00 — software.install.warmup.basic_packages"
  hosts: r42.lan1-apt-cache-00
  become: true
  vars_files:
    - "../../secrets/default_vault.yml"
  roles:
    - software.install.warmup.basic_packages

- name: "lan1-apt-cache-00 — software.install.apt_cacher_ng"
  hosts: r42.lan1-apt-cache-00
  become: true
  vars_files:
    - "../../secrets/default_vault.yml"
  vars:
    apt_cacher_bind_address: 0.0.0.0
    apt_cacher_cache_dir: /var/cache/apt-cacher-ng
    apt_cacher_log_dir: /var/log/apt-cacher-ng
    apt_cacher_passthrough: true
    apt_cacher_port: 3142
  roles:
    - software.install.apt_cacher_ng
