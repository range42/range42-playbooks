##
## misp_lab_bundles stage_01 - baseline on admin-misp-standalone
##
## Group-level baseline applied to r42_misp_lab_group (admin-misp-standalone).
## Mirrors the catalog_try / pre-bundle pattern : basics + dotfiles + firewall.
## INSTALL_PACKAGES_UTILS_JSON is flipped to YES (jq is needed for MISP
## related tooling and for the operator workflow inside the VM).
##
## The misp-standalone docker-compose stack deploy is in a sibling file
## misp-standalone.yml (thin wrapper to bundles/admin/software.install.misp-standalone/).
## Imported via 03_misp_lab_infrastructure/_main_stage_01.yml.
##
## Note : the bundle also installs Docker baseline on its first play, but
## this baseline plays first to ensure firewall + utils are present even
## when running the tier in isolation (devkit). Basics install is idempotent
## so the bundle's docker install is a no-op on subsequent runs.
##

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: install basics packages
  hosts: r42_misp_lab_group
  become: true
  roles:
    - software.install.warmup.basic_packages

  vars:
    INSTALL_PACKAGES_BASICS: "YES"
    INSTALL_PACKAGES_FIREWALLS: "YES"
    #
    INSTALL_PACKAGES_DOCKER: "YES"
    INSTALL_PACKAGES_DOCKER_COMPOSE: "YES"
    #
    INSTALL_PACKAGES_UTILS_JSON: "YES"
    INSTALL_PACKAGES_UTILS_NETWORK: "YES"

    INSTALL_PACKAGES_NTP_AND_UPDATE_TIME: "YES"

    SPECIFIC_PACKAGES_CLEANING: "NO"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: install dot files
  hosts: r42_misp_lab_group
  become: true
  roles:
    - software.install.warmup.dot_files

  vars:
    OPERATOR_USER: alice
    INSTALL_VIM_DOTFILES: "YES"
    INSTALL_ZSH_DOTFILES: "YES"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: configure firewall - all
  become: true
  hosts: r42_misp_lab_group
  roles:
    - software.configure.firewalls

  vars:
    firewall_rules:
      - ip: "all"
        port: 22
        protocol: "tcp"
      - ip: "all"
        port: 80
        protocol: "tcp"
      - ip: "all"
        port: 443
        protocol: "tcp"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
