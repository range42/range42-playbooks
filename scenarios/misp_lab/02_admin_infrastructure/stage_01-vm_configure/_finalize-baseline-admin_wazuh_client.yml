##
## _finalize-baseline-admin_wazuh_client - cross-tier post-setup action
##
## Installs the wazuh agent on the misp_lab wazuh clients group
## (admin-misp-standalone, the misp lab workload VM).
##
## Ordering constraints (TWO independent deps - both must be satisfied) :
##   1. AFTER admin-wazuh.yml (tier 02 stage_01) : the wazuh server must
##      exist + be reachable so the agent can enroll with the manager.
##   2. AFTER tier 03 stage_01 : admin-misp-standalone must already be
##      created (stage_00) AND baselined (stage_01). Otherwise the agent
##      install hits UNREACHABLE.
##
## Both constraints satisfied by importing this file at the TOP-LEVEL main.yml
## as the LAST entry, AFTER all tier _main_stage_01.yml imports. NEVER import
## from inside a tier's _main.yml / _main_stage_01.yml - that would
## re-introduce the cross-tier ordering bug.
##
## Group-level scope : targets r42_misp_lab_wazuh_clients_active (runtime
## group built by _build_wazuh_clients_active_group.yml ; always contains
## admin-misp-standalone - workload VM, always created).
##
## Gated by INSTALL_WAZUH (default NO).
##

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/admin/software.install.wazuh_agent/main.yml"
  when: INSTALL_WAZUH | default("NO") | upper == "YES"
  vars:
    wazuh_clients_group: "r42_misp_lab_wazuh_clients_active"
    global_vm_ci_ip:     "192.168.142.187"
