---
##
## 01 - template bootstrap
##
## Idempotent template provisioning :
##   1. Download the cloud-init source files (the cicustom + apt-proxy snippets
##      used by every Ubuntu Noble template at first boot).
##   2. Build the Ubuntu Noble medium-02 template (VMID 9232) only - used by
##      admin-misp-standalone (always) + optional admin-wazuh (INSTALL_WAZUH=YES).
##
## Both imports resolve via `RANGE42_GITDIR__ROOT_DIR` (exported by the workspace's
## `sourced_range42.sh`) so the call-site path is invariant.
##

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/cloud_init_image.download.all/main.yml"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/template.build.ubuntu_noble/main.yml"
  vars:
    manifest_path:       "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/scenarios/misp_lab/manifest/scenario_vms.json"
    template_bundle_dir: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/template.build.ubuntu_noble"
    templates_whitelist: ["medium-02"]
