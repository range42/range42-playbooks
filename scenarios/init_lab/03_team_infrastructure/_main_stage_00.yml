---
##
## 03 - team infrastructure - stage_00 (vm_bootstrap)
##
## Structure : stage_00 unit imported by top-level main.yml ; split kept so global stage ordering (all stage_00 before all stage_01) stays editable.
##
## Provisions the 5 init VMs across 2 subnets (the init VMs are the team tier of this scenario) :
##   - subnet 143 (net143) : init-vm-00, init-vm-01, init-vm-02
##   - subnet 144 (net144) : init-vm-03, init-vm-04
##

# --- subnet 143 (net143) ---
- import_playbook: ./stage_00-vm_bootstrap/init_vm_00.yml
  vars:
    global_vm_name: "init-vm-00"
    global_vm_ssh_name: "r42.init-vm-00"
    global_vm_id: 900
    global_vm_description: "init - team 143 - box 00"
    global_vm_tag_name: "init"
    global_vm_ci_ip: "192.168.143.90"
    global_vm_ci_ip_gw: "192.168.143.1"
    global_vm_net_bridge: "net143"
    #
    global_template_vm_id: 9221
    global_template_name: "template-vm-small-01-4g-32g - id : 9221"

