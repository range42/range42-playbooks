#
# Per-VM bootstrap of the admin platform VMs :
#   - admin-wazuh (gated INSTALL_WAZUH, default NO) : Wazuh SIEM server
#   - admin-misp  (gated INSTALL_MISP,  default NO) : MISP threat intel stack
#   - admin-deployer-api-gateway / api-backend / ui (gated INSTALL_DEPLOYER_UI, default NO) : deployer platform
#

# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/proxmox/vm.bootstrap/main.yml"
  when: INSTALL_WAZUH | default("NO") | upper == "YES"
  vars:
    global_vm_name:        "init-admin-wazuh"
    global_vm_ssh_name:    "r42.init-admin-wazuh"
    global_vm_id:          990
    global_vm_description: "init_lab - Wazuh SIEM server (optional)"
    global_vm_tag_name:    "admin"
    global_vm_ci_ip:       "192.168.142.90"
    global_template_vm_id: 9232
    global_template_name:  "03-template-vm-medium-02-8g-64g - 9232"
    global_vm_net_virtio_bridge:  "net142"
    global_vm_ci_ip_gw:           "192.168.142.1"

