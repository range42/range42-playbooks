##
## admin-wazuh - Wazuh SIEM server stack on r42.admin-wazuh
##
## Delegates to the shared bundle which provides the full server pipeline
## (firewall + indexer + dashboard + manager + filebeat-oss + password
## rotation). The wazuh-agent install on the client group is a separate
## group-level finalize step ; see _finalize-baseline-admin_wazuh_client.yml.
##
## Gated by INSTALL_WAZUH (default NO per debug_scenario_b feature_flags.yml).
##

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/admin/software.install.wazuh/main.yml"
  when: INSTALL_WAZUH | default("NO") | upper == "YES"
  vars:
    global_vm_ssh_name: "r42.admin-wazuh"
    global_vm_ci_ip:    "192.168.142.155"
