---
- name: Validate the exact native workshop template hardware before creating guests
  hosts: proxmox
  gather_facts: false
  vars_files:
    - "{{ lookup('env', 'RANGE42_ACTIVE_CONFIG_DIR') }}/secrets/default_vault.yml"
  tasks:
    - name: Read both selected source template configurations
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/qemu/{{ item }}/config"
        headers: {Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"}
        validate_certs: true
        follow_redirects: none
      loop: "{{ [range42_workshop_plan.proxmox_template, range42_workshop_plan.deployer_template] }}"
      register: workshop_source_templates
      no_log: true
    - name: Require clean template hardware and native first-boot support
      ansible.builtin.assert:
        that:
          - item.json.data.template | int == 1
          - item.json.data.lock is not defined
          - item.json.data.ide2 is search('cloudinit')
          - item.json.data.scsi0 is search('(^|,)size=32G(,|$)')
          - item.json.data.agent | string is match('^(1|enabled=1)(,|$)')
          - item.json.data | dict2items | selectattr('key', 'match', '^net[0-9]+$') | map(attribute='key') | list == ['net0']
          - item.json.data.net0 is string
          - item.json.data.net0 is match('^[A-Za-z][A-Za-z0-9_-]*=(?:[0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}(?:,|$)')
          - item.json.data.net0 | regex_findall('(?:^|,)bridge=') | length == 1
          - item.json.data.net0 is search('(?:^|,)bridge=[A-Za-z][A-Za-z0-9_.-]{0,14}(?:,|$)')
          - item.json.data | dict2items | selectattr('key', 'match', '^(hostpci[0-9]+|usb[0-9]+|unused[0-9]+|args|hookscript|cicustom|net[1-9][0-9]*)$') | list | length == 0
      loop: "{{ workshop_source_templates.results }}"
      loop_control: {label: "{{ item.item }}"}
      no_log: true
    - name: Require the nested hypervisor's separate lab disk and hardware virtualization
      ansible.builtin.assert:
        that:
          - workshop_source_templates.results[0].json.data.cpu == 'host'
          - workshop_source_templates.results[0].json.data.scsi1 is search('(^|,)size=128G(,|$)')
      no_log: true
