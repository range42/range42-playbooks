##
## Baseline for r42_admin_active runtime group (_init_lab) :
##   - systems.baseline.default    : packages + dotfiles
##   - firewall/in_vm/os_firewall.baseline.ssh : in-VM firewall opens port 22 (wazuh / misp service
##                                   ports opened by their respective bundles)
##   - network.configure.tailscale_client         : optional tailscale install (gated INSTALL_TAILSCALE,
##                                   default NO)
##
## Targets r42_admin_active (built by ../_build_admin_active_group.yml from the
## INSTALL_<flag> values at deploy time). Each baseline play only runs on admin
## VMs that stage_00 actually created - every admin VM is flag-gated, deployer
## trio included (INSTALL_DEPLOYER_UI).
##

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/generic/systems.baseline.default/main.yml"
  vars:
    target_group: "r42_admin_active"

## PILOT of the firewall migration: the strict mirror of network.baseline.ssh, under its
## real name - this is the firewall INSIDE the VM, not the Proxmox one. Same body, verified.
- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/firewall/in_vm/os_firewall.baseline.ssh/main.yml"
  vars:
    target_group: "r42_admin_active"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/generic/network.configure.tailscale_client/main.yml"
  vars:
    target_group: "r42_admin_active"
    INSTALL_TAILSCALE: "NO"
    tailscale_hostnames:
      - "init-admin-wazuh"
      - "init-admin-misp"
      - "init-admin-deployer-api-gateway"
      - "init-admin-deployer-api-backend"
      - "init-admin-deployer-ui"
      - "init-admin-gitea"
      - "init-admin-mattermost"
      - "init-admin-nextcloud"
      - "init-admin-rocketchat"
