---
# Network provisioning for the universal scenario.
#
# Creates the per-scope Linux bridge on the Proxmox node when it is missing,
# using the backend-resolved values from r42_network_map (the single source of
# truth: the backend renders node-level cidr/bridge/gateway templates). Falls
# back to the legacy 192.168.{bridge_base + team_id} scheme when a network node
# carries no explicit values, so existing topologies are unchanged.
#
# Idempotent: an already-present bridge is left untouched, and the NAT rule is
# applied via the idempotent iptables module (so re-deploys onto existing
# bridges add no duplicates). NOTE (verified live on pve01): creating a NEW
# bridge still triggers a full Proxmox network reload (PUT), which re-runs the
# OTHER bridges' legacy `post-up iptables -A` hooks and appends duplicate
# MASQUERADE rules (+N per new bridge). The systemic fix is to make the host
# bridges' NAT idempotent / move it out of post-up (see backend #82/#85).
#
# Caller must have set:
#   topology: dict
#   existing_bridges: list[str]          — bridge names cached at play start
#   r42_network_map: dict                — from inventory all.vars (may be {})
#   proxmox_api_host / proxmox_api_user / proxmox_api_token_id /
#     proxmox_api_token_secret / proxmox_node
#
# Inputs (per loop iteration):
#   net_item: { team_id: int | None, item: <topology network node dict> }
#
# NOTE: bridge create + reload + NAT touch live Proxmox host networking and
# MUST be validated on a real deploy (see PR). The Proxmox API stages the new
# interface (POST) and the reload (PUT) applies it. NAT here is applied at
# runtime; persisting it across a host reboot is a tracked follow-up.

- name: "Network: team key for r42_network_map lookup"
  ansible.builtin.set_fact:
    _team_key: "{{ (net_item.team_id if net_item.team_id is not none else 'shared') | string }}"

- name: "Network: resolved bridge/cidr/gateway for this scope"
  ansible.builtin.set_fact:
    _net: "{{ (r42_network_map | default({})).get(net_item.item.id, {}).get(_team_key, {}) }}"

- name: "Network: compute bridge name, subnet cidr and host-side address"
  ansible.builtin.set_fact:
    _expected_bridge: >-
      {{ _net.bridge | default((topology.bridge_base | default(140))
         | r42_bridge_for_team(net_item.team_id | default(0, true))) }}
    _net_cidr: >-
      {{ _net.cidr | default((topology.bridge_base | default(140))
         | r42_subnet_for_team(net_item.team_id | default(0, true))) }}
    _net_gateway: >-
      {{ _net.gateway | default('192.168.'
         ~ ((topology.bridge_base | default(140) | int)
            + (net_item.team_id | default(0, true) | int)) ~ '.1') }}

- name: "Network: create bridge when missing"
  when: _expected_bridge not in (existing_bridges | default([]))
  block:
    - name: "Network: stage bridge via Proxmox API"
      ansible.builtin.include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: "network_add_interfaces_node"
        iface_name: "{{ _expected_bridge }}"
        iface_type: "bridge"
        iface_autostart: 1
        ip_cidr: "{{ _net_gateway }}/{{ _net_cidr | regex_replace('^.*/', '') }}"

    - name: "Network: apply staged interface changes (reload)"
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}/api2/json/nodes/{{ proxmox_node }}/network"
        method: PUT
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
        # Lab Proxmox hosts use self-signed certs; verification is disabled
        # repo-wide (proxmox_controller role does the same). Overridable so a
        # hardened deployment can enable it. Systemic TLS pinning: backend #85.
        validate_certs: "{{ proxmox_validate_certs | default(false) }}"
        status_code: 200

# Applied unconditionally (idempotent): the bridge may already exist (lab
# bridges pre-exist) or the host may have rebooted and lost the runtime rule.
- name: "Network: ensure idempotent NAT MASQUERADE for the subnet"
  ansible.builtin.iptables:
    table: nat
    chain: POSTROUTING
    source: "{{ _net_cidr }}"
    out_interface: vmbr0
    jump: MASQUERADE
    comment: "range42 {{ _expected_bridge }}"
    state: present
