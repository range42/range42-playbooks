---
##
## nextcloud_lab - main playbook
##
## Structure : multi-level _main + _main_stage_NN per tier - flexible global stage interleaving across tiers without rewriting per-tier plays.
##
## Provisions a single Ubuntu LTS VM (admin-nextcloud-standalone) on net142
## from the project standard medium template (VMID 9232 : 2cpu / 8gb / 64gb) and
## deploys the nextcloud docker-compose stack on it via the shared bundle
## bundles/admin/software.install.nextcloud/.
##
## Nextcloud is modeled as an admin-tier service (uniform 02_admin placement),
## gated by INSTALL_NEXTCLOUD (default YES per manifest/feature_flags.yml -
## nextcloud_lab is the Nextcloud showcase scenario ; the same wrapper defaults
## NO in the general scenarios that offer it as an optional add-on).
##
## Lab topology :
##   - admin-nextcloud-standalone (192.168.142.181, VMID 1181, net142)  - Nextcloud host
##
## Global stage discipline (mirror of demo_lab / misp_lab) :
##   1. 01_templates-bootstrap                    create the shared template (9232)
##   2. ALL tiers stage_00 (vm_bootstrap)         create every VM first
##   3. ALL tiers stage_01 (vm_configure)         configure every VM after
##
