##
## admin-nextcloud - Nextcloud docker-compose stack on r42.admin-nextcloud-standalone
##
## Delegates to the shared bundle which provides the full pipeline (catalog .env
## seed + Docker baseline + firewall 22/8080 + docker compose up of the
## nextcloud stack from range42-catalog).
##
## Gated by INSTALL_NEXTCLOUD (default YES per nextcloud_lab feature_flags.yml -
## this is the Nextcloud showcase scenario ; general scenarios that wire this
## wrapper default NO).
##

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/admin/software.install.nextcloud/main.yml"
  when: INSTALL_NEXTCLOUD | default("YES") | upper == "YES"
  vars:
    global_vm_ssh_name: "r42.admin-nextcloud-standalone"
    global_vm_ci_ip:    "192.168.142.181"
