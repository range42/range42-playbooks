---
##
## gitea_lab - student infrastructure
## Provisions the student client VM and configures end-to-end SSH access to Gitea.
## Mirrors the 03_student_infrastructure pattern from demo_lab.
##

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#### #### #### #### #### #### STAGE 00 #### #### #### #### #### #### #### #### ##
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ##

- import_playbook: ./stage_00/student_gitea_client_01.yml

  vars:
    global_vm_name: "student-gitea-client-01"
    global_vm_ssh_name: "r42.student-gitea-client-01"
    global_vm_id: 1184
    global_vm_description: "gitea_lab - Ubuntu LTS client for SSH key cycle validation"
    global_vm_tag_name: "gitea-lab"
    global_vm_ci_ip: "192.168.142.184"
    #
    global_template_vm_id: 9232
    global_template_name: "template-vm-medium-02-8g-64g - id : 9232"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#### #### #### #### #### #### STAGE 01 #### #### #### #### #### #### #### #### ##
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ##

- import_playbook: ./stage_01/_r42_gitea_client_group.yml
  vars:
    OPERATOR_USER: alice

    INSTALL_VIM_DOTFILES: "YES"
    INSTALL_ZSH_DOTFILES: "YES"

    INSTALL_PACKAGES_BASICS: "YES"
    INSTALL_PACKAGES_FIREWALLS: "YES"
    #
    INSTALL_PACKAGES_DOCKER: "NO"
    INSTALL_PACKAGES_DOCKER_COMPOSE: "NO"
    #
    INSTALL_PACKAGES_UTILS_JSON: "YES"
    INSTALL_PACKAGES_UTILS_NETWORK: "YES"

    INSTALL_PACKAGES_NTP_AND_UPDATE_TIME: "YES"

    INSTALL_TAILSCALE: "NO"

    firewall_rules:
      - ip: "all"
        port: 22
        protocol: "tcp"

# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

- import_playbook: ./stage_01/student_gitea_client_01.yml

