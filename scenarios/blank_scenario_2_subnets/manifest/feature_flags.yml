---
# Feature flags for blank_scenario_2_subnets - optional components that can be
# toggled on/off at deploy time via `-e INSTALL_<NAME>=YES|NO`.
#
# This file is the single source of truth :
#   - the deploy TUI (range42-context --tui) reads `features` to render the
#     checkbox modal before invoking `range42-context deploy`
#   - the playbooks read the `INSTALL_<NAME>` variables via
#     `when: INSTALL_<NAME> | default("YES"|"NO") | upper == "YES"` on the
#     relevant `import_playbook` / `block:` entries
#
# Convention :
#   - `id` is UPPERCASE (matches the variable name : `id: WAZUH` -> `INSTALL_WAZUH`)
#   - `default: true|false` is the checkbox initial state in the TUI
#   - the playbook `default("YES"|"NO")` fallback should align with this
#   - `| upper` makes the check case-insensitive : YES / yes / Yes all match

features:
  - id: WAZUH
    label: "Wazuh stack - SIEM + agents services"
    description: "Deploys an admin-wazuh VM (vm_id 2120, IP 192.168.142.120) under 02_admin_infrastructure/ + agent install on the 3 deployer-* VMs + 4 team VMs. Off by default for blank_scenario_2_subnets (minimal lab scenario, monitoring opt-in)."
    default: false

  - id: MISP
    label: "MISP - threat intel services"
    description: "Deploys an admin-misp VM (vm_id 2124, IP 192.168.142.124) and runs the misp-standalone docker-compose stack from range42-catalog/03_container_layer/docker/admin/misp-standalone/. Operator must populate the catalog's .env file with secrets (MISP_DB_PASSWORD, DB_ROOT_PASSWORD, MISP_ADMIN_PASSWORD, MISP_SALT, etc.) BEFORE deploying with INSTALL_MISP=YES."
    default: false

  - id: GITEA
    label: "Gitea - code services"
    description: "Deploys a bs2-admin-gitea VM (vm_id 2125, IP 192.168.142.125) and runs the gitea docker-compose stack (postgres + gitea) from the admin bundle. Optional admin service, off by default."
    default: false

  - id: MATTERMOST
    label: "Mattermost - chat services"
    description: "Deploys a bs2-admin-mattermost VM (vm_id 2126, IP 192.168.142.126) and runs the mattermost docker-compose stack (postgres + mattermost) from the admin bundle. Optional admin service, off by default."
    default: false

  - id: NEXTCLOUD
    label: "Nextcloud - files storage services"
    description: "Deploys a bs2-admin-nextcloud VM (vm_id 2127, IP 192.168.142.127) and runs the nextcloud docker-compose stack (postgres + redis + nextcloud) from the admin bundle. Align NC_DOMAIN in the catalog .env to include this VM IP before deploy. Optional admin service, off by default."
    default: false

  - id: ROCKETCHAT
    label: "RocketChat - chat services"
    description: "Deploys a bs2-admin-rocketchat VM (vm_id 2128, IP 192.168.142.128) and runs the rocketchat docker-compose stack (mongodb + rocketchat) from the admin bundle. MongoDB replica-set cold-start takes ~90-180s on first deploy. Optional admin service, off by default."
    default: false

  - id: TAILSCALE
    label: "Tailscale VPN client"
    description: "Per-group install. Off by default."
    default: false
