#
# Templates (Ubuntu Noble family) lifted to bundles/core/proxmox/configure/templates/.
# Local copies under ./01_init_proxmox/templates/ are kept as a rollback safety net
# under the suffix `.old_before_bundles` (so Ansible cannot accidentally pick them
# up). They can be deleted entirely once this POC is validated on real Proxmox.
#
# All paths anchor on $RANGE42_GITDIR__ROOT_DIR (exported by the workspace's
# `sourced_range42.sh` on every shell session). No relative `../../` traversal,
# no PWD lookup - the bundle entry path is the same regardless of where
# ansible-playbook is invoked from, and `playbook_dir` quirks at import time
# do not affect this resolution (env lookups are constant for the whole run).
#
- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/proxmox/configure/templates/_main_download_cloudinit_files.yml"

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/proxmox/configure/templates/ubuntu_noble/main.yml"
  vars:
    manifest_path:       "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/scenarios/demo_lab_bundles/manifest/scenario_vms.json"
    template_bundle_dir: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/proxmox/configure/templates/ubuntu_noble"

