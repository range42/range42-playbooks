##
## Baseline for r42_admin group :
##   - system-baseline-default     : packages + dotfiles
##   - network-baseline-ssh        : firewall opens port 22
##   - tailscale-on-group          : optional tailscale install (gated by INSTALL_TAILSCALE)
##

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/system-baseline-default/main.yml"
  vars:
    target_group: "r42_admin"

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/network-baseline-ssh/main.yml"
  vars:
    target_group: "r42_admin"

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/tailscale-on-group/main.yml"
  vars:
    target_group: "r42_admin"
    INSTALL_TAILSCALE: "NO"
    tailscale_hostnames:
      - "admin-wazuh"
      # - "admin-builder-docker-registry"  # disabled — re-enable when needed
      - "admin-deployer-api-gateway"
      - "admin-deployer-api-backend"
      - "admin-deployer-ui"
      # - "testing-wazuh-client"           # disabled — re-enable when wazuh config is validated
