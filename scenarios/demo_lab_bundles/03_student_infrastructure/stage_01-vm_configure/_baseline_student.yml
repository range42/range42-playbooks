##
## Baseline for r42_student_box_group :
##   - system-baseline-with-utils  : packages + dotfiles + utils (net + json)
##   - network-baseline-ssh        : firewall opens port 22
##   - tailscale-on-group          : tailscale install (INSTALL_TAILSCALE=YES)
##

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/system-baseline-with-utils/main.yml"
  vars:
    target_group: "r42_student_box_group"

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/network-baseline-ssh/main.yml"
  vars:
    target_group: "r42_student_box_group"

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/tailscale-on-group/main.yml"
  vars:
    target_group: "r42_student_box_group"
    INSTALL_TAILSCALE: "YES"
    tailscale_hostnames:
      - "student-box-01"
      # - "student-box-02"
      # - "student-box-03"
      # - "student-box-04"
