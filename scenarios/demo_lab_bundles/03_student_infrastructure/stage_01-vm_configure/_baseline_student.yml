##
## Baseline for r42_student_box_group : packages + dotfiles + firewall (shared bundle)
## plus tailscale setup (shared bundle, gated by INSTALL_TAILSCALE).
##

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/baseline/main.yml"
  vars:
    target_group: "r42_student_box_group"
    INSTALL_PACKAGES_UTILS_JSON: "YES"

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/tailscale-on-group/main.yml"
  vars:
    target_group: "r42_student_box_group"
    INSTALL_TAILSCALE: "YES"
    tailscale_hostnames:
      - "student-box-01"
      - "student-box-02"
      - "student-box-03"
      - "student-box-04"