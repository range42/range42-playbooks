---
##
## catalog_try - main playbook
##
## Provisions a single disposable VM (catalog-try-vm-docker) with the Docker baseline.
## The VM is used by `range42-context catalog-try <path>` to deploy individual
## range42-catalog elements for fast iteration.
##
## Mirrors the demo_lab pattern :
##   01_init_proxmox        : download cloud-init image + create template 9221 (idempotent skip if already present)
##   02_catalog-try_infrastructure : VM clone + cloud-init + start + wait-for-SSH + Docker baseline
##

#### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#### #### #### #### 01_init_proxmox - template creation #### #### #### ####
#### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- import_playbook: ./01_init_proxmox/templates/_main_download_cloudinit_files.yml
- import_playbook: ./01_init_proxmox/templates/ubuntu_noble/_main_ubuntu_noble.yml

#### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#### #### #### #### 02_catalog-try_infrastructure - STAGE 00 #### #### ####
#### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- import_playbook: ./02_catalog-try_infrastructure/stage_00/catalog_try_vm.yml

  vars:
    global_vm_name: "catalog-try-vm-docker"
    global_vm_ssh_name: "r42.catalog-try-vm-docker"
    global_vm_id: 1250
    global_vm_description: "catalog-try - disposable VM for single-element validation"
    global_vm_tag_name: "catalog-try"
    global_vm_ci_ip: "192.168.142.250"
    #
    global_template_vm_id: 9221
    global_template_name: "template-vm-small-01-4g-32g - id : 9221"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#### #### #### #### 02_catalog-try_infrastructure - STAGE 01 #### #### ####
#### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- import_playbook: ./02_catalog-try_infrastructure/stage_01/_r42_catalog_try_group.yml

  vars:
    OPERATOR_USER: alice

    INSTALL_VIM_DOTFILES: "YES"
    INSTALL_ZSH_DOTFILES: "YES"

    INSTALL_PACKAGES_BASICS: "YES"
    INSTALL_PACKAGES_FIREWALLS: "YES"
    #
    INSTALL_PACKAGES_DOCKER: "YES"
    INSTALL_PACKAGES_DOCKER_COMPOSE: "YES"
    #
    INSTALL_PACKAGES_UTILS_JSON: "NO"
    INSTALL_PACKAGES_UTILS_NETWORK: "YES"

    INSTALL_PACKAGES_NTP_AND_UPDATE_TIME: "YES"

    INSTALL_TAILSCALE: "NO"

    firewall_rules:
      - ip: "all"
        port: 22
        protocol: "tcp"

