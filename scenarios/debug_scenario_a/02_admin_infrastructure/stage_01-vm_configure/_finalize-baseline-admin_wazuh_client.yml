##
## _finalize-baseline-admin_wazuh_client - cross-tier post-setup action
##
## Installs the wazuh agent on the debug_scenario_a wazuh clients group
## (dsa-vm-01 [+ admin-misp if INSTALL_MISP=YES]).
##
## Ordering constraints (TWO independent deps - both must be satisfied) :
##   1. AFTER admin-wazuh.yml (tier 02 stage_01) : the wazuh server must
##      exist + be reachable so the agents can enroll with the manager.
##   2. AFTER tier 03 stage_01 : the dsa-vm-01 targeted by this play must
##      already be created (stage_00) AND baselined (stage_01). Otherwise
##      the agent install hits UNREACHABLE on hosts that don't exist yet or
##      have no SSH baseline.
##
## Both constraints satisfied by importing this file at the TOP-LEVEL main.yml
## as the LAST entry, AFTER all tier _main_stage_01.yml imports. NEVER import
## from inside a tier's _main.yml / _main_stage_01.yml - that would
## re-introduce the cross-tier ordering bug.
##
## Group-level scope : targets r42_debug_scenario_a_wazuh_clients_active
## (runtime group built by _build_wazuh_clients_active_group.yml from INSTALL
## flags ; up to 2 hosts : admin-misp [if INSTALL_MISP=YES] + dsa-vm-01 -
## excludes the wazuh server itself by design).
##
## Per-host gating via the runtime active group : no UNREACHABLE on VMs that
## don't exist at deploy time (e.g. admin-misp with INSTALL_MISP=NO).
##
## Gated by INSTALL_WAZUH (default NO).
##

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/admin/software.install.wazuh-agent/main.yml"
  when: INSTALL_WAZUH | default("NO") | upper == "YES"
  vars:
    wazuh_clients_group: "r42_debug_scenario_a_wazuh_clients_active"
    global_vm_ci_ip:     "192.168.142.150"
