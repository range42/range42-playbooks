##
## gitea_lab stage_01 - software install on r42_gitea_client_group
##
## Minimal baseline for the student client VM: basic packages (includes git),
## dot-files, and firewall (SSH only). No Docker — the client only needs to
## clone via SSH from Gitea.
## Targets the r42_gitea_client_group inventory group (defined in
## templates/ansible-inventory.j2), containing host r42.student-gitea-client-01.
##

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: install basics packages
  hosts: r42_gitea_client_group
  become: true
  roles:
    - software.install.warmup.basic_packages

  #
  # variables will be overwritten by values in _main.yml
  #
  vars:
    INSTALL_PACKAGES_BASICS: "YES"
    INSTALL_PACKAGES_FIREWALLS: "YES"
    #
    INSTALL_PACKAGES_DOCKER: "NO"
    INSTALL_PACKAGES_DOCKER_COMPOSE: "NO"
    #
    INSTALL_PACKAGES_UTILS_JSON: "YES"
    INSTALL_PACKAGES_UTILS_NETWORK: "YES"

    INSTALL_PACKAGES_NTP_AND_UPDATE_TIME: "YES"

    SPECIFIC_PACKAGES_CLEANING: "NO"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: install dot files
  hosts: r42_gitea_client_group
  become: true
  roles:
    - software.install.warmup.dot_files

  vars:
    #
    # variables will be overwritten by values in _main.yml
    #
    OPERATOR_USER: alice
    INSTALL_VIM_DOTFILES: "YES"
    INSTALL_ZSH_DOTFILES: "YES"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- name: configure firewall - ssh only
  become: true
  hosts: r42_gitea_client_group
  roles:
    - software.configure.firewalls

  vars:
    #
    # variables will be overwritten by values in _main.yml
    #
    firewall_rules:
      - ip: "all"
        port: 22
        protocol: "tcp"

#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
