---
##
## 03 - student infrastructure - stage_01 (vm_configure)
##
## Structure : stage_01 unit imported by top-level main.yml. Imports ONLY the
## SSH-only baseline (_r42_gitea_client_group.yml) - the SSH-cycle glue
## (stage_01-vm_configure/student_gitea_client_01.yml) is the cross-tier
## FINALIZE run, imported LAST by the top-level main.yml because it depends on
## the Gitea server (admin-gitea-standalone) being up. See main.yml.
##
## Applies the minimal client baseline : basic packages (git), dotfiles, and a
## firewall opening SSH only. Targets the r42_gitea_client_group inventory group
## (host r42.student-gitea-client-01).
##
## Imported from the top-level main.yml during the global stage_01 phase
## (after ALL tiers stage_00 completed). See main.yml.
##

- import_playbook: ./stage_01-vm_configure/_r42_gitea_client_group.yml
  vars:
    OPERATOR_USER: alice

    INSTALL_VIM_DOTFILES: "YES"
    INSTALL_ZSH_DOTFILES: "YES"

    INSTALL_PACKAGES_BASICS: "YES"
    INSTALL_PACKAGES_FIREWALLS: "YES"
    #
    INSTALL_PACKAGES_DOCKER: "NO"
    INSTALL_PACKAGES_DOCKER_COMPOSE: "NO"
    #
    INSTALL_PACKAGES_UTILS_JSON: "YES"
    INSTALL_PACKAGES_UTILS_NETWORK: "YES"

    INSTALL_PACKAGES_NTP_AND_UPDATE_TIME: "YES"

    INSTALL_TAILSCALE: "NO"

    firewall_rules:
      - ip: "all"
        port: 22
        protocol: "tcp"
