---
##
## gitea_lab - fast redeploy (skip template creation)
## Assumes template VMID 9232 is already present on Proxmox.
## Usage: ./gitea_lab.setup_vms_only.sh   (or range42-context deploy-vms)
##

- import_playbook: ./02_gitea_lab_infrastructure/stage_00/gitea_lab_vm.yml
  vars:
    global_vm_name: "admin-gitea-standalone"
    global_vm_ssh_name: "r42.admin-gitea-standalone"
    global_vm_id: 1183
    global_vm_description: "gitea_lab - Ubuntu LTS host for Gitea via docker-compose"
    global_vm_tag_name: "gitea-lab"
    global_vm_ci_ip: "192.168.142.183"
    global_template_vm_id: 9232
    global_template_name: "template-vm-medium-02-8g-64g - id : 9232"

- import_playbook: ./02_gitea_lab_infrastructure/stage_01/_r42_gitea_lab_group.yml
  vars:
    INSTALL_DOCKER: "YES"
    INSTALL_DOCKER_COMPOSE: "YES"
    INSTALL_JQ: "YES"
    INSTALL_NETWORK_TOOLS: "YES"
    INSTALL_NTP: "YES"
    INSTALL_TAILSCALE: "NO"
    firewall_rules:
      - port: 22
        proto: tcp
        rule: allow
