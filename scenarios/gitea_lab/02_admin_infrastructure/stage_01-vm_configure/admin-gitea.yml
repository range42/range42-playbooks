##
## admin-gitea - Gitea docker-compose stack on r42.admin-gitea-standalone
##
## Delegates to the shared bundle which provides the full pipeline (catalog .env
## seed + Docker baseline + firewall 22/3000/2222 + docker compose up of the
## gitea stack from range42-catalog).
##
## Gated by INSTALL_GITEA (default YES per gitea_lab feature_flags.yml -
## this is the Gitea showcase scenario ; general scenarios that wire this
## wrapper default NO).
##

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/admin/software.install.gitea/main.yml"
  when: INSTALL_GITEA | default("YES") | upper == "YES"
  vars:
    global_vm_ssh_name: "r42.admin-gitea-standalone"
    global_vm_ci_ip:    "192.168.142.183"
