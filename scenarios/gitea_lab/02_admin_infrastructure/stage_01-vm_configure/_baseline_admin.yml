##
## Baseline for r42_admin_active runtime group (gitea_lab) :
##   - systems.baseline.default    : packages + dotfiles
##   - network-baseline-ssh        : firewall opens port 22 (the gitea
##                                   service ports 3000 + 2222 are opened by the
##                                   software.install.gitea bundle itself)
##   - tailscale-on-group          : optional tailscale install (gated INSTALL_TAILSCALE,
##                                   default NO)
##
## Targets r42_admin_active (built by ../_build_admin_active_group.yml from the
## INSTALL_GITEA value at deploy time). The baseline only runs on the admin
## VM that stage_00 actually created.
##

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/generic/systems.baseline.default/main.yml"
  vars:
    target_group: "r42_admin_active"

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/network-baseline-ssh/main.yml"
  vars:
    target_group: "r42_admin_active"

- import_playbook: "{{ lookup('env', 'RANGE42_GITDIR__ROOT_DIR') }}/range42-playbooks/bundles/core/tailscale-on-group/main.yml"
  vars:
    target_group: "r42_admin_active"
    INSTALL_TAILSCALE: "NO"
    tailscale_hostnames:
      - "admin-gitea-standalone"
