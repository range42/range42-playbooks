---
##
## ad_lab - main playbook
##
## Structure : multi-level _main + _main_stage_NN per tier - flexible global stage interleaving across tiers without rewriting per-tier plays.
##
## Active Directory lab on net151 :
##   - ad-dc01     (192.168.151.201, VMID 1201, template 9250) - Windows Server 2025, domain controller
##                 of range42.lab (NetBIOS RANGE42), DNS server of the domain
##   - ad-client01 (192.168.151.202, VMID 1202, template 9251) - Windows 11, member of range42.lab
##   - ad-wazuh01  (192.168.142.204, VMID 1204, template 9232) - optional (INSTALL_WAZUH=YES) :
##                 Wazuh manager on the admin LAN net142, agents on both Windows VMs
##
## Global stage discipline (mirror of misp_lab / kunai_lab) :
##   1. 00_sdn_bootstrap                       create the vnets (net140, net151 ; net142 with
##                                             INSTALL_WAZUH=YES) when missing
##   2. 01_templates-bootstrap                 build the Windows templates (9250, 9251) when missing ;
##                                             the Linux template 9232 must already exist
##   3. ALL tiers stage_00 (vm_bootstrap)      create every VM first
##   4. ALL tiers stage_01 (vm_configure)      configure every VM after
##   5. Wazuh agents (INSTALL_WAZUH=YES)       after every stage_01 step
##
#### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#### #### #### #### 00 - SDN BOOTSTRAP #### #### #### #### #### #### ####
#### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
##
## MUST run first : net140 is the templating network and the Windows 11 template build downloads
## the OpenSSH server through it.
##

## The firewall wiring lives in ./_firewall/, one file per MOMENT - see its README. Arming
## happens at end_scenario, opt-in: FIREWALL_ARM_VMS=YES (default NO).
## The preflight runs before them : it stops a workspace without the generated AD passwords
## before any change.
- import_playbook: ./_preflight.yml
- import_playbook: ./_firewall/stage_00-pre_scenario.report_status.yml
- import_playbook: ./_firewall/stage_01-pre_scenario.management_access.yml

- import_playbook: ./00_sdn_bootstrap/_main.yml


