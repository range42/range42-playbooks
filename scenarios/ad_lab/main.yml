##
## ad_lab - main playbook
##
## Structure : multi-level _main + _main_stage_NN per tier - flexible global stage interleaving across tiers without rewriting per-tier plays.
##
## Active Directory lab on net151 :
##   - ad-dc01     (192.168.151.201, VMID 1201, template 9250) - Windows Server 2025, domain controller
##                 of range42.lab (NetBIOS RANGE42), DNS server of the domain
##   - ad-client01 (192.168.151.202, VMID 1202, template 9251) - Windows 11, member of range42.lab
##
## Global stage discipline (mirror of misp_lab / kunai_lab) :
##   1. 00_sdn_bootstrap                       create the vnets (net140, net151) when missing
##   2. 01_templates-bootstrap                 build the Windows templates (9250, 9251) when missing
##   3. ALL tiers stage_00 (vm_bootstrap)      create every VM first
##   4. ALL tiers stage_01 (vm_configure)      configure every VM after
##
