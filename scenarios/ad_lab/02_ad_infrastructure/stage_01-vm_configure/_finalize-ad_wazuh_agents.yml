##
## _finalize-ad_wazuh_agents - the Wazuh agent on ad-dc01 and ad-client01, INSTALL_WAZUH=YES
##
## Imported by main.yml AFTER every stage_01 step : the DC promotion and the domain join reboot
## the hosts, and the manager (ad-wazuh.yml) must answer before an agent enrolls.
##
## Each agent enrolls on 192.168.142.204 tcp 1515 without a password and reports on tcp 1514,
## routed from net151 through the node. Its name is the host name (the inventory name without
## "r42."). The Proxmox accepts on 1204 admit these two sources only : see ad-wazuh.yml.
##
## Without the flag the runtime group r42_ad_wazuh_agents_active stays empty : the agent play
## matches no host and runs no task on the AD hosts.
##

- name: "ad_lab - wazuh agents : runtime group"
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: AD LAB WAZUH - ADD THE WINDOWS VMS TO r42_ad_wazuh_agents_active
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: r42_ad_wazuh_agents_active
      loop:
        - r42.ad-dc01
        - r42.ad-client01
      changed_when: false
      when: INSTALL_WAZUH | default("NO") | upper == "YES"

- import_playbook: "{{ lookup('env', 'RANGE42_BUNDLE_DIR') }}/admin/software.install.wazuh_agent_windows/main.yml"
  vars:
    TARGET_GROUP: "r42_ad_wazuh_agents_active"
    WAZUH_MANAGER: "192.168.142.204"
    WAZUH_REGISTRATION_SERVER: "192.168.142.204"
    WAZUH_AGENT_NAME: "{{ inventory_hostname | regex_replace('^r42[.]', '') }}"
