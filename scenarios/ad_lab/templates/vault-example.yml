---
################################################################################
# range42 - vault secrets (ad_lab)
#
# This file contains ALL secret values for this CODENAME-SCENARIO.
# ad_lab brings up a Windows domain controller and a Windows domain member.
# The operator SSH key and password get auto-generated by the wizard at
# workspace setup ; the Proxmox secrets and the Active Directory passwords
# must be provided.
#
# Usage:
#   1. Copy this file: cp vault.yml.example vault.yml
#   2. Fill in real values
#   3. Encrypt: ansible-vault encrypt vault.yml
#   4. Never commit the unencrypted version
#
# Password format: use only a-z A-Z 0-9 - _ (20+ characters recommended)
#
################################################################################


#### PROXMOX API SECRET ####

# api token secret - generated by proxmox.api-token or imported from existing
proxmox_api_token_secret: "REPLACE_ME"


#### JUMP HOST ####

# jump user password (initial password, used for user creation)
jump_password: "REPLACE_ME"


#### CLOUD-INIT PASSWORDS ####

# admin vm (alice) password
default_admin_vm_ci_password: "REPLACE_ME"

# admin vm (alice) ssh public key - populated by credentials.generate
default_admin_vm_ci_ssh_key: "ssh-ed25519 AAAA... alice CODENAME-SCENARIO"


#### ACTIVE DIRECTORY ####

# Directory Services Restore Mode (DSRM) password of the domain controller
ad_lab_dsrm_password: "REPLACE_ME"

# built-in Administrator (RID 500) of ad-dc01, set before the promotion :
# it becomes the password of the domain Administrator (RANGE42\Administrator),
# also used to join ad-client01 to the domain
ad_lab_builtin_admin_password: "REPLACE_ME"

# password of the demo domain user bob (RANGE42\bob)
ad_lab_user_password: "REPLACE_ME"

# The Windows password policy of the domain applies to these three values :
# at least 7 characters and three of the four classes (upper case, lower case,
# digits, symbols). Use 20+ characters of a-z A-Z 0-9 - _ with at least one
# upper case letter, one lower case letter and one digit.


#### DEPLOYER-CLI KNOWN HOSTS ####

# operator-side known_hosts snapshot used by the wait-for-SSH task
deployer_cli_user_ssh_known_hosts: "REPLACE_ME"
