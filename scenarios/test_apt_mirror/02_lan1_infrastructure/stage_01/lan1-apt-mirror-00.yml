##
## stage_01 — software install for lan1-apt-mirror-00
## catalog roles are referenced BY NAME (resolved via ANSIBLE_ROLES_PATH at deploy);
## one play per attachment so each carries its own params (firewall_rules, docker …).
##

- name: "lan1-apt-mirror-00 — software.configure.firewalls"
  hosts: r42.lan1-apt-mirror-00
  become: true
  vars_files:
    - "../../secrets/default_vault.yml"
  vars:
    firewall_rules:
    - ip: all
      port: 22
      protocol: tcp
    - ip: all
      port: 80
      protocol: tcp
  roles:
    - software.configure.firewalls

- name: "lan1-apt-mirror-00 — software.install.warmup.basic_packages"
  hosts: r42.lan1-apt-mirror-00
  become: true
  vars_files:
    - "../../secrets/default_vault.yml"
  roles:
    - software.install.warmup.basic_packages

- name: "lan1-apt-mirror-00 — software.install.apt_mirror"
  hosts: r42.lan1-apt-mirror-00
  become: true
  vars_files:
    - "../../secrets/default_vault.yml"
  vars:
    apt_mirror_backports: false
    apt_mirror_debian_trixie: true
    apt_mirror_http_port: 80
    apt_mirror_include_sources: false
    apt_mirror_prewarm: true
    apt_mirror_root: /var/spool/apt-mirror
    apt_mirror_security: true
    apt_mirror_threads: 20
    apt_mirror_ubuntu_components: main restricted universe
    apt_mirror_ubuntu_resolute: true
  roles:
    - software.install.apt_mirror
