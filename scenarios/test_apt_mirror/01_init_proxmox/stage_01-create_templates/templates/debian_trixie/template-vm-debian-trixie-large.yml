#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####
#
# PROXMOX INIT - create debian_trixie template VM template-vm-debian-trixie-large (id 9341)
#
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- hosts: proxmox
  gather_facts: false
  vars_files:
    - "../../../../secrets/default_vault.yml"

  tasks:
    #### IDEMPOTENCE - skip if already finalized as template ####
    - name: TEMPLATE 9341 - CHECK if already finalized as template
      ansible.builtin.shell: qm config 9341 2>/dev/null | grep -q '^template:'
      register: tpl_9341_is_template
      failed_when: false
      changed_when: false
      delegate_to: "{{ inventory_hostname }}-cli"

    - name: TEMPLATE 9341 - WAIT for unlock if a parallel deploy holds the VM
      ansible.builtin.shell: qm config 9341 | grep -q '^lock:'
      register: tpl_9341_lock
      until: tpl_9341_lock.rc != 0
      retries: 30
      delay: 10
      failed_when: false
      changed_when: false
      delegate_to: "{{ inventory_hostname }}-cli"
      when: tpl_9341_is_template.rc != 0

    - name: TEMPLATE 9341 - SKIP all (already finalized as template)
      ansible.builtin.debug:
        msg: "Template 9341 is already a template - skipping. Run delete-everything to recreate."
      when: tpl_9341_is_template.rc == 0

    #### vm_create idempotence: separate exists check ####
    - name: TEMPLATE 9341 - CHECK if VM exists (vm_create idempotence)
      ansible.builtin.shell: qm config 9341 2>/dev/null
      register: tpl_9341_exists
      failed_when: false
      changed_when: false
      delegate_to: "{{ inventory_hostname }}-cli"
      when: tpl_9341_is_template.rc != 0

    - name: PROXMOX INIT - TEMPLATES - CREATE TEMPLATE - template-vm-debian-trixie-large
      include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: "vm_create"
        vm_id: 9341
        vm_name: "template-vm-debian-trixie-large"
        vm_cpu: "host"
        vm_cores: 2
        vm_sockets: 1
        vm_memory: 8192
        vm_net_virtio_bridge: "vmbr140"
      when:
        - tpl_9341_is_template.rc != 0
        - tpl_9341_exists.rc != 0

    - name: PROXMOX INIT - TEMPLATES - WAIT for vm_create to finish (lock-aware)
      ansible.builtin.shell: qm config 9341 | grep -q '^lock:'
      register: tpl_9341_post_create_lock
      until: tpl_9341_post_create_lock.rc != 0
      retries: 60
      delay: 5
      failed_when: false
      changed_when: false
      delegate_to: "{{ inventory_hostname }}-cli"
      when:
        - tpl_9341_is_template.rc != 0
        - tpl_9341_exists.rc != 0

- hosts: proxmox-cli
  gather_facts: false
  vars_files:
    - "../../../../secrets/default_vault.yml"

  tasks:
    - name: TEMPLATE 9341 - CHECK if already template (proxmox-cli play)
      ansible.builtin.shell: qm config 9341 2>/dev/null | grep -q '^template:'
      register: tpl_9341_is_template
      failed_when: false
      changed_when: false

    - name: PROXMOX INIT - TEMPLATES - IMPORT CLOUD INIT DISK - template-vm-debian-trixie-large
      include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: "template_cloudinit_import_disk"
        proxmox_node: "pve"
        cloudinit_image_full_path: "/var/lib/vz/template/iso/debian-13-genericcloud-amd64.img"
        vm_id: 9341
        vm_disk_size: "500g"
        proxmox_dest_vm_storage_name: "local-lvm"
      when: tpl_9341_is_template.rc != 0

- hosts: proxmox
  gather_facts: false
  vars_files:
    - "../../../../secrets/default_vault.yml"

  tasks:
    - name: TEMPLATE 9341 - CHECK if already template (third play)
      ansible.builtin.shell: qm config 9341 2>/dev/null | grep -q '^template:'
      register: tpl_9341_is_template
      failed_when: false
      changed_when: false
      delegate_to: "{{ inventory_hostname }}-cli"

    - name: PROXMOX INIT - TEMPLATES - SET CLOUD DEFAULT INIT VARIABLE - template-vm-debian-trixie-large
      include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: "cloudinit_set_variables"
        vm_id: 9341
        vm_ci_user: "{{ default_admin_vm_ci_user | default('alice') }}"
        vm_ci_password: "{{ default_trainee_vm_ci_password | default('supersecret') }}"
        vm_ci_ssh_key: "{{ default_trainee_vm_ci_ssh_key }}"
        vm_ci_dns_ips: "1.1.1.1"
        vm_ci_ip: "192.168.140.10"
        vm_ci_netmask: "24"
        vm_ci_ip_gw: "192.168.140.1"
      when: tpl_9341_is_template.rc != 0

    - name: PROXMOX INIT - TEMPLATES - SET PROXMOX TAG
      include_role:
        name: range42-ansible_roles-proxmox_controller
      vars:
        proxmox_vm_action: "vm_set_tag"
        vm_id: 9341
        vm_tag_name: "template"
      when: tpl_9341_is_template.rc != 0
