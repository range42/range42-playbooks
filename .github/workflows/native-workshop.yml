name: Native scenarios and reusable preparation
on:
  push:
    branches: [dev, main, 'feat/**', 'fix/**']
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git openssh-client openssl
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: range42/range42-ansible_roles-proxmox_controller
          ref: e988001493041d6d2fd0c67b2006fe4e7686d374
          path: .runtime-contract/controller
      - uses: actions/checkout@v6
        with:
          repository: range42/range42-catalog
          ref: 4b49f0d3d0b68820e6b88386a95f588dfda6755a
          path: .runtime-contract/catalog
      - run: pip install --no-cache-dir -r tests/requirements-native-workshop.txt
      - name: Verify ownership, inventory and authenticated native Ansible gates
        env:
          RANGE42_WORKSHOP_CONTROLLER_ROLES: ${{ github.workspace }}/.runtime-contract/controller/roles
          RANGE42_WORKSHOP_CATALOG_ROLES: ${{ github.workspace }}/.runtime-contract/catalog/02_ansible_layer/admin/roles
        run: |
          ruff check scenarios/native_install_workshop/filter_plugins scenarios/native_install_workshop/library scenarios/native_install_workshop/files tests/test_native_workshop_runs.py scenarios/catalog_try/catalog_try_lifecycle.py tests/test_catalog_try_lifecycle.py
          pytest -q tests/test_native_workshop_runs.py tests/test_native_workshop_foundation.py tests/test_template_preparation.py tests/test_catalog_try_forwarding.py tests/test_catalog_try_lifecycle.py tests/test_workshop_ui_ssh.py

  native-backend-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/checkout@v6
        with:
          repository: range42/range42-backend-api
          ref: 16d227dafc67e367d1ebe5f4cf2ae281deb24609
          path: .runtime-contract/backend
      - run: pip install --no-cache-dir -r tests/requirements-native-workshop.txt
      - name: Render native backend packaging and verify immutable target binding
        env:
          RANGE42_BACKEND_SOURCE: ${{ github.workspace }}/.runtime-contract/backend
        run: pytest -q tests/test_deployer_api_packaging.py

  ssh-runtime-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ansible-core: ['2.16.3', '2.19.1']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install local SSH compatibility dependencies
        run: >-
          python -m pip install
          'ansible-core==${{ matrix.ansible-core }}' 'pytest==8.3.4'
          'PyYAML==6.0.3' 'Jinja2==3.1.6' 'cryptography==46.0.7'
      - name: Verify runtime SSH bounds and literal recovery arguments
        run: >-
          python -m pytest -q
          tests/test_workshop_ui_ssh.py
          tests/test_catalog_try_forwarding.py
