#
# PROMOX INIT - download cloud init files
#
#### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### #### ####

- hosts: proxmox
  gather_facts: false
  vars_files:
    - "../../secrets/default_vault.yml"

  tasks:
    - name: PROMOX INIT - DOWNLOAD - CLOUD INIT images
      include_role:
        name: range42-ansible_roles-proxmox_controller

      vars:
        proxmox_vm_action: "storage_download_iso"
        # proxmox_node: "VALUE_IMPORTED" # TODO :: UPDATE DOCUMENTATION
        proxmox_storage: "local"
        iso_file_content_type: "iso"
        iso_url: "{{ item.iso_url }}"
        iso_file_name: "{{ item.iso_file_name }}"

      loop:
        - {
            iso_url: "https://cloud-images.ubuntu.com/minimal/daily/noble/current/noble-minimal-cloudimg-amd64.img",
            iso_file_name: "noble-minimal-cloudimg-amd64.img",
          }
        - {
            iso_url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img",
            iso_file_name: "noble-server-cloudimg-amd64.img",
          }

# The download-url API is async (returns a UPID immediately). Poll on
# proxmox-cli until both files are fully on disk before stage_01 imports them.
- hosts: proxmox-cli
  gather_facts: false
  vars_files:
    - "../../secrets/default_vault.yml"

  tasks:
    - name: PROMOX INIT - WAIT for ubuntu noble cloud images to be fully downloaded
      ansible.builtin.stat:
        path: "/var/lib/vz/template/iso/{{ item }}"
      register: _noble_img
      until: _noble_img.stat.exists and _noble_img.stat.size > 100000000
      delay: 10
      retries: 120   # 120 × 10 s = 20 min max
      changed_when: false
      loop:
        - noble-minimal-cloudimg-amd64.img
        - noble-server-cloudimg-amd64.img
